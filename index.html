<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Amunì Tourism</title>
    <script>
        // Rileva smartphone o tablet e reindirizza alla cartella corretta
        if (/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || window.innerWidth <= 768) {
            window.location.href = "mobile/";
        } else {
            window.location.href = "desktop/";
        }
    </script>
</head>
<body style="font-family: sans-serif; padding: 40px;">

    <p>Scegli la versione:</p>

    <p><a href="mobile/">📱 Versione Mobile</a></p>
    <p><a href="desktop/">🖥️ Versione Desktop</a></p>

</body>
</html>
