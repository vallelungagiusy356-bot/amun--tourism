<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Amunì Tourism</title>
    <script>
    // Inizializza il controllo dei parametri URL
    const urlParams = new URLSearchParams(window.location.search);
    
    // Se NON è presente il bypass, esegui lo smistamento
    if (!urlParams.get('bypass')) {
        if (/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || window.innerWidth <= 768) {
            window.location.href = "mobile/mobile_index.html"; 
        } else {
            window.location.href = "desktop/desktop_index.html";
        }
    }
</script>

</head>
<body style="font-family: sans-serif; padding: 40px;">

    <h2>Benvenuto su Amunì Tourism</h2>
    <p>Scegli la versione:</p>

    <!-- Il link mobile punta alla cartella normalmente -->
    <p><a href="mobile/mobile_index.html">📱 Versione Mobile</a></p>

    <!-- Il link desktop punta alla cartella normalmente -->
<p><a href="desktop/desktop_index.html?bypass=true">🖥️ Versione Desktop (Premium)</a></p>


</body>
</html>
