<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amunì Tourism - Trasporti</title>

    <link rel="stylesheet" href="home.css"> 
    <link rel="stylesheet" href="trasporti.css">
</head>
<body>

    <div class="scene-background"></div>

    <button id="audio-trigger" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; border:none; background:transparent; z-index:9999;"></button>
    
    <audio id="bg-music" loop>
        <source src="audio/more-epic-lorem-ipsum-by-ende-dot-app.mp3" type="audio/mpeg">
    </audio>

    <header class="dashboard dashboard-home">
    <div class="left-controls"></div> 

    <div class="logo-container">
        <div class="logo-title" data-i18n="home.amuni_title">AMUNÌ TOURISM</div>
    </div>

    <div class="right-controls">
        <button id="toggle-music" class="btn-audio">🔈</button>
        <div class="lang-switcher">
            <button data-lang="it">🇮🇹</button>
            <button data-lang="en">🇬🇧</button>
            <button data-lang="fr">🇫🇷</button>
            <button data-lang="de">🇩🇪</button>
            <button data-lang="es">🇪🇸</button>
        </div>
    </div>
</header>


    <div class="scroll-content" id="scroll-content">
        
        <main class="home-welcome-poetry">
            <h1 data-i18n="pages.transport_page.company_title"></h1>
            <p data-i18n="pages.transport_page.welcome"></p>
            
            <hr style="border:0; height:1px; background:linear-gradient(to right, transparent, rgba(255, 215, 160, 0.4), transparent); margin:18px 0;">
            
            <p data-i18n="pages.transport_page.company_desc"></p>

            <div class="stops-box">
                <h3 data-i18n="pages.transport_page.stops_title"></h3>
                <ul>
                    <li data-i18n="pages.transport_page.stop_1"></li>
                    <li data-i18n="pages.transport_page.stop_2"></li>
                    <li data-i18n="pages.transport_page.stop_3"></li>
                </ul>
            </div>
        </main>

        <div class="transport-buttons">
            <a href="https://www.autolineerandazzo.it/gli-orari-delle-corse/" target="_blank" class="btn-barocco">
                <span data-i18n="pages.transport_page.btn_schedule"></span> ➡️
            </a>
            <a href="https://biglietteriarandazzo.nextstep17.com/user/login" target="_blank" class="btn-barocco">
                <span data-i18n="pages.transport_page.btn_tickets"></span> ➡️
            </a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const content = document.getElementById("scroll-content");
            setTimeout(() => { content.classList.add("visible"); }, 50);
        });

        // --- LOGICA AUDIO ---
        const audio = document.getElementById("bg-music");
        const trigger = document.getElementById("audio-trigger");
        const toggleBtn = document.getElementById("toggle-music");
        audio.volume = 0.5;
        
        function startMusic() {
            audio.play().catch(() => {});
            if(trigger) trigger.remove();
        }
        document.addEventListener("touchstart", startMusic, { once: true });
        document.addEventListener("click", startMusic, { once: true });

        toggleBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (audio.paused) { audio.play(); toggleBtn.textContent = "🔈"; } 
            else { audio.pause(); toggleBtn.textContent = "🔇"; }
        });

        // --- LOGICA LINGUA (PERCORSO CORRETTO) ---
        let currentLang = localStorage.getItem("lang") || "it";

        function loadLanguage(lang) {
            // Percorso corretto: ./lang/ perché siamo già dentro mobile
            fetch(`./lang/${lang}.json`)
                .then(res => res.json())
                .then(data => {
                    document.querySelectorAll("[data-i18n]").forEach(el => {
                        const key = el.getAttribute("data-i18n");
                        const text = key.split('.').reduce((o,i) => (o ? o[i] : null), data);
                        if (text) el.innerHTML = text;
                    });
                })
                .catch(err => console.error("Errore lingua:", err));
            localStorage.setItem("lang", lang);
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll(".lang-switcher button").forEach(btn => {
                btn.addEventListener("click", () => { loadLanguage(btn.dataset.lang); });
            });
            loadLanguage(currentLang);
        });
    </script>
</body>
</html>
