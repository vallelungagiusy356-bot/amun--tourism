<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amunì Tourism - Trasporti</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="trasporti.css">
    <meta name="theme-color" content="#000000">
</head>
<body>

    <div class="scene-background"></div>

    <header class="dashboard">
        <a href="mobile_index.html" class="btn-home">🏠</a>
        
        <div class="logo-container">
            <div class="logo-title">AMUNÌ TOURISM</div>
        </div>
        
        <div class="lang-switcher">
            <button data-lang="it">🇮🇹</button>
            <button data-lang="en">🇬🇧</button>
            <button data-lang="fr">🇫🇷</button>
            <button data-lang="de">🇩🇪</button>
            <button data-lang="es">🇪🇸</button>
        </div>
    </header>

    <div class="scroll-content" id="scroll-content">
        
        <main class="home-welcome-poetry">
            <h1 data-i18n="pages.transport_page.company_title"></h1>
            <p data-i18n="pages.transport_page.welcome"></p>
            
            <hr style="border:0; height:1px; background:linear-gradient(to right, transparent, rgba(255, 215, 160, 0.4), transparent); margin:18px 0;">
            
            <p data-i18n="pages.transport_page.company_desc"></p>

            <div class="stops-box">
                <h3 data-i18n="pages.transport_page.stops_title"></h3>
                <ul>
                    <li data-i18n="pages.transport_page.stop_1"></li>
                    <li data-i18n="pages.transport_page.stop_2"></li>
                    <li data-i18n="pages.transport_page.stop_3"></li>
                </ul>
            </div>
        </main>

        <div class="transport-buttons">
            <a href="https://www.autolineerandazzo.it/gli-orari-delle-corse/" target="_blank" class="btn-barocco">
                <span data-i18n="pages.transport_page.btn_schedule"></span> ➡️
            </a>
            <a href="https://biglietteriarandazzo.nextstep17.com/user/login" target="_blank" class="btn-barocco">
                <span data-i18n="pages.transport_page.btn_tickets"></span> ➡️
            </a>
        </div>
    </div>

    <script>
        // --- LOGICA LINGUA ---
        let currentLang = localStorage.getItem("lang") || "it";

        function loadLanguage(lang) {
            // Percorso corretto: ./lang/ rispetto alla posizione del file mobile
            fetch(`./lang/${lang}.json`)
                .then(res => res.json())
                .then(data => {
                    document.querySelectorAll("[data-i18n]").forEach(el => {
                        const key = el.getAttribute("data-i18n");
                        // Navigazione sicura nell'oggetto JSON
                        const text = key.split('.').reduce((o,i) => (o ? o[i] : null), data);
                        if (text) el.innerHTML = text;
                    });
                })
                .catch(err => console.error("Errore caricamento lingua:", err));
            localStorage.setItem("lang", lang);
        }

        document.addEventListener("DOMContentLoaded", () => {
            // Inizializzazione bottoni lingua
            document.querySelectorAll(".lang-switcher button").forEach(btn => {
                btn.addEventListener("click", () => { loadLanguage(btn.dataset.lang); });
            });
            // Caricamento lingua iniziale
            loadLanguage(currentLang);
        });
    </script>
</body>
</html>
