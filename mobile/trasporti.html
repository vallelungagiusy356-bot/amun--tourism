<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amunì Tourism - Trasporti</title>

    <link rel="stylesheet" href="home.css"> 
    <link rel="stylesheet" href="trasporti.css">
</head>
<body>

    <button id="audio-trigger" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; border:none; background:transparent; z-index:9999;"></button>
    
    <audio id="bg-music" loop>
        <source src="audio/more-epic-lorem-ipsum-by-ende-dot-app.mp3" type="audio/mpeg">
    </audio>

    <div class="pergamena-container"></div>

    <header class="dashboard">
        <button class="btn-back-dashboard" onclick="window.history.back()" aria-label="Torna indietro">⬅️</button>
        
        <div class="logo-title" data-i18n="menu.transport"></div>

        <button id="toggle-music" class="btn-audio">🔈</button>

        <div class="lang-switcher">
            <button data-lang="it">🇮🇹</button>
            <button data-lang="en">🇬🇧</button>
            <button data-lang="fr">🇫🇷</button>
            <button data-lang="de">🇩🇪</button>
            <button data-lang="es">🇪🇸</button>
        </div>
    </header>

    <div class="scroll-content" id="scroll-content">
        
        <main class="info-card">
            <p data-i18n="transport_page.welcome"></p>
            
            <hr>
            
            <h2 data-i18n="transport_page.company_title"></h2>
            <p data-i18n="transport_page.company_desc"></p>

            <div class="stops-box">
                <h3 data-i18n="transport_page.stops_title"></h3>
                <ul>
                    <li data-i18n="transport_page.stop_1"></li>
                    <li data-i18n="transport_page.stop_2"></li>
                    <li data-i18n="transport_page.stop_3"></li>
                </ul>
            </div>
        </main>

        <div class="transport-buttons">
            <a href="https://www.autolineerandazzo.it/gli-orari-delle-corse/" target="_blank" class="btn-barocco">
                <span data-i18n="transport_page.btn_schedule"></span> ➡️
            </a>
            <a href="https://biglietteriarandazzo.nextstep17.com/user/login" target="_blank" class="btn-barocco">
                <span data-i18n="transport_page.btn_tickets"></span> ➡️
            </a>
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const content = document.getElementById("scroll-content");
            // La pergamena è statica: mostriamo subito il contenuto in modo fluido all'avvio
            content.classList.add("visible");
        });
    </script>

    <script>
        const audio = document.getElementById("bg-music");
        const trigger = document.getElementById("audio-trigger");
        const toggleBtn = document.getElementById("toggle-music");
        
        audio.volume = 0.5;
        let musicStarted = false;

        function startMusic() {
            if (!musicStarted) {
                audio.play().then(() => {
                    musicStarted = true;
                    if(trigger) trigger.remove();
                }).catch(() => {
                    setTimeout(() => audio.play(), 200);
                });
            }
        }

        document.addEventListener("touchstart", startMusic, { once: true });
        document.addEventListener("click", startMusic, { once: true });
        if(trigger) {
            trigger.addEventListener("click", startMusic);
            trigger.addEventListener("touchstart", startMusic);
        }

        toggleBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (audio.paused) {
                audio.play();
                toggleBtn.textContent = "🔈";
            } else {
                audio.pause();
                toggleBtn.textContent = "🔇";
            }
        });
    </script>

    <script>
    let currentLang = localStorage.getItem("lang") || "it";

    function loadLanguage(lang) {
        fetch(`../lang/${lang}.json`)
            .then(res => res.json())
            .then(data => {
                document.querySelectorAll("[data-i18n]").forEach(el => {
                    const key = el.getAttribute("data-i18n");
                    const text = key.split('.').reduce((o,i)=>o[i], data);
                    if (text) el.innerHTML = text;
                });
            });
        localStorage.setItem("lang", lang);
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".lang-switcher button").forEach(btn => {
            btn.addEventListener("click", () => {
                loadLanguage(btn.dataset.lang);
            });
        });
        loadLanguage(currentLang);
    });
    </script>

</body>
</html>
