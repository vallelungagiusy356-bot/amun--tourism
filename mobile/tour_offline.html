<style>
  :root { --fondo:#0f1922; --oro:#B8873B; --crema:#F3ECDC; --carta:#1b2a37; }

  body.tour-attivo main, body.tour-attivo header { display:none; }

  body.tour-attivo #viewer { display:block; }

  #pannello > div.dentro { max-width:560px; margin:0 auto; }
  #op-titolo { font-size:1.05rem; margin:0 0 8px; color:var(--oro); }
  .comandi { display:flex; gap:10px; margin:6px 0 10px; }
  .comandi button { flex:1; padding:12px; font-size:1rem; border-radius:10px; border:1px solid var(--oro);

  .comandi button.primario { background:var(--oro); color:#1a1208; font-weight:700; }
  #avviso { font-size:.82rem; color:#f0c987; margin:4px 0 8px; display:none; }
  #ritorno { display:none; position:fixed; left:12px; right:12px; bottom:12px; z-index:40; max-width:520px; margin:0 auto;

  const DATA = {"opere":[{"id":"chiese.purgatorio.opere.sanfilippo","thumb":"sanfilippo_animesante.jpg","img":"sanfilippo_animesante.jpg","titolo":{"it":"San Filippo Neri","en":"Saint Philip Neri","fr":"Saint Philippe Néri"},"frasi":{"it":["Siete davanti a San Filippo Neri, una tela di autore ignoto.","Il santo, inginocchiato, riceve la visita della Madonna con il Bambino, che lo benedice per il suo operato sulla terra.","Guardate in basso, nella fascia sotto il santo: piccole scene di vita quotidiana, in ambienti diversi.","Per l'usura del dipinto se ne riconoscono due: una camera da letto, con un letto a baldacchino, e un'imbarcazione in mare, forse in un porticciolo d'attracco.","Cliccate le card sotto per scoprire le altre tele."],"en":["You are in front of Saint Philip Neri, a painting by an unknown artist.","The saint, kneeling, receives a visit from the Madonna with the Child, who blesses him for his work on earth.","Look at the band below the saint: small scenes of everyday life, in different settings.","Because the painting is worn, two can be recognized: a bedroom, with a four-poster bed, and a boat at sea, perhaps in a small harbor.","Tap the cards below to discover the other paintings."],"fr":["Vous êtes devant Saint Philippe Néri, une toile d'auteur inconnu.","Le saint, à genoux, reçoit la visite de la Vierge à l'Enfant, qui le bénit pour son œuvre sur terre.","Regardez en bas, dans la bande sous le saint : de petites scènes de vie quotidienne, dans des cadres différents.","À cause de l'usure du tableau, on en reconnaît deux : une chambre à coucher, avec un lit à baldaquin, et une embarcation en mer, peut-être dans un petit port d'accostage.","Touchez les cartes ci-dessous pour découvrir les autres toiles."]},"cue":{"it":[{"k":1,"pos":48,"x":0.24,"y":0.17,"larg":0.45},{"k":3,"pos":51,"x":0.25,"y":0.8,"larg":0.5},{"k":3,"pos":101,"x":0.75,"y":0.8,"larg":0.5}],"en":[{"k":1,"pos":44,"x":0.24,"y":0.17,"larg":0.45},{"k":3,"pos":43,"x":0.25,"y":0.8,"larg":0.5},{"k":3,"pos":85,"x":0.75,"y":0.8,"larg":0.5}],"fr":[{"k":1,"pos":40,"x":0.24,"y":0.17,"larg":0.45},{"k":3,"pos":54,"x":0.25,"y":0.8,"larg":0.5},{"k":3,"pos":109,"x":0.75,"y":0.8,"larg":0.5}]},"tempi":{"starts":[1.37,6.37,14.79,22.4,33.24],"fin":36.73}},{"id":"chiese.purgatorio.opere.sangiovanniimmacolata","thumb":"vergine_imm_animesante.jpg","img":"vergine_imm_animesante.jpg","titolo":{"it":"San Giovanni e l'Immacolata","en":"Saint John and the Immaculate Conception","fr":"Saint Jean et l'Immaculée"},"frasi":{"it":["Siete davanti a San Giovanni Evangelista con l'Immacolata, una tela di autore ignoto.","In basso a destra, il giovane Giovanni è seduto su delle pietre, con un libro sacro in mano e una penna per scrivere: sono i segni del suo ruolo di testimone e annunciatore della parola di Cristo.","In alto, sulle nuvole, la Vergine Immacolata: la riconoscete proprio perché è posta tra le nubi, con una falce di luna sotto i piedi, come nell'iconografia dell'Immacolata Concezione.","Sembra vegliare sull'opera di Giovanni.","Guardate gli sguardi: Giovanni non guarda la Madonna, e la Madonna non guarda lui, ma verso il basso.","Sembra che fissino la stessa cosa, che però nel quadro non si vede.","Cliccate le card per conoscere le altre tele della chiesa."],"en":["You are in front of Saint John the Evangelist with the Immaculate Conception, a painting by an unknown artist.","At the bottom right, the young John is seated on some stones, with a holy book in his hand and a quill for writing: the signs of his role as witness and herald of Christ's word.","Above, on the clouds, the Virgin Immaculate: you recognize her precisely because she is placed among the clouds, with a crescent moon under her feet, as in the traditional image of the Immaculate Conception.","She seems to watch over John's work.","Look at their gazes: John does not look at the Madonna, and the Madonna does not look at him, but downward.","They seem to be staring at the same thing, which however cannot be seen in the painting.","Tap the cards to discover the other paintings in the church."],"fr":["Vous êtes devant Saint Jean l'Évangéliste avec l'Immaculée, une toile d'auteur inconnu.","En bas à droite, le jeune Jean est assis sur des pierres, un livre sacré à la main et une plume pour écrire : ce sont les signes de son rôle de témoin et d'annonciateur de la parole du Christ.","En haut, sur les nuages, la Vierge Immaculée : vous la reconnaissez précisément parce qu'elle est placée parmi les nuées, avec un croissant de lune sous les pieds, comme dans l'iconographie de l'Immaculée Conception.","Elle semble veiller sur l'œuvre de Jean.","Regardez les regards : Jean ne regarde pas la Vierge, et la Vierge ne le regarde pas, mais vers le bas.","On dirait qu'ils fixent la même chose, qui cependant ne se voit pas dans le tableau.","Touchez les cartes pour connaître les autres toiles de l'église."]},"cue":{"it":[{"k":1,"pos":20,"x":0.62,"y":0.58,"larg":0.6},{"k":1,"pos":73,"x":0.8,"y":0.64,"larg":0.35},{"k":2,"pos":24,"x":0.3,"y":0.2,"larg":0.55},{"k":2,"pos":104,"x":0.22,"y":0.44,"larg":0.3}],"en":[{"k":1,"pos":18,"x":0.62,"y":0.58,"larg":0.6},{"k":1,"pos":65,"x":0.8,"y":0.64,"larg":0.35},{"k":2,"pos":27,"x":0.3,"y":0.2,"larg":0.55},{"k":2,"pos":118,"x":0.22,"y":0.44,"larg":0.3}],"fr":[{"k":1,"pos":19,"x":0.62,"y":0.58,"larg":0.6},{"k":1,"pos":71,"x":0.8,"y":0.64,"larg":0.35},{"k":2,"pos":28,"x":0.3,"y":0.2,"larg":0.55},{"k":2,"pos":123,"x":0.22,"y":0.44,"larg":0.3}]},"tempi":{"starts":[1.01,6.25,18.99,31.36,34.3,41.42,46.28],"fin":50.02}},{"id":"chiese.purgatorio.opere.adorazionepastori","thumb":"adorazione_animesante.jpg","img":"adorazione_animesante.jpg","titolo":{"it":"L'Adorazione dei Pastori","en":"The Adoration of the Shepherds","fr":"L'Adoration des Bergers"},"frasi":{"it":["Siete davanti a una Natività: Gesù appena nato, adorato dai pastori.","È l'Adorazione dei Pastori del 1729, opera di Giovanni Bonomo, pittore caccamese del Settecento.","Al centro, Maria con il manto azzurro e il Bambino adagiato sulla paglia.","È lui il vero protagonista: la luce parte dal suo corpicino e si irradia verso l'esterno, illuminando tutta la scena.","Dietro di lei, San Giuseppe con il mantello arancione.","In primo piano a sinistra, un pastore a torso nudo porta in dono un agnello.","A destra, una giovane donna con un turbante giallo e, accanto a lei, un angioletto che stringe una colomba.","Cercate in basso, sui gradini: c'è anche un gallo, con una gallina.","Sono animali e gesti della vita di tutti i giorni, accanto al miracolo.","E in alto, tra le nubi, angioletti in volo.","Il carattere popolaresco, l'atmosfera intima e semplice e la presenza degli animali domestici sono tipici di Bonomo.","Resta però un piccolo mistero: non si capisce perché la luce sia così diversa da quella che usa negli altri suoi quadri.","Sembra quasi di ispirazione caravaggesca.","Se volete scoprire le altre tele,cliccate le card sotto."],"en":["You are in front of a Nativity: the newborn Jesus, adored by the shepherds.","It is the Adoration of the Shepherds of 1729, by Giovanni Bonomo, a Caccamo painter of the 18th century.","At the center, Mary in her blue mantle and the Child lying on the straw.","He is the true protagonist: the light starts from his tiny body and spreads outward, lighting up the whole scene.","Behind her, Saint Joseph in his orange cloak.","In the foreground on the left, a bare-chested shepherd brings a lamb as a gift.","On the right, a young woman in a yellow turban and, beside her, a little angel holding a dove.","Look down at the steps: there is also a rooster, with a hen.","Everyday animals and gestures, beside the miracle.","And above, among the clouds, little angels in flight.","The popular character, the intimate and simple atmosphere and the presence of domestic animals are typical of Bonomo.","But a small mystery remains: it is not clear why the light is so different from the one he uses in his other paintings.","It seems almost inspired by Caravaggio.","To discover the other paintings, tap the cards below."],"fr":["Vous êtes devant une Nativité : Jésus tout juste né, adoré par les bergers.","C'est l'Adoration des Bergers de 1729, œuvre de Giovanni Bonomo, peintre de Caccamo du XVIIIe siècle.","Au centre, Marie dans son manteau bleu et l'Enfant couché sur la paille.","C'est lui le véritable protagoniste : la lumière part de son petit corps et rayonne vers l'extérieur, éclairant toute la scène.","Derrière elle, Saint Joseph dans son manteau orange.","Au premier plan à gauche, un berger torse nu apporte un agneau en offrande.","À droite, une jeune femme au turban jaune et, à côté d'elle, un petit ange qui serre une colombe.","Cherchez en bas, sur les marches : il y a aussi un coq, avec une poule.","Ce sont des animaux et des gestes de la vie de tous les jours, à côté du miracle.","Et en haut, parmi les nuages, des angelots en vol.","Le caractère populaire, l'atmosphère intime et simple et la présence des animaux domestiques sont typiques de Bonomo.","Il reste pourtant un petit mystère : on ne comprend pas pourquoi la lumière est si différente de celle qu'il utilise dans ses autres tableaux.","Elle semble presque d'inspiration caravagesque.","Si vous voulez découvrir les autres toiles, touchez les cartes ci-dessous."]},"cue":{"it":[{"k":2,"pos":0,"x":0.41,"y":0.65,"larg":0.47},{"k":4,"pos":15,"x":0.32,"y":0.54,"larg":0.43},{"k":5,"pos":68,"x":0.23,"y":0.71,"larg":0.4},{"k":6,"pos":35,"x":0.76,"y":0.65,"larg":0.43},{"k":7,"pos":44,"x":0.56,"y":0.8,"larg":0.33},{"k":9,"pos":35,"x":0.46,"y":0.31,"larg":0.52}],"en":[{"k":2,"pos":15,"x":0.41,"y":0.65,"larg":0.47},{"k":4,"pos":12,"x":0.32,"y":0.54,"larg":0.43},{"k":5,"pos":33,"x":0.23,"y":0.71,"larg":0.4},{"k":6,"pos":16,"x":0.76,"y":0.65,"larg":0.43},{"k":7,"pos":40,"x":0.56,"y":0.8,"larg":0.33},{"k":9,"pos":0,"x":0.46,"y":0.31,"larg":0.52}],"fr":[{"k":2,"pos":11,"x":0.41,"y":0.65,"larg":0.47},{"k":4,"pos":15,"x":0.32,"y":0.54,"larg":0.43},{"k":5,"pos":36,"x":0.23,"y":0.71,"larg":0.4},{"k":6,"pos":14,"x":0.76,"y":0.65,"larg":0.43},{"k":7,"pos":51,"x":0.56,"y":0.8,"larg":0.33},{"k":9,"pos":0,"x":0.46,"y":0.31,"larg":0.52}]},"tempi":{"starts":[0.77,5.7,13.5,18.02,26.8,31.24,33.55,43.91,48.7,53.23,56.87,65.19,72.19,74.92],"fin":78.84}},{"id":"chiese.purgatorio.opere.messasuffragio","thumb":"messa_di_suffraggio_animesante.jpg","img":"messa_di_suffraggio_animesante.jpg","titolo":{"it":"La Messa di Suffragio","en":"The Mass of Suffrage","fr":"La Messe de Suffrage"},"frasi":{"it":["Questa grande tela, opera di Tommaso Pollace, del 1782 o 1784, si trova sull'altare maggiore e racconta la forza della preghiera per i defunti.","Il dipinto è diviso in due zone: la terra in basso, dove si celebra la Messa, e il cielo in alto.","In basso, un sacerdote alza l'ostia durante la Messa.","Indossa paramenti rosa, un colore che si usa solo nelle occasioni speciali: qui la Messa è celebrata in suffragio delle anime.","A sinistra, vicino all'altare, un chierichetto con la candela; davanti a lui, due chierici in ginocchio.","Alzate lo sguardo: sulle nuvole c'è la Madonna con il manto azzurro, poi Cristo e Dio Padre, e tra loro la colomba dello Spirito Santo.","A destra, un angelo solleva verso il cielo un'anima appena liberata: è l'ascesa dell'anima.","In basso, tra le fiamme, le anime del Purgatorio ardono e tendono le mani.","Cliccate sotto per scoprire le altre opere."],"en":["This large painting, by Tommaso Pollace, from 1782 or 1784, is on the high altar and tells of the power of prayer for the dead.","The painting is divided into two zones: earth below, where Mass is celebrated, and heaven above.","Below, a priest raises the host during Mass.","He wears rose-colored vestments, a color used only on special occasions: here the Mass is celebrated in suffrage for the souls, that is, offered for the dead.","On the left, near the altar, an altar boy with a candle; in front of him, two clerics kneeling.","Look up: on the clouds is the Madonna in her blue mantle, then Christ and God the Father, and between them the dove of the Holy Spirit.","On the right, an angel lifts toward heaven a soul just freed: it is the ascent of the soul.","Below, among the flames, the souls of Purgatory burn and stretch out their hands.","Tap below to discover the other paintings."],"fr":["Cette grande toile, œuvre de Tommaso Pollace, de 1782 ou 1784, se trouve sur le maître-autel et raconte la force de la prière pour les défunts.","Le tableau est divisé en deux zones : la terre en bas, où l'on célèbre la Messe, et le ciel en haut.","En bas, un prêtre élève l'hostie pendant la Messe.","Il porte des ornements roses, une couleur qu'on n'utilise que dans les occasions spéciales : ici la Messe est célébrée en suffrage des âmes.","À gauche, près de l'autel, un enfant de chœur avec la bougie ; devant lui, deux clercs à genoux.","Levez les yeux : sur les nuages se trouve la Vierge au manteau bleu, puis le Christ et Dieu le Père, et entre eux la colombe de l'Esprit Saint.","À droite, un ange élève vers le ciel une âme tout juste libérée : c'est l'ascension de l'âme.","En bas, parmi les flammes, les âmes du Purgatoire brûlent et tendent les mains.","Touchez ci-dessous pour découvrir les autres œuvres."]},"cue":{"it":[{"k":0,"pos":107,"x":0.53,"y":0.51,"larg":0.89},{"k":2,"pos":13,"x":0.42,"y":0.53,"larg":0.4},{"k":3,"pos":8,"x":0.43,"y":0.62,"larg":0.37},{"k":4,"pos":34,"x":0.27,"y":0.75,"larg":0.36},{"k":4,"pos":78,"x":0.59,"y":0.72,"larg":0.4},{"k":5,"pos":39,"x":0.28,"y":0.24,"larg":0.37},{"k":5,"pos":73,"x":0.34,"y":0.18,"larg":0.36},{"k":5,"pos":82,"x":0.68,"y":0.17,"larg":0.36},{"k":5,"pos":107,"x":0.53,"y":0.18,"larg":0.34},{"k":6,"pos":10,"x":0.68,"y":0.51,"larg":0.37},{"k":7,"pos":10,"x":0.8,"y":0.73,"larg":0.36}],"en":[{"k":0,"pos":95,"x":0.53,"y":0.51,"larg":0.89},{"k":2,"pos":11,"x":0.42,"y":0.53,"larg":0.4},{"k":3,"pos":9,"x":0.43,"y":0.62,"larg":0.37},{"k":4,"pos":31,"x":0.27,"y":0.75,"larg":0.36},{"k":4,"pos":71,"x":0.5 "The protagonists are the Virgin, who is about to be crowned by an angel, and the Child Jesus seated on her lap: they are the most brightly lit figures in the scene.","On the left, a Carmelite friar, Saint John of the Cross, leans toward the Madonna and receives the scapular.","In the center, a putto (a little cherub) points with his hand to the protagonists.","On the right, a figure holding a large cross.","The church's information panel identifies it as a copy of the altarpiece by Sebastiano Conca in the church of Santa Teresa alla Kalsa, in Palermo.","Use the menu below to discover more about the Church of Purgatory."],"fr":["Vous êtes devant Notre-Dame du Mont-Carmel, toile d'un peintre inconnu de la seconde moitié du XVIIIe siècle.","Les protagonistes sont la Vierge, sur le point d'être couronnée par un ange, et l'Enfant Jésus assis sur ses genoux : ce sont les personnages les plus éclairés de la scène.","À gauche, un frère carme, Saint Jean de la Croix, se penche vers la Vierge et reçoit le scapulaire.","Au centre, un putto indique de la main les protagonistes.","À droite, une figure soutenant une grande croix.","Le panneau de l'église l'indique comme une copie du retable de Sebastiano Conca dans l'église de Santa Teresa alla Kalsa, à Palerme.","Consultez le menu ci-dessous pour découvrir d'autres choses sur l'église du Purgatoire."]},"cue":{"it":[{"k":1,"pos":49,"x":0.6,"y":0.22,"larg":0.55},{"k":2,"pos":38,"x":0.24,"y":0.56,"larg":0.45},{"k":3,"pos":11,"x":0.46,"y":0.78,"larg":0.42},{"k":4,"pos":34,"x":0.78,"y":0.62,"larg":0.45}],"en":[{"k":1,"pos":51,"x":0.6,"y":0.22,"larg":0.55},{"k":2,"pos":37,"x":0.24,"y":0.56,"larg":0.45},{"k":3,"pos":16,"x":0.46,"y":0.78,"larg":0.42},{"k":4,"pos":30,"x":0.78,"y":0.62,"larg":0.45}],"fr":[{"k":1,"pos":53,"x":0.6,"y":0.22,"larg":0.55},{"k":2,"pos":34,"x":0.24,"y":0.56,"larg":0.45},{"k":3,"pos":11,"x":0.46,"y":0.78,"larg":0.42},{"k":4,"pos":32,"x":0.78,"y":0.62,"larg":0.45}]},"tempi":{"starts":[1.24,8.17,18.71,26.51,30.37,33.99,42.82],"fin":47.64}},{"id":"chiese.purgatorio.opere.ostensorio","thumb":"adorazione_eucaristica_animesante.jpg","img":"adorazione_eucaristica_animesante.jpg","titolo":{"it":"L'Adorazione dell'Ostensorio","en":"The Adoration of the Monstrance","fr":"L'Adoration de l'Ostensoir"},"frasi":{"it":["Siete davanti all'Adorazione dell'Ostensorio, opera di Giovanni Bonomo, del 1729.","In alto, tra le nubi e gli angeli, l'ostensorio con l'Ostia: è il centro di tutta la scena.","In basso, due santi in adorazione: a sinistra un santo vescovo, riconoscibile dai ricchi paramenti; a destra San Francesco d'Assisi, con il semplice saio e le stimmate.","Il vescovo e Francesco sono il lato sacro del quadro: i loro volti, rivolti a Dio, sono tutti in adorazione.","Ma c'è anche un tocco di leggerezza: al centro, due putti giocano con la mitra del vescovo, quasi a prendersi gioco del potere.","Francesco è il santo della povertà e della gratitudine per il creato: suo è il Cantico di frate Sole, che comincia con \"Laudato sii, mi' Signore\".","Ai suoi piedi, un teschio su un libro ricorda la fragilità della vita.","Cliccate le card per conoscere le altre tele."],"en":["You are in front of the Adoration of the Monstrance, by Giovanni Bonomo, from 1729.","Above, among the clouds and angels, the monstrance with the Host: it is the center of the whole scene.","Below, two saints in adoration: on the left a bishop saint, recognizable by his rich vestments; on the right Saint Francis of Assisi, in his simple habit and with the stigmata.","The bishop and Francis are the sacred side of the painting: their faces, turned toward God, are all in adoration.","But there is also a touch of lightness: in the center, two putti play with the bishop's mitre, as if poking fun at power.","Francis is the saint of poverty and of gratitude for creation: his is the Canticle of Brother Sun, which begins with \"Laudato sii, mi' Signore\" (\"Praised be You, my Lord\").","At his feet, a skull on a book recalls the fragility of life.","Tap the cards to discover the other paintings."],"fr":["Vous êtes devant l'Adoration de l'Ostensoir, œuvre de Giovanni Bonomo, de 1729.","En haut, parmi les nuages et les anges, l'ostensoir avec l'Hostie : c'est le centre de toute la scène.","En bas, deux saints en adoration : à gauche un saint évêque, reconnaissable à ses riches ornements ; à droite Saint François d'Assise, dans son simple habit et avec les stigmates.","L'évêque et François sont le côté sacré du tableau : leurs visages, tournés vers Dieu, sont tout entiers en adoration.","Mais il y a aussi une touche de légèreté : au centre, deux putti jouent avec la mitre de l'évêque, presque pour se moquer du pouvoir.","François est le saint de la pauvreté et de la gratitude pour la création : de lui est le Cantique de frère Soleil, qui commence par « Laudato sii, mi' Signore » (« Loué sois-tu, mon Seigneur »).","À ses pieds, un crâne sur un livre rappelle la fragilité de la vie.","Touchez les cartes pour connaître les autres toiles."]},"cue":{"it":[{"k":1,"pos":35,"x":0.5,"y":0.2,"larg":0.5},{"k":2,"pos":49,"x":0.26,"y":0.62,"larg":0.48},{"k":2,"pos":109,"x":0.72,"y":0.6,"larg":0.48},{"k":4,"pos":48,"x":0.5,"y":0.8,"larg":0.4},{"k":6,"pos":18,"x":0.76,"y":0.86,"larg":0.35}],"en":[{"k":1,"pos":39,"x":0.5,"y":0.2,"larg":0.5},{"k":2,"pos":7,"x":0.26,"y":0.62,"larg":0.48},{"k":2,"pos":96,"x":0.72,"y":0.6,"larg":0.48},{"k":4,"pos":46,"x":0.5,"y":0.8,"larg":0.4},{"k":6,"pos":16,"x":0.76,"y":0.86,"larg":0.35}],"fr":[{"k":1,"pos":39,"x":0.5,"y":0.2,"larg":0.5},{"k":2,"pos":8,"x":0.26,"y":0.62,"larg":0.48},{"k":2,"pos":101,"x":0.72,"y":0.6,"larg":0.48},{"k":4,"pos":51,"x":0.5,"y":0.8,"larg":0.4},{"k":6,"pos":17,"x":0.76,"y":0.86,"larg":0.35}]},"tempi":{"starts":[0.81,7.35,12.36,27.81,36.01,44.15,54.82,59.54],"fin":62.8}}],"vocebasi":["../voce-castellana/","/voce-castellana/","voce-castellana/"],"basi":["img/","../gallery-chiese/","/gallery-chiese/","/mobile/img/","gallery-chiese/","../img/","../../g   function disegnaGriglia() {
    const t = TESTI[lingua];

    document.title = 'Amunì · ' + t.titolo;
    $('titolo').textContent = t.titolo;
    $('sotto').textContent = t.sotto;
    $('btn-play').textContent = t.play;
    $('btn-stop').textContent = t.stop;
    $('chiudi').setAttribute('aria-label', t.chiudi);
    document.querySelectorAll('.lingue button').forEach(function (b) {
      b.classList.toggle('attiva', b.dataset.l === lingua);
    });
    const g = $('griglia');
    g.innerHTML = '';
    DATA.opere.forEach(function (o) {
      const b = document.createElement('button');
      b.className = 'opera';
      b.type = 'button';
      const img = document.createElement('img');
      img.alt = '';
      img.loading = 'lazy';
      let prova = 0;
      const cand = [BASE + 'thumbs/' + o.thumb, BASE + o.thumb];
      img.onerror = function () { prova++; if (prova < cand.length) img.src = cand[prova]; };
      img.src = cand[0];
      const sp = document.createElement('span');
      sp.textContent = o.titolo[lingua];
      b.appendChild(img); b.appendChild(sp);
      b.addEventListener('click', function () { apriOpera(o); });
      g.appendChild(b);
    });
    aggiornaStato();
  }

  let viewer = null, cuePendente = null, timerHold = null, timerHint = null;
  const HOLD_MS = 6500;

  function aspetto() { const s = viewer.world.getItemAt(0).getContentSize(); return s.y / s.x; }

  function applicaCue(c) {
    if (!viewer || !viewer.world.getItemCount()) { cuePendente = c; return; }

  function scegliVoce() {
    try {
      const voci = window.speechSynthesis.getVoices() || [];
      const pre = TESTI[lingua].lang.slice(0, 2).toLowerCase();
      const adatte = voci.filter(function (v) { return (v.lang || '').toLowerCase().indexOf(pre) === 0; });
      if (!adatte.length) return null;
      const locali = adatte.filter(function (v) { return v.localService; });
      if (locali.length) return locali[0];
      return navigator.onLine === false ? null : adatte[0];

  function evidenzia(k) {
    document.querySelectorAll('#testo .frase').forEach(function (s, i) { s.classList.toggle('ora', i === k); });
    const s = document.querySelectorAll('#testo .frase')[k];
    if (s && s.scrollIntoView) { try { s.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {} }
  }

  function suFrase(k, utt, msCar) {
    pulisciCue();
    const cues = (operaAttuale.cue[lingua] || []).filter(function (c) { return c.k === k; });
    const programma = cues.map(function (c) { return { c: c, pos: c.pos, fatto: false }; });
    function esegui(p) { if (p.fatto) return; p.fatto = true; applicaCue(p.c); }
    programma.forEach(function (p) {
      const ritardo = Math.round(p.pos * msCar);
      if (ritardo < 150) esegui(p);
      else timersCue.push(setTimeout(function () { esegui(p); }, ritardo));
    });
    if (utt && programma.length) {
      try {
        utt.addEventListener('boundary', function (ev) {
          const ci = ev.charIndex || 0;
          programma.forEach(function (p) { if (!p.fatto && ci >= p.pos - 8) esegui(p); });
        });
      } catch (e) {}
    }
    if (!programma.length) timersCue.push(setTimeout(tornaPanoramica, 700));
  }

  function mostraAvviso(testo) {
    const a = $('avviso');
    a.textContent = testo || '';
    a.style.display = testo ? 'block' : 'none';
  }

  function dire(k, mia) {
    if (mia !== sessione) return;
    const frasi = operaAttuale.frasi[lingua];
    if (k >= frasi.length) { fine(); return; }
    evidenzia(k);
    const testo = frasi[k];

    if (silenzioso) {
      const ms = 62;
      suFrase(k, null, ms);
      timersPlayer.push(setTimeout(function () { dire(k + 1, mia); }, Math.round(testo.length * ms + 450)));
      return;
    }

    let partita = false;
    const u = new SpeechSynthesisUtterance(testo);
    u.lang = TESTI[lingua].lang;
    u.rate = 1;
    const v = scegliVoce();
    if (v) u.voice = v;
    u.onstart = function () {
      if (mia !== sessione) return;
      partita = true;
      u._t0 = Date.now();
      suFrase(k, u, msMisurato || 70);
    };
    u.onend = function () {
      if (mia !== sessione) return;
      if (u._t0 && testo.length >= 25) {
        const ms = (Date.now() - u._t0) / testo.length;
        if (ms >= 40 && ms <= 110) msMisurato = msMisurato ? Math.round((msMisurato + ms) / 2) : Math.round(ms);
      }
      timersPlayer.push(setTimeout(function () { dire(k + 1, mia); }, 120));
    };
    u.onerror = function (e) {
      if (mia !== sessione) return;
      if (e && (e.error === 'interrupted' || e.error === 'canceled')) return;
      passaSilenzioso(k, mia);
    };
    try { window.speechSynthesis.speak(u); } catch (e) { passaSilenzioso(k, mia); return; }
    // se la voce non parte entro 4 secondi (nessuna voce offline) si prosegue in silenzio
    timersPlayer.push(setTimeout(function () {
      if (!partita && mia === sessione) { try { window.speechSynthesis.cancel(); } catch (e) {} passaSilenzioso(k, mia); }
    }, 4000));
  }

  function passaSilenzioso(k, mia) {
    if (mia !== sessione) return;
    silenzioso = true;
    mostraAvviso(TESTI[lingua].senzaVoce);
    pulisciPlayer();
    dire(k, mia);
  }

  function fine() {
    pulisciCue();
    timersCue.push(setTimeout(tornaPanoramica, 1500));
    document.querySelectorAll('#testo .frase').forEach(function (s) { s.classList.remove('ora'); });
  }

  // ---- italiano: la tua voce registrata (mp3), con lo zoom che segue la posizione nell'audio ----
  let audioEl = null, timerAudio = null;
  function fermaAudio() {
    clearInterval(timerAudio); timerAudio = null;
    if (audioEl) { try { audioEl.pause(); } catch (e) {} audioEl.onerror = audioEl.onended = audioEl.onloadedmetadata = null; audioEl = null; }
  }
  function nomeClip(o) { return o.id.replace(/^chiese\./, '').replace(/\./g, '_') + '_it'; }
  function provaAudio(mia, ripiego) {
    const o = operaAttuale;
    const frasi = o.frasi.it;
    const inizi = []; let tot = 0;
    frasi.forEach(function (f) { inizi.push(tot); tot += f.length + 1; });
    const cues = (o.cue.it || []).map(function (c) { return { c: c, at: inizi[c.k] + c.pos, fatto: false }; });
    const cand = [];
    DATA.vocebasi.forEach(function (b) { ['mp3', 'm4a'].forEach(function (e) { cand.push(b + nomeClip(o) + '.' + e); }); });
    let n = 0;
    function prossimo() {
      if (mia !== sessione) return;
      if (n >= cand.length) { ripiego(); return; }
      const a = new Audio(); audioEl = a; a.preload = 'auto';
      let partito = false;
      a.onerror = function () { if (mia !== sessione || partito) return; fermaAudio(); prossimo(); };
      a.onloadedmetadata = function () {
        if (mia !== sessione) return;
        partito = true;
        a.onerror = function () { if (mia === sessione) { fermaAudio(); ripiego(); } };
        const p = a.play(); if (p && p.catch) p.catch(function () { if (mia === sessione) { fermaAudio(); ripiego(); } });
        let ultima = -1;
        timerAudio = setInterval(function () {
          if (mia !== sessione || !a.duration) return;
          let pos;
          const T = o.tempi;
          if (T && T.starts && T.starts.length === frasi.length) {
            // tempi reali ricavati dalle pause della registrazione
            const t = a.currentTime; let kk = 0;
            for (let i = 0; i < T.starts.length; i++) if (t >= T.starts[i]) kk = i;
            const fineF = kk + 1 < T.starts.length ? T.starts[kk + 1] : T.fin;
            const fr = Math.max(0, Math.min(1, (t - T.starts[kk]) / Math.max(0.3, fineF - T.starts[kk])));
            pos = inizi[kk] + fr * frasi[kk].length;
          } else pos = (a.currentTime / a.duration) * tot;
          let k = 0; for (let i = 0; i < inizi.length; i++) if (pos >= inizi[i]) k = i;
          if (k !== ultima) { ultima = k; evidenzia(k); }
          cues.forEach(function (q) { if (!q.fatto && pos >= q.at - 6) { q.fatto = true; applicaCue(q.c); } });
        }, 100);
        a.onended = function () { if (mia !== sessione) return; clearInterval(timerAudio); fine(); };
      };
      a.src = cand[n++];
      try { a.load(); } catch (e) {}
    }
    if (!cues.length) timersCue.push(setTimeout(tornaPanoramica, 700));
    prossimo();
  }

  function ferma() {
    sessione++;
    fermaAudio();
    pulisciCue(); pulisciPlayer();
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }

  function avvia() {
    ferma();
    const mia = sessione;
    silenzioso = false;
    mostraAvviso('');
    if (!('speechSynthesis' in window)) { silenzioso = true; mostraAvviso(TESTI[lingua].senzaVoce); }
    tornaPanoramica();
    if (lingua === 'it') {
      provaAudio(mia, function () {
        // registrazione non disponibile: parla la voce del dispositivo
        if (mia !== sessione) return;
        if (!('speechSynthesis' in window)) { silenzioso = true; mostraAvviso(TESTI[lingua].senzaVoce); }
        dire(0, mia);
      });
      return;
    }
    timersPlayer.push(setTimeout(function () { dire(0, mia); }, 150));
  }

  function apriOpera(o) {
    ferma();
    operaAttuale = o;
    document.body.classList.add('tour-attivo');
    $('op-titolo').textContent = o.titolo[lingua];
    const box = $('testo');
    box.innerHTML = '';
    o.frasi[lingua].forEach(function (f) {
      const s = document.createElement('span');
      s.className = 'frase';
      s.textContent = f + ' ';
      box.appendChild(s);
    });
    $('hint').textContent = '🔍 ' + TESTI[lingua].hint;
    $('hint').classList.add('visibile');
    clearTimeout(timerHint);
    timerHint = setTimeout(function () { $('hint').classList.remove('visibile'); }, 4500);
    apriViewer(o);
    avvia();
  }

  function chiudiOpera() {
    ferma();
    operaAttuale = null;
    chiudiViewer();
    document.body.classList.remove('tour-attivo');
  }

  $('chiudi').addEventListener('click', chiudiOpera);
  $('btn-stop').addEventListener('click', function () { ferma(); tornaPanoramica(); });
  $('btn-play').addEventListener('click', avvia);
  document.addEventListener('visibilitychange', function () { if (document.hidden) ferma(); });

  // le voci si caricano in ritardo su alcuni dispositivi
  try { window.speechSynthesis.getVoices(); } catch (e) {}

  // ---------------------------------------------------------------
  // RITORNO ALLA GUIDA ONLINE: se si è arrivati qui perché il segnale era
  // sparito, ogni pochi secondi si controlla se è tornato. Il passaggio non
  // è automatico (non interrompe la voce): compare un pulsante.
  // ---------------------------------------------------------------
  let urlRitorno = null;
  try { urlRitorno = localStorage.getItem('amuni_ritorno'); } catch (e) {}
  function mostraRitorno() {
    const t = TESTI[lingua];
    $('rit-msg').textContent = t.ritMsg;
    const a = $('rit-btn');
    a.textContent = t.ritBtn;
    // torna alla pagina online con la chat della Castellana già aperta
    try {
      var u = new URL(urlRitorno, location.href);
      u.searchParams.set('chat', 'open');
      a.href = u.href;
    } catch (e) { a.href = urlRitorno; }
    a.onclick = function () { try { localStorage.removeItem('amuni_ritorno'); } catch (e) {} };
    $('ritorno').style.display = 'block';
  }
  function controllaRete() {
    if (!urlRitorno) return;
    const ctrl = ('AbortController' in window) ? new AbortController() : null;
    const stop = setTimeout(function () { if (ctrl) ctrl.abort(); }, 4000);
    fetch(urlRitorno, { method: 'HEAD', cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) { clearTimeout(stop); if (r && r.ok) mostraRitorno(); else $('ritorno').style.display = 'none'; })
      .catch(function () { clearTimeout(stop); $('ritorno').style.display = 'none'; });
  }
  if (urlRitorno) { setInterval(controllaRete, 8000); window.addEventListener('online', controllaRete); }

  trovaBase().then(function (ok) {
    fotoMancanti = !ok;
    disegnaGriglia();
  });
})();
</script>
</body>
</html>
