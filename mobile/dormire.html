<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amunì Tourism - Dormire</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="mangiare.css">
</head>
<body>

    <div class="scene-background"></div>

    <header class="dashboard">
        <a href="index.html" class="btn-home">🏠</a>
        <div class="logo-container"><div class="logo-title">AMUNÌ TOURISM</div></div>
        <div class="lang-switcher">
            <button data-lang="it">🇮🇹</button>
            <button data-lang="en">🇬🇧</button>
        </div>
    </header>

    <div class="scroll-content">
        <div class="search-container">
            <input type="text" id="sleep-search" class="search-bar" placeholder="Cerca dove dormire..." onkeyup="filterSleep()">
        </div>
        <div class="mobile-layout" id="sleep-container"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('./lang/it.json') 
                .then(res => res.json())
                .then(data => renderList(data))
                .catch(err => console.error("Errore nel caricamento:", err));
        });

        function renderList(data) {
            const container = document.getElementById('sleep-container');
            const list = data.pages?.sleep_page?.accommodations;
            if(!container || !list) return;

            container.innerHTML = list.map(item => `
                <a href="${item.link}" target="_blank" class="sleep-card">
                    <h3 class="sleep-title">${item.name}</h3>
                    <span class="btn-view">PRENOTA ➔</span>
                </a>
            `).join('');
        }

        function filterSleep() {
            const input = document.getElementById('sleep-search').value.toLowerCase();
            const cards = document.querySelectorAll('.sleep-card');
            cards.forEach(card => {
                const title = card.querySelector('.sleep-title').innerText.toLowerCase();
                card.style.display = title.includes(input) ? "flex" : "none";
            });
        }
    </script>
</body>
</html>
