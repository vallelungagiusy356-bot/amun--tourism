<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amunì Tourism - Dormire</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="mangiare.css">
    <meta name="theme-color" content="#14283A">
</head>
<body>

    <div class="scene-background"></div>

    <header class="dashboard">
        <div class="logo-container">
            <div class="logo-title">AMUNÌ TOURISM</div>
        </div>

        <div class="right-controls">
            <a href="mobile_index.html" class="btn-home" aria-label="Torna alla home">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11.5 12 4l9 7.5"/>
        <path d="M5.5 9.5V20h13V9.5"/>
        <path d="M10 20v-6h4v6"/>
    </svg>
            </a>
            <div class="lang-switcher">
                <button data-lang="it">IT</button>
                <button data-lang="en">EN</button>
                <button data-lang="fr">FR</button>
                <button data-lang="de">DE</button>
                <button data-lang="es">ES</button>
            </div>
        </div>
    </header>

    <div class="scroll-content">
        <div class="search-container">
            <input type="text" id="sleep-search" class="search-bar" placeholder="Cerca dove dormire..." onkeyup="filterSleep()">
        </div>
        <div class="mobile-layout" id="sleep-container"></div>
    </div>

    <script>
        // Caricamento Dati
        function loadLanguage(lang) {
            fetch(`./lang/${lang}.json`) 
                .then(res => res.json())
                .then(data => {
                    renderList(data);
                    document.querySelectorAll(".lang-switcher button").forEach(btn => {
                        btn.classList.toggle("active", btn.dataset.lang === lang);
                    });
                })
                .catch(err => console.error("Errore lingua:", err));
            localStorage.setItem("lang", lang);
        }

        function renderList(data) {
            const container = document.getElementById('sleep-container');
            const list = data.pages?.sleep_page?.accommodations;
            if(!container || !list) return;

            container.innerHTML = list.map(item => `
                <a href="${item.link}" target="_blank" class="sleep-card">
                    <h3 class="sleep-title">${item.name}</h3>
                    <span class="btn-view">PRENOTA ➔</span>
                </a>
            `).join('');
        }

        function filterSleep() {
            const input = document.getElementById('sleep-search').value.toLowerCase();
            document.querySelectorAll('.sleep-card').forEach(card => {
                const title = card.querySelector('.sleep-title').innerText.toLowerCase();
                card.style.display = title.includes(input) ? "flex" : "none";
            });
        }

        // Inizializzazione
        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll(".lang-switcher button").forEach(btn => {
                btn.addEventListener("click", () => loadLanguage(btn.dataset.lang));
            });
            loadLanguage(localStorage.getItem("lang") || "it");
            
            // Registrazione PWA
            if ("serviceWorker" in navigator) navigator.serviceWorker.register("./service-worker.js");
        });
    </script>
</body>
</html>
