<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="monuments.cappuccini.title">Convento dei Frati Cappuccini</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="monumento_dettaglio.css">
</head>
<body>

    <header class="dashboard">
        <span class="logo-title" data-i18n="menu.title">Amunì Tourism</span>
        <div class="lang-switcher" style="margin-left: auto;">
            <button data-lang="it">🇮🇹</button>
            <button data-lang="en">🇬🇧</button>
            <button data-lang="fr">🇫🇷</button>
            <button data-lang="de">🇩🇪</button>
            <button data-lang="es">🇪🇸</button>
        </div>
    </header>

    <main class="mobile-layout-detail">
        
        <header class="monument-header">
            <h1 data-i18n="monuments.cappuccini.title"></h1>
        </header>

        <img src="img/cappuccini_cacc.gif" alt="Convento Cappuccini" class="monument-hero-image">

        <section class="teca-cristallo descrittiva">
            <p data-i18n="monuments.cappuccini.description"></p>
        </section>

        <section class="teca-cristallo teca-avviso">
            <p data-i18n="monuments.church_notice"></p>
        </section>

        <section class="teca-cristallo teca-logistica">
            <div class="info-row">
                <span class="info-label" data-i18n="monuments.hours_label"></span>
                <span class="info-value" data-i18n="monuments.cappuccini.hours"></span>
            </div>
        </section>

        <section class="teca-segreta">
            <div class="teca-segreta-badge">Segreto</div>
            <p data-i18n="monuments.cappuccini.secret_info"></p>
        </section>

        <div class="actions-container">
            <button class="btn-barocco-action" onclick="window.location.href='http://maps.google.com/?q=Convento+Frati+Cappuccini+Caccamo'">
                🌐 <span data-i18n="monuments.view_map"></span>
            </button>
            
            <button class="btn-barocco-action btn-secondary-action" onclick="window.location.href='https://dindondan.app/orarimesse/'">
                🔔 <span data-i18n="monuments.btn_dindondan"></span>
            </button>
        </div>

        <a href="monuments.html" class="btn-back-home">← Torna ai Monumenti</a>

    </main>

    <div class="scene-background"></div>

    <script src="monument_translation.js"></script>
</body>
</html>
