<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />

    <!-- Leaflet -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"/>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.2.0/css/all.min.css"/>

    <!-- Leaflet Awesome Markers -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css"/>

    <!-- Mouse Position -->
    <script src="https://cdn.jsdelivr.net/gh/ardhi/Leaflet.MousePosition/src/L.Control.MousePosition.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ardhi/Leaflet.MousePosition/src/L.Control.MousePosition.min.css"/>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            left: 0;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script>
    // ============================
    //  CREAZIONE MAPPA
    // ============================
    var map = L.map("map", {
        center: [37.9314, 13.6644],
        zoom: 16,
        zoomControl: true
    });

    // ============================
    //  TILE LAYER
    // ============================
    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
        attribution: "© OpenStreetMap contributors © CARTO",
        subdomains: "abcd",
        maxZoom: 20
    }).addTo(map);

    // ============================
    //  ICONE PERSONALIZZATE
    // ============================
    var iconaCastello = L.AwesomeMarkers.icon({
        markerColor: "orange",
        iconColor: "white",
        icon: "landmark",
        prefix: "fa"
    });

    var iconaChiesa = L.AwesomeMarkers.icon({
        markerColor: "blue",
        iconColor: "white",
        icon: "church",
        prefix: "fa"
    });

    // ============================
    //  MONUMENTI DI CACCAMO
    // ============================

    // CASTELLO DI CACCAMO
    L.marker([37.93241, 13.66075], {icon: iconaCastello})
      .addTo(map)
      .bindPopup(`
          <b>Castello di Caccamo</b><br>
          Orari: 09:00 – 17:00<br>
          <a href="https://www.comune.caccamo.pa.it/turismo" target="_blank">Acquista biglietti</a>
      `)
      .bindTooltip("Castello di Caccamo", {sticky: true});

    // CHIESA SAN GIORGIO MARTIRE
    L.marker([37.93202, 13.66463], {icon: iconaChiesa})
      .addTo(map)
      .bindPopup(`
          <b>Chiesa San Giorgio Martire</b><br>
          Domenica: 08:30 – 11:00 – 18:00<br>
          Feriali: 18:00
      `)
      .bindTooltip("San Giorgio Martire", {sticky: true});

    // CHIESA SANTA MARIA DEGLI ANGELI
    L.marker([37.93286, 13.66642], {icon: iconaChiesa})
      .addTo(map)
      .bindPopup(`
          <b>Santa Maria degli Angeli</b><br>
          Domenica: 09:00 – 12:00<br>
          Feriali: 17:00 – 19:00
      `)
      .bindTooltip("Santa Maria degli Angeli", {sticky: true});

    // CHIESA SS. ANNUNZIATA
    L.marker([37.93252, 13.66339], {icon: iconaChiesa})
      .addTo(map)
      .bindPopup(`
          <b>Chiesa SS. Annunziata</b><br>
          Domenica: 09:00 – 11:30<br>
          Feriali: 18:00
      `)
      .bindTooltip("SS. Annunziata", {sticky: true});

    // BADIA
    L.marker([37.93192, 13.66252], {icon: iconaChiesa})
      .addTo(map)
      .bindPopup(`
          <b>Badia</b><br>
          Orari visita: 10:00–13:00, 15:00–18:00
      `)
      .bindTooltip("Badia", {sticky: true});

    // CONVENTO DEI CAPPUCCINI
    L.marker([37.92892, 13.66232], {icon: iconaChiesa})
      .addTo(map)
      .bindPopup(`
          <b>Convento dei Cappuccini</b><br>
          Domenica: 09:00 – 12:00<br>
          Feriali: 17:00 – 19:00
      `)
      .bindTooltip("Convento dei Cappuccini", {sticky: true});

    // ============================
    //  CONTROLLO COORDINATE
    // ============================
    var mousePos = new L.Control.MousePosition({
        position: "topright",
        separator: " | ",
        emptyString: "Clicca sulla mappa per le coordinate",
        numDigits: 5,
        prefix: "Coordinate del punto:"
    });
    map.addControl(mousePos);

    var latLngPopup = L.popup();
    function latLngPop(e) {
        latLngPopup
            .setLatLng(e.latlng)
            .setContent("Latitude: " + e.latlng.lat.toFixed(4) +
                        "<br>Longitude: " + e.latlng.lng.toFixed(4))
            .openOn(map);
    }
    map.on('click', latLngPop);

</script>

</body>
</html>
