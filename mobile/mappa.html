<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Illustrata Caccamo</title>

    <style>
        body {
            margin: 0;
            background: #d8c2a1; /* sfondo marrone chiaro */
            font-family: sans-serif;
        }

        #mappa {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .punto {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #d8c2a1; /* stesso colore dello sfondo */
            border: 2px solid #000; /* contorno nero */
            transform: translate(-50%, -50%);
        }

        .etichetta {
            position: absolute;
            background: rgba(255,255,255,0.8);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid #000;
            transform: translate(-50%, -120%);
            white-space: nowrap;
        }
    </style>
</head>

<body>

<div id="mappa"></div>

<script>
// Carica il JSON
fetch("data.json")
    .then(response => response.json())
    .then(data => {
        console.log("Dati caricati:", data);

        let isDragging = false;
let startX, startY;
let scrollLeft, scrollTop;

const mappa = document.getElementById("mappa");

mappa.addEventListener("mousedown", (e) => {
  isDragging = true;
  startX = e.pageX - mappa.offsetLeft;
  startY = e.pageY - mappa.offsetTop;
  scrollLeft = mappa.scrollLeft;
  scrollTop = mappa.scrollTop;
});

mappa.addEventListener("mouseleave", () => isDragging = false);
mappa.addEventListener("mouseup", () => isDragging = false);

mappa.addEventListener("mousemove", (e) => {
  if (!isDragging) return;
  e.preventDefault();
  const x = e.pageX - mappa.offsetLeft;
  const y = e.pageY - mappa.offsetTop;
  const walkX = (x - startX);
  const walkY = (y - startY);
  mappa.scrollLeft = scrollLeft - walkX;
  mappa.scrollTop = scrollTop - walkY;
});

        // Limiti geografici per convertire lat/lng in coordinate schermo
        const minLat = 37.9240;
        const maxLat = 37.9370;
        const minLng = 13.6580;
        const maxLng = 13.6740;

        const mappa = document.getElementById("mappa");
        const width = mappa.clientWidth;
        const height = mappa.clientHeight;

        function posX(lng) {
            return ((lng - minLng) / (maxLng - minLng)) * width;
        }

        function posY(lat) {
            return height - ((lat - minLat) / (maxLat - minLat)) * height;
        }

        function aggiungiPunto(lat, lng, nome) {
            const x = posX(lng);
            const y = posY(lat);

            const punto = document.createElement("div");
            punto.className = "punto";
            punto.style.left = x + "px";
            punto.style.top = y + "px";

            const label = document.createElement("div");
            label.className = "etichetta";
            label.style.left = x + "px";
            label.style.top = y + "px";
            label.innerText = nome;

            mappa.appendChild(punto);
            mappa.appendChild(label);
        }

        // Castello
        aggiungiPunto(data.castello.lat, data.castello.lng, data.castello.nome);

        // Chiese
        data.chiese.forEach(c => {
            aggiungiPunto(c.lat, c.lng, c.nome);
        });

        // Ristoranti
        data.ristoranti.forEach(r => {
            aggiungiPunto(r.lat, r.lng, r.nome);
        });

        // Bar
        data.bar.forEach(b => {
            aggiungiPunto(b.lat, b.lng, b.nome);
        });

        // Pub
        data.pub.forEach(p => {
            aggiungiPunto(p.lat, p.lng, p.nome);
        });
    });
</script>

</body>
</html>
