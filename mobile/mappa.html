<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS personalizzato -->
    <link rel="stylesheet" href="mappa.css">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css">
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
</head>

<body>

    <div id="map"></div>

    <script>

        // COORDINATE CASTELLO
        const monumento = [37.9325, 13.6645];

        // CREA MAPPA
        var map = L.map('map').setView(monumento, 16);

        // TILE LAYER
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        /* ============================
           ICONE PERSONALIZZATE
        ============================ */

        // CASTELLO (dorato stilizzato)
        var iconaCastello = L.icon({
            iconUrl: 'img/icon-castello-dorato.png',
            iconSize: [55, 55],
            className: 'icon-monumento'
        });

        // CHIESE GRANDI (croce barocca)
        var iconaChiesaGrande = L.icon({
            iconUrl: 'img/icon-croce-barocca.png',
            iconSize: [45, 45],
            className: 'icon-chiesa-grande'
        });

        // CHIESE PICCOLE (le altre 33)
        var iconaChiesaPiccola = L.icon({
            iconUrl: 'img/icon-croce-barocca.png',
            iconSize: [18, 18],
            className: 'icon-chiesa-piccola'
        });

        /* ============================
           MARKER CASTELLO
        ============================ */

        L.marker(monumento, { icon: iconaCastello })
            .addTo(map)
            .bindPopup(
                "<b>Castello di Caccamo</b><br>" +
                "Orari: 09:00–17:00 (inv), 09:00–19:00 (est)<br>" +
                "<a href='https://www.coopculture.it/it/prodotti/castello-di-caccamo/' target='_blank'>Acquista biglietti</a>"
            )
            .openPopup();

        /* ============================
           PERCORSO NERO
        ============================ */

        let percorsoRosso = null;

        function distanza(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a =
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        map.on('click', function(e) {
            const start = [e.latlng.lat, e.latlng.lng];

            if (percorsoRosso) {
                map.removeLayer(percorsoRosso);
            }

            percorsoRosso = L.polyline([start, monumento], {
                className: 'percorso-nero'
            }).addTo(map);

            const km = distanza(start[0], start[1], monumento[0], monumento[1]);
            const minuti = Math.round((km / 4) * 60);

            L.marker(start)
                .addTo(map)
                .bindPopup(
                    "📍 Punto di partenza<br>" +
                    "📏 Distanza: " + km.toFixed(2) + " km<br>" +
                    "⏱️ Tempo stimato: " + minuti + " min"
                )
                .openPopup();
        });

    </script>

</body>
</html>
