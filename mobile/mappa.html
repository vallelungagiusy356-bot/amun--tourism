<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Mappa Caccamo + Strade OSM</title>
  <style>
    body {
      margin: 0;
      background: #d8c2a1;
      font-family: "Cormorant Garamond", serif;
    }

    #mappa {
      position: relative;
      width: 2000px;
      height: 2000px;
      overflow: scroll;
      cursor: grab;
    }

    #mappa:active {
      cursor: grabbing;
    }

    .punto {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #d8c2a1;
      border: 2px solid #000;
      transform: translate(-50%, -50%);
    }

    .etichetta {
      position: absolute;
      background: rgba(255,255,255,0.8);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 12px;
      border: 1px solid #000;
      transform: translate(-50%, -120%);
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="mappa">
  <svg id="strade" width="2000" height="2000"
       style="position:absolute; top:0; left:0; pointer-events:none;"></svg>
</div>

<script>
const mappa = document.getElementById("mappa");
const svg   = document.getElementById("strade");
const width = 2000;
const height = 2000;

let minLat, maxLat, minLng, maxLng;

// 1) Carico il tuo data.json
fetch("data.json")
  .then(r => r.json())
  .then(data => {
    // --- calcolo bounding box dai tuoi punti ---
    const punti = [];

    data.chiese.forEach(p => punti.push(p));
    data.ristoranti.forEach(p => punti.push(p));
    data.bar.forEach(p => punti.push(p));
    data.pub.forEach(p => punti.push(p));
    punti.push(data.castello);

    minLat = Math.min(...punti.map(p => p.lat));
    maxLat = Math.max(...punti.map(p => p.lat));
    minLng = Math.min(...punti.map(p => p.lng));
    maxLng = Math.max(...punti.map(p => p.lng));

    function posX(lng) {
      return ((lng - minLng) / (maxLng - minLng)) * width;
    }

    function posY(lat) {
      return height - ((lat - minLat) / (maxLat - minLat)) * height;
    }

    // --- disegno i tuoi punti ---
    function aggiungiPunto(lat, lng, nome) {
      const x = posX(lng);
      const y = posY(lat);

      const punto = document.createElement("div");
      punto.className = "punto";
      punto.style.left = x + "px";
      punto.style.top  = y + "px";

      const label = document.createElement("div");
      label.className = "etichetta";
      label.style.left = x + "px";
      label.style.top  = y + "px";
      label.innerText  = nome;

      mappa.appendChild(punto);
      mappa.appendChild(label);
    }

    aggiungiPunto(data.castello.lat, data.castello.lng, data.castello.nome);
    data.chiese.forEach(c => aggiungiPunto(c.lat, c.lng, c.nome));
    data.ristoranti.forEach(r => aggiungiPunto(r.lat, r.lng, r.nome));
    data.bar.forEach(b => aggiungiPunto(b.lat, b.lng, b.nome));
    data.pub.forEach(p => aggiungiPunto(p.lat, p.lng, p.nome));

    // --- ora chiedo le strade a Overpass ---
    caricaStradeDaOSM(posX, posY);
  });

// 2) Chiamata a Overpass API per le strade
function caricaStradeDaOSM(posX, posY) {
  const bbox = `${minLat},${minLng},${maxLat},${maxLng}`;

  const query = `
    [out:json][timeout:25];
    (
      way["highway"](${bbox});
    );
    out geom;
  `;

  fetch("https://overpass-api.de/api/interpreter", {
    method: "POST",
    body: query
  })
  .then(r => r.json())
  .then(osm => {
    osm.elements
      .filter(el => el.type === "way" && el.geometry)
      .forEach(way => {
        disegnaStradaOSM(way.geometry, way.tags && way.tags.highway, posX, posY);
      });
  })
  .catch(err => console.error("Errore Overpass:", err));
}

// 3) Disegno una strada OSM come path SVG
function disegnaStradaOSM(geometry, highwayType, posX, posY) {
  let d = "";
  geometry.forEach((pt, i) => {
    const x = posX(pt.lon);
    const y = posY(pt.lat);
    d += (i === 0 ? `M ${x} ${y} ` : `L ${x} ${y} `);
  });

  // tipo: principale o via
  const isMain =
    highwayType === "primary" ||
    highwayType === "secondary" ||
    highwayType === "tertiary" ||
    highwayType === "trunk";

  if (isMain) {
    // contorno nero
    const outline = document.createElementNS("http://www.w3.org/2000/svg", "path");
    outline.setAttribute("d", d);
    outline.setAttribute("stroke", "#000");
    outline.setAttribute("stroke-width", "8");
    outline.setAttribute("stroke-linecap", "round");
    outline.setAttribute("stroke-linejoin", "round");
    outline.setAttribute("fill", "none");
    outline.setAttribute("opacity", "0.9");
    svg.appendChild(outline);

    // linea oro
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("stroke", "#d4a64a");
    path.setAttribute("stroke-width", "6");
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("stroke-linejoin", "round");
    path.setAttribute("fill", "none");
    svg.appendChild(path);
  } else {
    // via nera
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("stroke", "#000");
    path.setAttribute("stroke-width", "2");
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("stroke-linejoin", "round");
    path.setAttribute("fill", "none");
    path.setAttribute("opacity", "0.8");
    svg.appendChild(path);
  }
}

// 4) Drag + zoom (come avevi già)
let isDragging = false;
let startX, startY, scrollLeft, scrollTop;

mappa.addEventListener("mousedown", (e) => {
  isDragging = true;
  startX = e.pageX - mappa.offsetLeft;
  startY = e.pageY - mappa.offsetTop;
  scrollLeft = mappa.scrollLeft;
  scrollTop = mappa.scrollTop;
});

mappa.addEventListener("mouseleave", () => isDragging = false);
mappa.addEventListener("mouseup", () => isDragging = false);

mappa.addEventListener("mousemove", (e) => {
  if (!isDragging) return;
  e.preventDefault();
  const x = e.pageX - mappa.offsetLeft;
  const y = e.pageY - mappa.offsetTop;
  const walkX = (x - startX);
  const walkY = (y - startY);
  mappa.scrollLeft = scrollLeft - walkX;
  mappa.scrollTop = scrollTop - walkY;
});

let scale = 1;
mappa.addEventListener("wheel", (e) => {
  e.preventDefault();
  scale += e.deltaY * -0.001;
  scale = Math.min(Math.max(0.5, scale), 2);
  mappa.style.transform = `scale(${scale})`;
});
</script>

</body>
</html>
