<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Mappa Illustrata Caccamo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #d8c2a1;
  font-family: "Cormorant Garamond", serif;
}

#mappa {
  position: relative;
  width: 2000px;
  height: 2000px;
  overflow: scroll;
  cursor: grab;
}

#mappa:active {
  cursor: grabbing;
}

/* Nomi vie */
.nome-via {
  font-size: 14px;
  fill: #000;
  stroke: #d8c2a1;
  stroke-width: 3px;
  paint-order: stroke;
  font-family: "Cormorant Garamond", serif;
  opacity: 0.9;
}

/* Icone */
.icon {
  transform: translate(-50%, -50%);
}
</style>
</head>

<body>

<div id="mappa">

  <!-- AREE URBANE / VERDI -->
  <svg id="aree" width="2000" height="2000"
       style="position:absolute; top:0; left:0; pointer-events:none;"></svg>

  <!-- STRADE -->
  <svg id="strade" width="2000" height="2000"
       style="position:absolute; top:0; left:0; pointer-events:none;"></svg>

  <!-- NOMI DELLE VIE -->
  <svg id="nomi-vie" width="2000" height="2000"
       style="position:absolute; top:0; left:0; pointer-events:none;"></svg>

  <!-- ICONE -->
  <svg id="icone" width="2000" height="2000"
       style="position:absolute; top:0; left:0; pointer-events:none;"></svg>

</div>

<script>
const mappa = document.getElementById("mappa");
const svgAree = document.getElementById("aree");
const svgStrade = document.getElementById("strade");
const svgNomi = document.getElementById("nomi-vie");
const svgIcone = document.getElementById("icone");

const width = 2000;
const height = 2000;

let minLat, maxLat, minLng, maxLng;

// 1) Carico data.json
fetch("data.json")
  .then(r => r.json())
  .then(data => {

    const punti = [];
    data.chiese.forEach(p => punti.push(p));
    data.ristoranti.forEach(p => punti.push(p));
    data.bar.forEach(p => punti.push(p));
    data.pub.forEach(p => punti.push(p));
    punti.push(data.castello);

    minLat = Math.min(...punti.map(p => p.lat));
    maxLat = Math.max(...punti.map(p => p.lat));
    minLng = Math.min(...punti.map(p => p.lng));
    maxLng = Math.max(...punti.map(p => p.lng));

    function posX(lng) {
      return ((lng - minLng) / (maxLng - minLng)) * width;
    }

    function posY(lat) {
      return height - ((lat - minLat) / (maxLat - minLat)) * height;
    }

    // 2) Icone stilizzate
    function aggiungiIcona(lat, lng, tipo) {
      const x = posX(lng);
      const y = posY(lat);

      let svgPath = "";

      if (tipo === "chiesa") {
        svgPath = "M10 0 L20 10 L10 20 L0 10 Z"; // croce stilizzata
      }
      if (tipo === "bar") {
        svgPath = "M5 0 L15 0 L20 10 L0 10 Z"; // tazzina
      }
      if (tipo === "ristorante") {
        svgPath = "M5 0 L5 20 M15 0 L15 20"; // forchetta
      }
      if (tipo === "castello") {
        svgPath = "M0 20 L0 5 L5 0 L10 5 L10 20 Z"; // torre
      }

      const icon = document.createElementNS("http://www.w3.org/2000/svg", "path");
      icon.setAttribute("d", svgPath);
      icon.setAttribute("fill", "#000");
      icon.setAttribute("transform", `translate(${x},${y}) scale(2)`);
      icon.setAttribute("class", "icon");

      svgIcone.appendChild(icon);
    }

    // Aggiungo icone
    aggiungiIcona(data.castello.lat, data.castello.lng, "castello");
    data.chiese.forEach(c => aggiungiIcona(c.lat, c.lng, "chiesa"));
    data.ristoranti.forEach(r => aggiungiIcona(r.lat, r.lng, "ristorante"));
    data.bar.forEach(b => aggiungiIcona(b.lat, b.lng, "bar"));
    data.pub.forEach(p => aggiungiIcona(p.lat, p.lng, "bar"));

    // 3) Carico strade + aree + nomi vie
    caricaOSM(posX, posY);
  });

// 4) Overpass API
function caricaOSM(posX, posY) {
  const bbox = `${minLat},${minLng},${maxLat},${maxLng}`;

  const query = `
    [out:json][timeout:25];
    (
      way["highway"](${bbox});
      way["landuse"](${bbox});
    );
    out geom;
  `;

  fetch("https://overpass-api.de/api/interpreter", {
    method: "POST",
    body: query
  })
  .then(r => r.json())
  .then(osm => {
    osm.elements.forEach(el => {
      if (el.type === "way" && el.geometry) {
        if (el.tags.landuse) disegnaArea(el, posX, posY);
        if (el.tags.highway) disegnaStrada(el, posX, posY);
        if (el.tags.name && el.tags.highway) disegnaNomeVia(el, posX, posY);
      }
    });
  });
}

// 5) Disegno aree urbane / verdi
function disegnaArea(way, posX, posY) {
  const colori = {
    residential: "#d1b894aa",
    grass: "#a8d08daa",
    meadow: "#a8d08daa",
    forest: "#7ca37daa",
    park: "#a8d08daa"
  };

  const colore = colori[way.tags.landuse];
  if (!colore) return;

  let d = "M ";
  way.geometry.forEach(pt => {
    d += `${posX(pt.lon)} ${posY(pt.lat)} `;
  });
  d += "Z";

  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", d);
  path.setAttribute("fill", colore);
  path.setAttribute("stroke", "none");

  svgAree.appendChild(path);
}

// 6) Disegno strade
function disegnaStrada(way, posX, posY) {
  let d = "";
  way.geometry.forEach((pt, i) => {
    const x = posX(pt.lon);
    const y = posY(pt.lat);
    d += (i === 0 ? `M ${x} ${y} ` : `L ${x} ${y} `);
  });

  const main = ["primary", "secondary", "tertiary", "trunk"];

  if (main.includes(way.tags.highway)) {
    const outline = document.createElementNS("http://www.w3.org/2000/svg", "path");
    outline.setAttribute("d", d);
    outline.setAttribute("stroke", "#000");
    outline.setAttribute("stroke-width", "8");
    outline.setAttribute("fill", "none");
    svgStrade.appendChild(outline);

    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("stroke", "#d4a64a");
    path.setAttribute("stroke-width", "6");
    path.setAttribute("fill", "none");
    svgStrade.appendChild(path);
  } else {
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("stroke", "#000");
    path.setAttribute("stroke-width", "2");
    path.setAttribute("fill", "none");
    svgStrade.appendChild(path);
  }
}

// 7️⃣ Disegno nomi vie (curvi e ordinati)
let nomiPos = [];
let idCounter = 0;

function disegnaNomeVia(way, posX, posY) {
  const pts = way.geometry;
  if (!pts || pts.length < 3) return; // salta vie troppo corte

  // calcolo punto medio
  const mid = pts[Math.floor(pts.length / 2)];
  const x = posX(mid.lon);
  const y = posY(mid.lat);

  // controllo sovrapposizione con altri nomi
  if (nomiPos.some(p => Math.hypot(p.x - x, p.y - y) < 40)) return;
  nomiPos.push({x, y});

  // crea path per textPath
  const id = "via" + (++idCounter);
  let d = "";
  pts.forEach((pt, i) => {
    const px = posX(pt.lon);
    const py = posY(pt.lat);
    d += (i === 0 ? `M ${px} ${py} ` : `L ${px} ${py} `);
  });

  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("id", id);
  path.setAttribute("d", d);
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", "none");
  svgNomi.appendChild(path);

  // testo curvo
  const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
  text.setAttribute("class", "nome-via");

  const textPath = document.createElementNS("http://www.w3.org/2000/svg", "textPath");
  textPath.setAttributeNS("http://www.w3.org/1999/xlink", "href", "#" + id);
  textPath.setAttribute("startOffset", "50%");
  textPath.setAttribute("text-anchor", "middle");
  textPath.textContent = way.tags.name;

  text.appendChild(textPath);
  svgNomi.appendChild(text);
      }

// 8) Drag + zoom
let isDragging = false;
let startX, startY, scrollLeft, scrollTop;

mappa.addEventListener("mousedown", e => {
  isDragging = true;
  startX = e.pageX - mappa.offsetLeft;
  startY = e.pageY - mappa.offsetTop;
  scrollLeft = mappa.scrollLeft;
  scrollTop = mappa.scrollTop;
});

mappa.addEventListener("mouseleave", () => isDragging = false);
mappa.addEventListener("mouseup", () => isDragging = false);

mappa.addEventListener("mousemove", e => {
  if (!isDragging) return;
  e.preventDefault();
  const x = e.pageX - mappa.offsetLeft;
  const y = e.pageY - mappa.offsetTop;
  mappa.scrollLeft = scrollLeft - (x - startX);
  mappa.scrollTop = scrollTop - (y - startY);
});

let scale = 1;
mappa.addEventListener("wheel", e => {
  e.preventDefault();
  scale += e.deltaY * -0.001;
  scale = Math.min(Math.max(0.5, scale), 2);
  mappa.style.transform = `scale(${scale})`;
});
</script>

</body>
</html>
