<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Illustrata Caccamo</title>

    <style>
        body {
            margin: 0;
            background: #d8c2a1;
            font-family: sans-serif;
        }

        /* La mappa deve essere più grande dello schermo */
        #mappa {
            width: 2000px;
            height: 2000px;
            position: relative;
            overflow: scroll;
            cursor: grab;
        }

        #mappa:active {
            cursor: grabbing;
        }

        .punto {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #d8c2a1;
            border: 2px solid #000;
            transform: translate(-50%, -50%);
        }

        .etichetta {
            position: absolute;
            background: rgba(255,255,255,0.8);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid #000;
            transform: translate(-50%, -120%);
            white-space: nowrap;
        }
    </style>
</head>

<body>

<div id="mappa">
    <!-- LIVELLO STRADE -->
    <svg id="strade" width="2000" height="2000"
         style="position:absolute; top:0; left:0; pointer-events:none;">
    </svg>
</div>

<script>

// ===============================
// 1️⃣ DICHIARAZIONE MAPPA
// ===============================
const mappa = document.getElementById("mappa");
const svg = document.getElementById("strade");

// ===============================
// 2️⃣ CARICAMENTO JSON E DISEGNO PUNTI
// ===============================
fetch("data.json")
    .then(response => response.json())
    .then(data => {

        const minLat = 37.9240;
        const maxLat = 37.9370;
        const minLng = 13.6580;
        const maxLng = 13.6740;

        const width = 2000;
        const height = 2000;

        function posX(lng) {
            return ((lng - minLng) / (maxLng - minLng)) * width;
        }

        function posY(lat) {
            return height - ((lat - minLat) / (maxLat - minLat)) * height;
        }

        function aggiungiPunto(lat, lng, nome) {
            const x = posX(lng);
            const y = posY(lat);

            const punto = document.createElement("div");
            punto.className = "punto";
            punto.style.left = x + "px";
            punto.style.top = y + "px";

            const label = document.createElement("div");
            label.className = "etichetta";
            label.style.left = x + "px";
            label.style.top = y + "px";
            label.innerText = nome;

            mappa.appendChild(punto);
            mappa.appendChild(label);
        }

        // Disegno punti
        aggiungiPunto(data.castello.lat, data.castello.lng, data.castello.nome);
        data.chiese.forEach(c => aggiungiPunto(c.lat, c.lng, c.nome));
        data.ristoranti.forEach(r => aggiungiPunto(r.lat, r.lng, r.nome));
        data.bar.forEach(b => aggiungiPunto(b.lat, b.lng, b.nome));
        data.pub.forEach(p => aggiungiPunto(p.lat, p.lng, p.nome));

        // ===============================
        // 3️⃣ FUNZIONE DISEGNO STRADE
        // ===============================
        function disegnaStrada(punti, tipo = "via") {
            let d = "";

            punti.forEach((p, i) => {
                const x = posX(p.lng);
                const y = posY(p.lat);

                if (i === 0) {
                    d += `M ${x} ${y} `;
                } else {
                    d += `L ${x} ${y} `;
                }
            });

            // Strada principale oro con contorno nero
            if (tipo === "principale") {
                const outline = document.createElementNS("http://www.w3.org/2000/svg", "path");
                outline.setAttribute("d", d);
                outline.setAttribute("stroke", "#000");
                outline.setAttribute("stroke-width", "8");
                outline.setAttribute("stroke-linecap", "round");
                outline.setAttribute("stroke-linejoin", "round");
                outline.setAttribute("opacity", "0.9");
                outline.setAttribute("fill", "none");
                svg.appendChild(outline);

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", d);
                path.setAttribute("stroke", "#d4a64a");
                path.setAttribute("stroke-width", "6");
                path.setAttribute("stroke-linecap", "round");
                path.setAttribute("stroke-linejoin", "round");
                path.setAttribute("fill", "none");
                svg.appendChild(path);
            }

            // Via nera
            else {
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", d);
                path.setAttribute("stroke", "#000");
                path.setAttribute("stroke-width", "2");
                path.setAttribute("stroke-linecap", "round");
                path.setAttribute("stroke-linejoin", "round");
                path.setAttribute("opacity", "0.8");
                path.setAttribute("fill", "none");
                svg.appendChild(path);
            }
        }

        // ===============================
        // 4️⃣ STRADE REALI (ESEMPI)
        // ===============================

        // Via Santo Spirito (via nera)
        disegnaStrada([
            { lat: 37.9311, lng: 13.6611 },
            { lat: 37.9313, lng: 13.6614 }
        ], "via");

        // Via Ricovero San Ferdinando (strada principale oro)
        disegnaStrada([
            { lat: 37.9309, lng: 13.6593 },
            { lat: 37.9310, lng: 13.6595 },
            { lat: 37.9312, lng: 13.6597 }
        ], "principale");

        // Vicolo della Torre (via nera)
        disegnaStrada([
            { lat: 37.9312, lng: 13.6595 },
            { lat: 37.9314, lng: 13.6597 }
        ], "via");

    });

// ===============================
// 5️⃣ TRASCINAMENTO MAPPA
// ===============================
let isDragging = false;
let startX, startY;
let scrollLeft, scrollTop;

mappa.addEventListener("mousedown", (e) => {
  isDragging = true;
  startX = e.pageX - mappa.offsetLeft;
  startY = e.pageY - mappa.offsetTop;
  scrollLeft = mappa.scrollLeft;
  scrollTop = mappa.scrollTop;
});

mappa.addEventListener("mouseleave", () => isDragging = false);
mappa.addEventListener("mouseup", () => isDragging = false);

mappa.addEventListener("mousemove", (e) => {
  if (!isDragging) return;
  e.preventDefault();
  const x = e.pageX - mappa.offsetLeft;
  const y = e.pageY - mappa.offsetTop;
  const walkX = (x - startX);
  const walkY = (y - startY);
  mappa.scrollLeft = scrollLeft - walkX;
  mappa.scrollTop = scrollTop - walkY;
});

// ===============================
// 6️⃣ ZOOM
// ===============================
let scale = 1;
mappa.addEventListener("wheel", (e) => {
  e.preventDefault();
  scale += e.deltaY * -0.001;
  scale = Math.min(Math.max(0.5, scale), 2);
  mappa.style.transform = `scale(${scale})`;
});

</script>

</body>
</html>
