<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            height: 100%;
            width: 100%;
        }

        /* Stile pulsante Portami Qui */
        .btn-portami {
            background:#000;
            color:#FFD78F;
            padding:8px 14px;
            border:1px solid #FFD78F;
            border-radius:8px;
            margin-top:6px;
            font-size:14px;
            cursor:pointer;
        }

        /* ============================
           PULSANTI FLOTTANTI MINIMAL
        ============================ */
        .map-buttons {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9999;
        }

        .btn-float {
            background: rgba(255, 255, 255, 0.9);
            color: #b08a57;
            border: 1px solid #b08a57;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 13px;
            font-family: "Inter", sans-serif;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: all 0.2s ease;
        }

        .btn-float:hover {
            background: #b08a57;
            color: #fff;
        }
    </style>
</head>

<body>

<div id="map"></div>

<!-- ============================
     PULSANTI FLOTTANTI MINIMAL
============================ -->
<div class="map-buttons">
    <button id="btnCastello" class="btn-float">🏰 Castello</button>
    <button id="btnMonumenti" class="btn-float">📍 Monumenti</button>
    <button id="btnPercorso" class="btn-float">🚶 Percorso</button>
</div>

<script>
function initMap() {

    // ============================
    //   COORDINATE
    // ============================

    const coord = {
        castello: { lat: 37.9325, lng: 13.6645 },
        sanGiorgio: { lat: 37.93334, lng: 13.66411 },
        santaMariaAngeli: { lat: 37.93394, lng: 13.66272 },
        ssAnnunziata: { lat: 37.93218, lng: 13.66202 },
        badia: { lat: 37.93286, lng: 13.66341 },
        cappuccini: { lat: 37.93452, lng: 13.66618 }
    };

    // ============================
    //   MAPPA (STILE CARTOON)
    // ============================

    const map = new google.maps.Map(document.getElementById("map"), {
        zoom: 16,
        center: coord.castello,
        styles: [
          { "elementType": "geometry", "stylers": [{ "color": "#f5e6d3" }] },
          { "elementType": "labels.text.fill", "stylers": [{ "color": "#8b5a2b" }] },
          { "elementType": "labels.text.stroke", "stylers": [{ "color": "#f5e6d3" }] },

          { "featureType": "poi", "elementType": "geometry", "stylers": [{ "color": "#f0d2a0" }] },
          { "featureType": "poi.park", "elementType": "geometry.fill", "stylers": [{ "color": "#d8e8c8" }] },

          { "featureType": "road", "elementType": "geometry", "stylers": [{ "color": "#ffffff" }] },
          { "featureType": "road", "elementType": "geometry.stroke", "stylers": [{ "color": "#d1b48c" }] },

          { "featureType": "road.highway", "elementType": "geometry", "stylers": [{ "color": "#f0cfa0" }] },

          { "featureType": "water", "elementType": "geometry.fill", "stylers": [{ "color": "#bcd4e6" }] }
        ]
    });

    // ============================
    //   ICONE
    // ============================

    const iconaCastello = {
        url: "img/icon-castello-dorato.png",
        scaledSize: new google.maps.Size(55, 55)
    };

    const iconaChiesaGrande = {
        url: "img/icon-croce-barocca.png",
        scaledSize: new google.maps.Size(45, 45)
    };

    // ============================
    //   DIRECTIONS (PERCORSO REALE)
    // ============================

    const directionsService = new google.maps.DirectionsService();
    const directionsRenderer = new google.maps.DirectionsRenderer({
        suppressMarkers: false,
        polylineOptions: {
            strokeColor: "#000000",
            strokeWeight: 5
        }
    });
    directionsRenderer.setMap(map);

    function calcolaPercorso(start, end) {
        directionsService.route(
            {
                origin: start,
                destination: end,
                travelMode: google.maps.TravelMode.WALKING
            },
            (result, status) => {
                if (status === "OK") {
                    directionsRenderer.setDirections(result);
                }
            }
        );
    }

    // ============================
    //   PERCORSO AL CLICK
    // ============================

    let percorsoAttivo = false;

    document.getElementById("btnPercorso").addEventListener("click", () => {
        percorsoAttivo = true;
        alert("Tocca un punto sulla mappa per calcolare il percorso.");
    });

    map.addListener("click", (e) => {
        if (!percorsoAttivo) return;

        const end = {
            lat: e.latLng.lat(),
            lng: e.latLng.lng()
        };

        calcolaPercorso(coord.castello, end);
        percorsoAttivo = false;
    });

    // ============================
    //   FUNZIONE AGGIUNGI MARKER
    // ============================

    function aggiungiMarker(pos, icona, titolo, html) {
        const marker = new google.maps.Marker({
            position: pos,
            map: map,
            icon: icona,
            title: titolo
        });

        const info = new google.maps.InfoWindow({
            content: html
        });

        marker.addListener("click", () => info.open(map, marker));
    }

    // ============================
    //   MARKER + POPUP INTERNI
    // ============================

    aggiungiMarker(coord.castello, iconaCastello, "Castello di Caccamo", `
        <b>Castello di Caccamo</b><br>
        Orari: 09:00–17:00 (inv), 09:00–19:00 (est)<br>
        Biglietti disponibili in loco<br>
        <button class="btn-portami" onclick="calcolaPercorsoUtente(${coord.castello.lat}, ${coord.castello.lng})">🚶‍♂️ Portami qui</button>
    `);

    aggiungiMarker(coord.sanGiorgio, iconaChiesaGrande, "San Giorgio", `
        <b>Chiesa San Giorgio Martire</b><br>
        Piazza Duomo, 2 – Caccamo<br>
        Domenica: 08:30 – 11:00 – 18:00<br>
        Feriali: 18:00<br>
        <button class="btn-portami" onclick="calcolaPercorsoUtente(${coord.sanGiorgio.lat}, ${coord.sanGiorgio.lng})">🚶‍♂️ Portami qui</button>
    `);

    aggiungiMarker(coord.santaMariaAngeli, iconaChiesaGrande, "Santa Maria degli Angeli", `
        <b>Chiesa Santa Maria degli Angeli</b><br>
        Via Roma – Caccamo<br>
        Domenica: 09:00 – 12:00<br>
        Feriali: 17:00 – 19:00<br>
        <button class="btn-portami" onclick="calcolaPercorsoUtente(${coord.santaMariaAngeli.lat}, ${coord.santaMariaAngeli.lng})">🚶‍♂️ Portami qui</button>
    `);

    aggiungiMarker(coord.ssAnnunziata, iconaChiesaGrande, "SS. Annunziata", `
        <b>Chiesa SS. Annunziata</b><br>
        Via SS. Annunziata – Caccamo<br>
        Domenica: 09:00 – 11:30<br>
        Feriali: 18:00<br>
        <button class="btn-portami" onclick="calcolaPercorsoUtente(${coord.ssAnnunziata.lat}, ${coord.ssAnnunziata.lng})">🚶‍♂️ Portami qui</button>
    `);

    aggiungiMarker(coord.badia, iconaChiesaGrande, "Badia", `
        <b>Chiesa di San Benedetto della Badia</b><br>
        Orari visita: 10:00–13:00, 15:00–18:00<br>
        Pavimento in maiolica visitabile<br>
        Biglietti disponibili in loco<br>
        <button class="btn-portami" onclick="calcolaPercorsoUtente(${coord.badia.lat}, ${coord.badia.lng})">🚶‍♂️ Portami qui</button>
    `);

    aggiungiMarker(coord.cappuccini, iconaChiesaGrande, "Cappuccini", `
        <b>Convento dei Frati Cappuccini</b><br>
        Contrada Cappuccini – Caccamo<br>
        Domenica: 09:00 – 12:00<br>
        Feriali: 17:00 – 19:00<br>
        <button class="btn-portami" onclick="calcolaPercorsoUtente(${coord.cappuccini.lat}, ${coord.cappuccini.lng})">🚶‍♂️ Portami qui</button>
    `);

    // ============================
    //   PULSANTI FLOTTANTI JS
    // ============================

    document.getElementById("btnCastello").addEventListener("click", () => {
        map.setCenter(coord.castello);
        map.setZoom(17);
    });

    document.getElementById("btnMonumenti").addEventListener("click", () => {
        map.setCenter(coord.castello);
        map.setZoom(16);
    });

}
</script>

<!-- QUI LA TUA API KEY È AL POSTO GIUSTO -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDv-tIu-34BVyuz4t3gayTQY5ePYzFSVe4&callback=initMap" async defer></script>

</body>
</html>
