<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css">
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        #map {
            height: 100%;
            width: 100%;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <script>
        // CREA LA MAPPA
        var map = L.map('map').setView([37.9325, 13.6645], 16);

        // AGGIUNGI IL TILE LAYER (fondamentale!)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // MARKER DI TEST
        L.marker([37.9325, 13.6645]).addTo(map)
            .bindPopup("Castello di Caccamo")
            .openPopup();
    </script>

</body>
</html>
