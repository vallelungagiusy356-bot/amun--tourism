    <!-- SCRIPT LOGICA GENERALE -->
    <script>
        // La tua logica rimane identica, ho solo aggiornato l'HTML sopra!
        const audio = document.getElementById("bg-music");
        const trigger = document.getElementById("audio-trigger");
        const toggleBtn = document.getElementById("toggle-music");
        audio.volume = 0.5;

        function startMusic() {
            if (trigger) trigger.remove();
            audio.play().catch(() => {});
        }
        document.addEventListener("touchstart", startMusic, { once: true });
        document.addEventListener("click", startMusic, { once: true });
        if(trigger) trigger.addEventListener("click", startMusic);

        toggleBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (audio.paused) { audio.play(); toggleBtn.textContent = "🔈"; } 
            else { audio.pause(); toggleBtn.textContent = "🔇"; }
        });

        // 2. CONFIGURAZIONE ATTIVITÀ (Dizionario)
        const activityMeta = {
            "the_castle": { link: "https://www.facebook.com/share/18vZG4MXRW/", badge: "Pub" },
            "kittipigghi": { link: "https://www.kitipigghi.it/", badge: "Pub" },
            "chiosco_san_francesco": { link: "https://www.facebook.com/share/1B4aAYCLgD/", badge: "Solo Estate" },
            "al_maniero": { link: "https://www.facebook.com/share/18u3GL8zLz/", badge: "Ristorante" },
            "il_borgo": { link: "https://www.ilborgoristorante.it/", badge: "Ristorante" },
            "a_castellana": { link: "https://www.castellana.it/", badge: "Ristorante" },
            "caffè_royal": { link: "https://www.pasticceriacafferoyal.it/", badge: "Bar Pasticceria" },
            "capricci_di_sicilia": { link: "https://www.facebook.com/share/1H2pDMDxFv/", badge: "Gastronomia" },
            "la_bottega_dei_sapori": { link: "#", badge: "Pizzeria" },
            // Aggiungi qui gli altri man mano che serve
        };

        // 3. GENERATORE DINAMICO CARD
        function renderFoodCards(data) {
            const container = document.getElementById('food-container');
            if(!container) return; // Se non siamo nella pagina con le card, esci
            
            const cardsData = data.pages?.food_page?.cards;
            if(!cardsData) return;

            container.innerHTML = ''; 

            Object.keys(cardsData).forEach(key => {
                const meta = activityMeta[key] || { link: "#", badge: "Info" };
                const desc = cardsData[key];
                const cleanTitle = key.replace(/_/g, ' ').toUpperCase();
                
                const cardHTML = `
                    <a href="${meta.link}" target="_blank" class="food-card">
                        <div class="food-card-content">
                            <div class="food-card-header">
                                <h3 class="food-card-title activity-name">${cleanTitle}</h3>
                                <span class="badge">${meta.badge}</span>
                            </div>
                            <p class="food-card-desc">${desc}</p>
                            <span class="food-card-btn">Vedi Dettagli ➔</span>
                        </div>
                    </a>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // 4. CARICAMENTO LINGUA E AVVIO
        let currentLang = localStorage.getItem("lang") || "it";

        function loadLanguage(lang) {
            fetch(`./lang/${lang}.json`) 
                .then(res => res.json())
                .then(data => {
                    // Traduci elementi UI
                    document.querySelectorAll("[data-i18n]").forEach(el => {
                        const key = el.getAttribute("data-i18n");
                        const text = key.split('.').reduce((o,i)=>o?.[i], data);
                        if (text) el.innerHTML = text;
                    });
                    // Genera card dinamiche
                    renderFoodCards(data);
                    // Aggiorna stato pulsanti lingua
                    document.querySelectorAll(".lang-switcher button").forEach(btn => {
                        btn.classList.toggle("active", btn.dataset.lang === lang);
                    });
                })
                .catch(err => console.error("Errore lingua:", err));

            localStorage.setItem("lang", lang);
            currentLang = lang;
            if (hasShownWelcomeMobile) {
                renderWelcomeMobile();
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll(".lang-switcher button").forEach(btn => {
                btn.addEventListener("click", () => loadLanguage(btn.dataset.lang));
            });
            loadLanguage(currentLang);
        });

        // 5. INSTALLAZIONE PWA ("Aggiungi alla schermata Home")
        let deferredInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredInstallPrompt = e;
        });

        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        }

        const installBtnMobile = document.getElementById("install-pwa-btn-mobile");
        if (installBtnMobile) {
            installBtnMobile.addEventListener("click", async () => {
                if (deferredInstallPrompt) {
                    deferredInstallPrompt.prompt();
                    await deferredInstallPrompt.userChoice;
                    deferredInstallPrompt = null;
                } else if (isIOS()) {
                    alert('Su iPhone/iPad: tocca l\'icona Condividi in Safari, poi "Aggiungi alla schermata Home".');
                } else {
                    alert('Apri il menu del browser e cerca "Aggiungi alla schermata Home" o "Installa app".');
                }
            });
        }

        // 6. PWA SW
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./service-worker.js").catch(err => console.log("SW Error:", err));
        }

        // ============================================================
        // ================  CHAT CASTELLANA (MOBILE)  ================
        // ============================================================
        const API_BASE_URL = "https://castellana.pythonanywhere.com";
        const PREMIUM_STORAGE_KEY = "amuni_premium_access";
        const VOICE_PREF_KEY = "amuni_voice_enabled";

        function getStoredAccessCode() {
            const raw = localStorage.getItem(PREMIUM_STORAGE_KEY);
            if (!raw) return null;
            try {
                const data = JSON.parse(raw);
                if (new Date(data.expires_at) > new Date()) {
                    return data.code;
                } else {
                    localStorage.removeItem(PREMIUM_STORAGE_KEY);
                    return null;
                }
            } catch (e) {
                return null;
            }
        }

        function storeAccessCode(code, expiresAt) {
            localStorage.setItem(PREMIUM_STORAGE_KEY, JSON.stringify({
                code: code,
                expires_at: expiresAt
            }));
        }

        // --------------------------
        // TTS — stessa logica delle altre pagine del sito
        // --------------------------
        let voiceEnabled = localStorage.getItem(VOICE_PREF_KEY) !== "off";
        const voiceToggleBtnMobile = document.getElementById("voice-toggle-btn-mobile");

        let vociDisponibili = [];
        function aggiornaVociDisponibili() {
            vociDisponibili = window.speechSynthesis.getVoices();
        }
        if ("speechSynthesis" in window) {
            aggiornaVociDisponibili();
            window.speechSynthesis.onvoiceschanged = aggiornaVociDisponibili;
        }

        const NOMI_VOCE_FEMMINILE = {
            "it-IT": ["Google italiano", "Elsa", "Alice", "Federica", "Silvia", "Paola"],
            "en-US": ["Google US English", "Samantha", "Zira", "Aria", "Jenny"],
            "fr-FR": ["Google français", "Amelie", "Julie", "Denise", "Hortense"],
            "de-DE": ["Google Deutsch", "Anna", "Katja", "Petra", "Helena"],
            "es-ES": ["Google español", "Monica", "Helena", "Elvira", "Paloma"]
        };
        const INDIZI_VOCE_MASCHILE = /male|david|mark|daniel|thomas|diego|paolo|hans|marco|luca|carlos|antonio|cosimo/i;

        function trovaVoceCastellana(langCode) {
            if (!vociDisponibili.length) vociDisponibili = window.speechSynthesis.getVoices();
            const nomiPreferiti = NOMI_VOCE_FEMMINILE[langCode] || [];
            for (const nome of nomiPreferiti) {
                const voce = vociDisponibili.find(v => v.name.includes(nome));
                if (voce) return voce;
            }
            const linguaBase = langCode.split('-')[0];
            const stessaLingua = vociDisponibili.filter(v =>
                v.lang === langCode || (v.lang || '').startsWith(linguaBase)
            );
            const nonMaschile = stessaLingua.find(v => !INDIZI_VOCE_MASCHILE.test(v.name));
            return nonMaschile || stessaLingua[0] || vociDisponibili[0] || null;
        }

        function updateVoiceToggleIconMobile() {
            if (voiceToggleBtnMobile) voiceToggleBtnMobile.textContent = voiceEnabled ? "🔊" : "🔇";
        }
        updateVoiceToggleIconMobile();

        if (voiceToggleBtnMobile) {
            voiceToggleBtnMobile.addEventListener("click", (e) => {
                e.stopPropagation();
                voiceEnabled = !voiceEnabled;
                localStorage.setItem(VOICE_PREF_KEY, voiceEnabled ? "on" : "off");
                updateVoiceToggleIconMobile();
                if (!voiceEnabled && "speechSynthesis" in window) window.speechSynthesis.cancel();
            });
        }

        function ttsLangCode(lang) {
            const map = { it: "it-IT", en: "en-US", fr: "fr-FR", es: "es-ES", de: "de-DE" };
            return map[lang] || "it-IT";
        }

        function speakText(text) {
            if (!voiceEnabled || !text || !("speechSynthesis" in window)) return;
            window.speechSynthesis.cancel();
            setTimeout(() => {
                const langCode = ttsLangCode(currentLang);
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.voice = trovaVoceCastellana(langCode);
                utterance.lang = langCode;
                utterance.rate = 0.84;
                utterance.pitch = 0.95;
                utterance.volume = 1.0;
                window.speechSynthesis.speak(utterance);
            }, 60);
        }

        function castellanaZitta() {
            if ("speechSynthesis" in window) window.speechSynthesis.cancel();
        }

        // --------------------------
        // MICROFONO
        // --------------------------
        const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
        const micBtnMobile = document.getElementById("mic-btn-mobile");
        let recognitionMobile = null;
        let isListeningMobile = false;

        function sttLangCode(lang) {
            const map = { it: "it-IT", en: "en-US", fr: "fr-FR", es: "es-ES", de: "de-DE" };
            return map[lang] || "it-IT";
        }

        if (SpeechRecognitionAPI && micBtnMobile) {
            recognitionMobile = new SpeechRecognitionAPI();
            recognitionMobile.continuous = false;
            recognitionMobile.interimResults = false;

            recognitionMobile.onstart = () => {
                isListeningMobile = true;
                micBtnMobile.classList.add("listening");
            };
            recognitionMobile.onend = () => {
                isListeningMobile = false;
                micBtnMobile.classList.remove("listening");
            };
            recognitionMobile.onerror = () => {
                isListeningMobile = false;
                micBtnMobile.classList.remove("listening");
            };
            recognitionMobile.onresult = (event) => {
                const testoRiconosciuto = event.results[0][0].transcript;
                sendChatMessageMobile(testoRiconosciuto);
            };

            micBtnMobile.addEventListener("click", (e) => {
                e.stopPropagation();
                if (isListeningMobile) {
                    recognitionMobile.stop();
                    return;
                }
                recognitionMobile.lang = sttLangCode(currentLang);
                castellanaZitta();
                try {
                    recognitionMobile.start();
                } catch (err) {
                    console.error("Errore riconoscimento vocale:", err);
                }
            });
        } else if (micBtnMobile) {
            micBtnMobile.style.display = "none";
        }

            const msg = document.createElement('div');
            msg.className = 'message-mobile' + (sender === 'user' ? ' user-msg-mobile' : '');

            const textSpan = document.createElement('span');
            textSpan.innerHTML = text.replace(/\n/g, '<br>');
            msg.appendChild(textSpan);

            if (sender !== 'user') {
                const audioBtn = document.createElement('button');
                audioBtn.innerHTML = '🔊';
                audioBtn.title = 'Ascolta la Castellana';
                audioBtn.className = 'audio-btn-mobile';
                audioBtn.onclick = () => speakText(text);
                msg.appendChild(audioBtn);
            }

            messagesBox.appendChild(msg);

            if (link) {
                const btn = document.createElement('button');
                btn.className = 'chat-link-btn-mobile';
                btn.textContent = 'Vai alla pagina →';
                btn.onclick = () => window.location.href = resolveLinkPathMobile(link);
                messagesBox.appendChild(btn);
            }

            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        // (cartella "mobile/") vanno quindi fatti puntare a
        // "../desktop/nomefile.html", a meno che non siano già indirizzi
        // completi (http...) o percorsi già relativi alla cartella mobile.
        function resolveLinkPathMobile(link) {
            if (!link) return link;
            if (link.startsWith("http") || link.startsWith("../desktop/") || link.startsWith("/mobile/")) {
                return link;
            }
            return "../desktop/" + link;
        }

        let usedTopicsMobile = new Set();
        let exploredGroupsMobile = new Set();
        let fullTopicMenuMobile = [];
        let hasShownWelcomeMobile = false;

        function renderMenuStateMobile(currentGroupName) {
            const messagesBox = document.getElementById('chat-messages-mobile');
            if (!messagesBox) return;

            const old = messagesBox.querySelector('.topic-menu-state-mobile');
            if (old) old.remove();

            const wrap = document.createElement('div');
            wrap.className = 'topic-menu-mobile topic-menu-state-mobile';

            if (currentGroupName) {
                const groupEntry = fullTopicMenuMobile.find(e => e.group === currentGroupName);
                if (groupEntry) {
                    groupEntry.items.forEach(it => {
                        if (usedTopicsMobile.has(it.id)) return;
                        const b = document.createElement('button');
                        b.className = 'topic-btn-mobile';
                        b.textContent = it.label;
                        b.addEventListener('click', () => selectPageTopicMobile(it, currentGroupName));
                        wrap.appendChild(b);
                    });
                }
            }

            fullTopicMenuMobile.forEach(entry => {
                if (exploredGroupsMobile.has(entry.group)) return;
                const groupBtn = document.createElement('button');
                groupBtn.className = 'topic-btn-mobile topic-group-btn-mobile';
                groupBtn.textContent = entry.group + ' ▸';
                groupBtn.addEventListener('click', () => renderMenuStateMobile(entry.group));
                wrap.appendChild(groupBtn);
            });

            if (wrap.children.length === 0) {
                const knowledge = HOME_KNOWLEDGE_MOBILE[currentLang] || HOME_KNOWLEDGE_MOBILE.it;
                appendChatMessageMobile(knowledge.closing, 'castellana');
                if (voiceEnabled) speakText(knowledge.closing);
                return;
            }

            messagesBox.appendChild(wrap);
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        function selectPageTopicMobile(item, groupName) {
            usedTopicsMobile.add(item.id);
            castellanaZitta();
            appendChatMessageMobile(item.label, 'user');

            const knowledge = HOME_KNOWLEDGE_MOBILE[currentLang] || HOME_KNOWLEDGE_MOBILE.it;
            setTimeout(() => {
                appendChatMessageMobile(knowledge.followUp, 'castellana');
                if (voiceEnabled) speakText(knowledge.followUp);
                setTimeout(() => {
                    window.location.href = item.page;
                }, 1600);
            }, 300);

            const groupEntry = fullTopicMenuMobile.find(e => e.group === groupName);
            if (groupEntry && groupEntry.items.every(it => usedTopicsMobile.has(it.id))) {
                exploredGroupsMobile.add(groupName);
            }
        }

        function renderWelcomeMobile() {
            const messagesBox = document.getElementById('chat-messages-mobile');
            if (!messagesBox) return;
            messagesBox.innerHTML = '';
            usedTopicsMobile.clear();
            exploredGroupsMobile.clear();

            const knowledge = HOME_KNOWLEDGE_MOBILE[currentLang] || HOME_KNOWLEDGE_MOBILE.it;
            appendChatMessageMobile(knowledge.welcome, 'castellana');
            if (voiceEnabled) speakText(knowledge.welcome);

            fullTopicMenuMobile = knowledge.groups;
            renderMenuStateMobile(null);

            hasShownWelcomeMobile = true;
        }

        // --------------------------
        // ATTIVAZIONE CODICE + MESSAGGI LIBERI
        // --------------------------
        async function tryActivateCodeMobile(rawMessage) {
            const match = rawMessage.match(/^(codice|code)\s+([A-Za-z0-9-]+)/i);
            if (!match) return false;

            const code = match[2].toUpperCase();
            appendChatMessageMobile(rawMessage, 'user');

            try {
                const res = await fetch(`${API_BASE_URL}/activate-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code, lang: currentLang })
                });
                const data = await res.json();

                if (data.success) {
                    storeAccessCode(code, data.expires_at);
                    const expiryDate = new Date(data.expires_at);
                    const formatted = expiryDate.toLocaleDateString(currentLang, { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
                    appendChatMessageMobile(`Premium attivato! Avrai accesso ai contenuti esclusivi fino al ${formatted}.`, 'castellana');
                    updatePremiumStatusDisplayMobile();
                } else {
                    appendChatMessageMobile(data.message || 'Codice non valido.', 'castellana');
                }
            } catch (err) {
                console.error('Errore attivazione codice:', err);
                appendChatMessageMobile('Al momento non riesco a verificare il codice — riprova tra poco.', 'castellana');
            }

            return true;
        }

        async function sendChatMessageMobile(text) {
            if (!text.trim()) return;

            const wasActivationAttempt = await tryActivateCodeMobile(text);
            if (wasActivationAttempt) return;

            appendChatMessageMobile(text, 'user');
            castellanaZitta();

            try {
                const res = await fetch(`${API_BASE_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        page: "home",
                        lang: currentLang,
                        access_code: getStoredAccessCode() || ""
                    })
                });

                if (!res.ok) throw new Error('Risposta non valida dal server');

                const data = await res.json();
                appendChatMessageMobile(data.reply, 'castellana', data.link);
                if (data.speak || voiceEnabled) speakText(data.reply);

            } catch (err) {
                console.error('Errore chat:', err);
                appendChatMessageMobile('Al momento non riesco a risponderti — riprova tra poco.', 'castellana');
            }
        }

        const chatInputFieldMobile = document.getElementById('chat-input-mobile');
        const sendBtnMobile = document.getElementById('send-btn-mobile');

        function handleSendMobile() {
            sendChatMessageMobile(chatInputFieldMobile.value);
            chatInputFieldMobile.value = '';
        }

        if (chatInputFieldMobile) {
            chatInputFieldMobile.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.keyCode === 13) {
                    e.preventDefault();
                    handleSendMobile();
                }
            });
        }
        if (sendBtnMobile) {
            sendBtnMobile.addEventListener('click', handleSendMobile);
        }

        // --------------------------
        // INDICATORE PREMIUM
        // --------------------------
        const PREMIUM_STATUS_TEXT_MOBILE = {
            it: { active: (d) => `👑 Premium attivo fino al ${d}`, free: "🔓 Versione gratuita" },
            en: { active: (d) => `👑 Premium active until ${d}`, free: "🔓 Free version" },
            fr: { active: (d) => `👑 Premium actif jusqu'au ${d}`, free: "🔓 Version gratuite" },
            es: { active: (d) => `👑 Premium activo hasta el ${d}`, free: "🔓 Versión gratuita" },
            de: { active: (d) => `👑 Premium aktiv bis ${d}`, free: "🔓 Kostenlose Version" }
        };

        function updatePremiumStatusDisplayMobile() {
            const bar = document.getElementById('premium-status-bar-mobile');
            if (!bar) return;
            const texts = PREMIUM_STATUS_TEXT_MOBILE[currentLang] || PREMIUM_STATUS_TEXT_MOBILE.it;
            const raw = localStorage.getItem(PREMIUM_STORAGE_KEY);
            if (raw) {
                try {
                    const data = JSON.parse(raw);
                    if (new Date(data.expires_at) > new Date()) {
                        const d = new Date(data.expires_at);
                        const formatted = d.toLocaleDateString(currentLang, { day: 'numeric', month: 'long' }) +
                            ' ' + d.toLocaleTimeString(currentLang, { hour: '2-digit', minute: '2-digit' });
                        bar.textContent = texts.active(formatted);
                        bar.classList.add('premium-active');
                        return;
                    }
                } catch (e) { /* codice non valido, trattalo come gratuito */ }
            }
            bar.textContent = texts.free;
            bar.classList.remove('premium-active');
        }

        // --------------------------
        // APERTURA / CHIUSURA CHAT
        // --------------------------
        const chatMobileBox = document.getElementById('chat-mobile');
        const closeChatMobileBtn = document.getElementById('close-chat-mobile');
        const talkCastellanaBtn = document.getElementById('talk-castellana-btn');

        if (talkCastellanaBtn) {
            talkCastellanaBtn.addEventListener('click', (e) => {
                // Solo se esiste già un codice Premium valido apriamo la
                // chat qui: altrimenti il link segue il suo percorso
                // normale verso la home desktop, per l'acquisto.
                if (getStoredAccessCode()) {
                    e.preventDefault();
                    chatMobileBox.classList.add('active');
                    updatePremiumStatusDisplayMobile();
                    if (!hasShownWelcomeMobile) {
                        renderWelcomeMobile();
                    }
                }
            });
        }

        if (closeChatMobileBtn) {
            closeChatMobileBtn.addEventListener('click', () => {
                chatMobileBox.classList.remove('active');
                castellanaZitta();
            });
        }
    </script>
