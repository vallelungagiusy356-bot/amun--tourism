<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amunì Tourism - Mobile</title>

    <!-- PWA: Manifest -->
    <link rel="manifest" href="./manifest.json?v=2">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- PWA: Colore barra superiore -->
    <meta name="theme-color" content="#000000">
</head>
<body>

    <button id="audio-trigger" style="
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    opacity:0;
    border:none;
    background:transparent;
    z-index:9999;"></button>

    <!-- AUDIO EPICO -->
    <audio id="bg-music" loop>
        <source src="audio/more-epic-lorem-ipsum-by-ende-dot-app.mp3" type="audio/mpeg">
    </audio>

    <!-- SFONDO -->
    <div class="scene-background"></div>

    <!-- DASHBOARD MOBILE -->
    <header class="dashboard">
        <!-- Chiave aggiornata per coincidere con il JSON -->
        <div class="logo-title" data-i18n="home.amuni_title"></div>

        <!-- 🔊 BOTTONE AUDIO -->
        <button id="toggle-music" class="btn-audio">🔈</button>

        <!-- 🌍 SELETTORE LINGUA -->
        <div class="lang-switcher">
            <button data-lang="it">🇮🇹</button>
            <button data-lang="en">🇬🇧</button>
            <button data-lang="fr">🇫🇷</button>
            <button data-lang="de">🇩🇪</button>
            <button data-lang="es">🇪🇸</button>
        </div>
    </header>

    <!-- LAYOUT MOBILE -->
    <div class="mobile-layout">

        <!-- VIDEO CASTELLANA -->
        <div class="video-container">
            <video autoplay muted loop playsinline class="castellana-avatar">
                <source src="img/castellana_alpha.webm" type="video/webm">
            </video>
        </div>

        <!-- BOTTONI BAROCCHI - Collegati alle chiavi corrette del JSON -->
        <div class="buttons-grid">
            <a href="mangiare.html" class="btn-barocco" data-i18n="home.btn_mangiare"></a>
            <a href="dormire.html" class="btn-barocco" data-i18n="home.btn_dormire"></a>
            <a href="trasporti.html" class="btn-barocco" data-i18n="home.btn_transport"></a>
        </div>

        <div class="buttons-row-2">
            <a href="eventi.html" class="btn-barocco" data-i18n="home.btn_events"></a>
            <a href="monumenti.html" class="btn-barocco" data-i18n="home.btn_monuments"></a>
        </div>

        <!-- BOTTONE CHAT WEB -->
        <a href="../desktop/desktop_index.html" class="btn-castellana">
            <span data-i18n="home.talk_castellana"></span>
        </a>

        <!-- SEZIONE AMUNI -->
        <div class="amuni-box">
            <div class="amuni-title" data-i18n="home.amuni_title"></div>
            <div class="amuni-text" data-i18n="home.amuni_text"></div>
        </div>
    </div>

    <!-- SCRIPT UNIFICATO -->
    <script>
        const audio = document.getElementById("bg-music");
        const trigger = document.getElementById("audio-trigger");
        const toggleBtn = document.getElementById("toggle-music");

        audio.volume = 0.5;

        function startMusic() {
            audio.play().then(() => {
                if(trigger) trigger.remove();
            }).catch(() => {
                setTimeout(() => audio.play(), 200);
            });
        }

        document.addEventListener("touchstart", startMusic, { once: true });
        document.addEventListener("click", startMusic, { once: true });
        if(trigger) trigger.addEventListener("click", startMusic);

        toggleBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (audio.paused) {
                audio.play();
                toggleBtn.textContent = "🔈";
            } else {
                audio.pause();
                toggleBtn.textContent = "🔇";
            }
        });
    </script>

    <!-- SCRIPT MULTILINGUA -->
    <script>
    // Assicurati che il percorso del file JSON sia corretto (es: './lang/' o '../lang/')
    let currentLang = localStorage.getItem("lang") || "it";

    function loadLanguage(lang) {
        // Ho corretto il percorso: usa ./lang/ se il file è nella stessa cartella dell'index
        fetch(`./lang/${lang}.json`) 
            .then(res => res.json())
            .then(data => {
                document.querySelectorAll("[data-i18n]").forEach(el => {
                    const key = el.getAttribute("data-i18n");
                    const text = key.split('.').reduce((o,i)=>o?.[i], data);
                    if (text) el.innerHTML = text;
                });
            })
            .catch(err => console.error("Errore caricamento lingua:", err));

        localStorage.setItem("lang", lang);
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".lang-switcher button").forEach(btn => {
            btn.addEventListener("click", () => {
                loadLanguage(btn.dataset.lang);
            });
        });

        loadLanguage(currentLang);
    });
    </script>

    <!-- PWA: Registrazione Service Worker -->
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./service-worker.js")
                .then(() => console.log("Service Worker registrato"))
                .catch(err => console.log("Errore SW:", err));
        }
    </script>

</body>
</html>
