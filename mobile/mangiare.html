<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amunì Tourism - Mangiare</title>
    <!-- Font Medievale Premium e Font Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="mangiare.css">
    <meta name="theme-color" content="#000000">
</head>
<body>

    <!-- Pulsante invisibile per sbloccare l'audio su mobile -->
    <button id="audio-trigger" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; border:none; background:transparent; z-index:9999;"></button>
    
    <audio id="bg-music" loop>
        <source src="audio/more-epic-lorem-ipsum-by-ende-dot-app.mp3" type="audio/mpeg">
    </audio>

    <div class="scene-background"></div>

    <!-- Dashboard Fissa e ottimizzata -->
    <header class="dashboard">
        <a href="index.html" class="btn-home">🏠</a>
        
        <div class="logo-container">
            <div class="logo-title">AMUNÌ TOURISM</div>
        </div>
        
        <div class="lang-switcher">
            <button data-lang="it">🇮🇹</button>
            <button data-lang="en">🇬🇧</button>
            <button data-lang="fr">🇫🇷</button>
            <button data-lang="de">🇩🇪</button>
            <button data-lang="es">🇪🇸</button>
        </div>
    </header>

    <div class="scroll-content">
        <!-- BARRA DI RICERCA: Spostata qui per un layout migliore (fissa) -->
        <div class="search-container">
            <input type="text" id="food-search" placeholder="Cerca tra i sapori..." onkeyup="filterCards()">
        </div>

        <div class="mobile-layout">
            <section class="section-block" id="block-eat">
                <div class="food-grid" id="food-container"></div>
            </section>
        </div>
    </div>

    <script>
        const activityMeta = {
            "the_castle": { link: "https://www.facebook.com/share/18vZG4MXRW/", badge: "Pub" },
            "kittipigghi": { link: "https://www.kitipigghi.it/", badge: "Pub" },
            "chiosco_san_francesco": { link: "https://www.facebook.com/share/1B4aAYCLgD/", badge: "Solo Estate" },
            "al_maniero": { link: "https://www.facebook.com/share/18u3GL8zLz/", badge: "Ristorante" },
            "il_borgo": { link: "https://www.ilborgoristorante.it/", badge: "Ristorante" },
            "a_castellana": { link: "https://www.castellana.it/", badge: "Ristorante" },
            "caffè_royal": { link: "https://www.pasticceriacafferoyal.it/", badge: "Bar Pasticceria" },
            "capricci_di_sicilia": { link: "https://www.facebook.com/share/1H2pDMDxFv/", badge: "Gastronomia" },
            "la_bottega_dei_sapori": { link: "#", badge: "Pizzeria" }
        };

        function renderFoodCards(data) {
            const container = document.getElementById('food-container');
            const cardsData = data.pages?.food_page?.cards;
            if(!container || !cardsData) return;

            container.innerHTML = ''; 
            Object.keys(cardsData).forEach(key => {
                const meta = activityMeta[key] || { link: "#", badge: "Info" };
                const desc = cardsData[key];
                const cleanTitle = key.replace(/_/g, ' ').toUpperCase();
                
                const cardHTML = `
                    <a href="${meta.link}" target="_blank" class="food-card">
                        <div class="food-card-content">
                            <div class="food-card-header">
                                <h3 class="food-card-title">${cleanTitle}</h3>
                                <span class="badge">${meta.badge}</span>
                            </div>
                            <p class="food-card-desc">${desc}</p>
                            <span class="food-card-btn">Vedi Dettagli ➔</span>
                        </div>
                    </a>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function loadLanguage(lang) {
            fetch(`./lang/${lang}.json`) 
                .then(res => res.json())
                .then(data => {
                    renderFoodCards(data);
                })
                .catch(err => console.error("Errore lingua:", err));
            localStorage.setItem("lang", lang);
        }

        // Funzione per filtrare le card in base alla ricerca
        function filterCards() {
            let input = document.getElementById('food-search').value.toLowerCase();
            let cards = document.querySelectorAll('.food-card');
            cards.forEach(card => {
                let title = card.querySelector('.food-card-title').innerText.toLowerCase();
                card.style.display = title.includes(input) ? "block" : "none";
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll(".lang-switcher button").forEach(btn => {
                btn.addEventListener("click", () => loadLanguage(btn.dataset.lang));
            });
            loadLanguage(localStorage.getItem("lang") || "it");
        });

        // Gestione Audio
        const audio = document.getElementById("bg-music");
        document.addEventListener("touchstart", () => audio.play(), { once: true });
        
        if ("serviceWorker" in navigator) navigator.serviceWorker.register("./service-worker.js");
    </script>
</body>
</html>
