<style id="silktide-consent-manager-overrides">

  --boxShadow: -5px 5px 10px 0px #00000012, 0px 0px 50px 0px #0000001a;
  --fontFamily: Helvetica Neue, Segoe UI, Arial, sans-serif;
  --primaryColor: #9C4C22;

  --textColor: #22303b;

  --iconBackgroundColor: #22303B;
}

/* Icona "riapri preferenze cookie" — non più fissa in basso a
   sinistra sopra i contenuti: viene spostata dentro il footer
   dallo script in fondo alla pagina, e qui diventa "statica"
   cioè scorre con la pagina come un elemento normale. */
#stcm-icon {
  width: 30px !important;
  height: 30px !important;
  bottom: 6px !important;
  left: 6px !important;

      required: true,

      id: "analytics",
      label: "Statistiche",
      description: "Questi cookie ci aiutano a capire come i visitatori usano il sito, in forma aggregata e anonima, per migliorare i contenuti di Amunì Tourism.",
      required: false,
      gtag: "analytics_storage",
      scripts: [
        {
          url: "https://www.googletagmanager.com/gtag/js?id=G-DNTGGXSSM0",
          load: "async"
        }
      ],
      onAccept: function() {
        // Google Analytics 4 (G-DNTGGXSSM0)
        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-DNTGGXSSM0', { 'anonymize_ip': true });
      }
    }
  ],
  text: {
    banner: {
      description: "<p>Amunì Tourism utilizza i cookie per offrirti la migliore esperienza di navigazione e per analizzare il traffico del sito in forma anonima. Puoi scegliere quali accettare.</p>",
      acceptAllButtonText: "Accetta tutti",
      acceptAllButtonAccessibleLabel: "Accetta tutti i cookie",
      rejectNonEssentialButtonText: "Rifiuta i non essenziali",
      rejectNonEssentialButtonAccessibleLabel: "Rifiuta tutti i cookie non essenziali",
      preferencesButtonText: "Preferenze",
      preferencesButtonAccessibleLabel: "Apri le preferenze cookie"
    },
    prompt: {
      description: "<p>Amunì Tourism utilizza i cookie per offrirti la migliore esperienza di navigazione e per analizzare il traffico del sito in forma anonima. Puoi scegliere quali accettare.</p>",
      acceptAllButtonText: "Accetta tutti",
      acceptAllButtonAccessibleLabel: "Accetta tutti i cookie",
      rejectNonEssentialButtonText: "Rifiuta i non essenziali",
      rejectNonEssentialButtonAccessibleLabel: "Rifiuta tutti i cookie non essenziali",
      preferencesButtonText: "Preferenze",
      preferencesButtonAccessibleLabel: "Apri le preferenze cookie"
    },
    preferences: {
      title: "Personalizza le tue preferenze cookie",
      description: "<p>Rispettiamo il tuo diritto alla privacy. Puoi scegliere di non consentire alcuni tipi di cookie. Le tue preferenze verranno applicate a tutto il sito.</p>",
      saveButtonText: "Salva e chiudi",
      saveButtonAccessibleLabel: "Salva le tue preferenze cookie",
      creditLinkText: "Ottieni questo banner gratis",

<!-- ============================================================
     FINE BLOCCO COOKIE + ANALYTICS
     ============================================================ -->

    <title>Amunì Tourism - Mangiare</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="mangiare.css">
    <meta name="theme-color" content="#14283A">
</head>
<body>

    <div class="scene-background"></div>

    <header class="dashboard">
        <div class="logo-container">
            <div class="logo-title">AMUNÌ TOURISM</div>
        </div>

        <div class="right-controls">
            <a href="mobile_index.html" class="btn-home" aria-label="Torna alla home">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11.5 12 4l9 7.5"/>
        <path d="M5.5 9.5V20h13V9.5"/>
        <path d="M10 20v-6h4v6"/>
    </svg>
</a>
            <div class="lang-switcher">
                <button data-lang="it">IT</button>
                <button data-lang="en">EN</button>
                <button data-lang="fr">FR</button>
                <button data-lang="de">DE</button>
                <button data-lang="es">ES</button>
            </div>
        </div>
    </header>

    <div class="scroll-content">
        <div class="search-container">
            <input type="text" id="food-search" class="search-bar" placeholder="Cerca tra i sapori..." onkeyup="filterCards()">
        </div>

        <div class="mobile-layout">
            <section class="section-block" id="block-eat">
                <div class="food-grid" id="food-container"></div>
            </section>

            <section class="section-block" id="block-mini-map">
                <div class="mini-map-wrapper" id="mini-map-wrapper">
                    <iframe src="mappa.html?vista=food" id="mini-map-frame" title="Mappa Amunì" loading="lazy"></iframe>
                    <button id="mini-map-expand" aria-label="Ingrandisci la mappa" type="button">⤢</button>
                </div>
            </section>
        </div>
    </div>

    <style>
        /* ============================================================
           RIQUADRO MAPPA PICCOLA — sezione "Mangiare"
           Mostra la mappa già aperta ma piccola, con un bottone in alto
           a destra per farla diventare a schermo intero (e un altro
           bottone, al suo posto, per richiuderla).
           ============================================================ */
        .mini-map-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            margin: 6px 0 30px;
            border-radius: 10px;
            overflow: hidden;
            border: 3px solid #d4a056;
            box-shadow: 0 0 20px rgba(180, 120, 60, 0.3);
        }

        .mini-map-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .mini-map-wrapper button {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 2;
            width: 34px;
            height: 34px;
            background: rgba(20, 40, 58, 0.85);
            color: #EFE6D3;
            border: 1px solid #d4a056;
            border-radius: 6px;
            font-size: 1.1rem;
            line-height: 1;
            cursor: pointer;
        }

        /* Quando è ingrandita: copre tutto lo schermo */
        .mini-map-wrapper.espansa {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999;
            margin: 0;
            border-radius: 0;
        }
    </style>

    <script>
        const activityMeta = {
            "the_castle":       { link: "https://www.facebook.com/share/18vZG4MXRW/", badge: "pub", estivo: true },
            "o_chianu_fasu":    { link: "https://www.facebook.com/share/1DAqSDoxb9/", badge: "bar" },
            "kittipigghi":      { link: "https://www.kitipigghi.it/", badge: "pub" },
            "chiosco_san_francesco": { link: "https://www.facebook.com/share/1B4aAYCLgD/", badge: "pub", estivo: true },
            "al_maniero":       { link: "https://www.facebook.com/share/18u3GL8zLz/", badge: "ristorante" },
            "il_borgo":         { link: "https://www.ilborgoristorante.it/", badge: "ristorante" },
            "a_castellana":     { link: "https://www.castellana.it/", badge: "ristorante" },
            "caffè_royal":      { link: "https://www.pasticceriacafferoyal.it/", badge: "bar_pasticceria" },
            "capricci_di_sicilia": { link: "https://www.facebook.com/share/1H2pDMDxFv/", badge: "gastronomia" },
            "la_bottega_dei_sapori": { link: "https://www.facebook.com/share/1Bw4y3TS3J/", badge: "pizzeria" },

            // --- Prima mancavano qui sotto: mostravano il badge di riserva "Info".
            // Categoria confermata guardando il "type" dello stesso posto in data.geojson. ---
            "l_officina_dei_golosi":      { link: "https://www.facebook.com/share/18x5xxaMtH/", badge: "bar" },
            "strapizzami":                { link: "https://share.google/xdcXe7bHuN6werqVk", badge: "gastronomia" },
            "la_spiga_d_oro_food_and_drink": { link: "https://www.facebook.com/share/195TXALtoF/", badge: "ristorante" },
            "bar_ribaudo":                 { link: "https://www.facebook.com/share/199Tivzmiv/", badge: "bar" },
            "bar_del_carmine":             { link: "https://www.facebook.com/share/1Cqnw1ZwLJ/", badge: "bar" },
            "bar_muscarella":              { link: "https://www.facebook.com/share/1DC8zQUvUm/", badge: "bar" },

            // --- Questi 3 non hanno un punto in data.geojson, quindi non ho
            // una fonte certa: categoria scelta dal nome/descrizione.
            // CONTROLLA e correggimi se non è giusta. ---
            "pasticceria_fratelli_scimeca": { link: "https://www.pasticceriascimeca.it/it/", badge: "pasticceria" },
            "dolci_tentazioni":            { link: "https://www.facebook.com/share/1FW1xYKoJq/", badge: "bar" },
            "il_dolce":                    { link: "https://www.facebook.com/share/1GZAk8S5uu/", badge: "bar" },

            // --- Nuove attività, appena aggiunte alla mappa ---
            "briciole_di_pane":            { link: "https://www.facebook.com/share/1DsD1Lk1TR/", badge: "gastronomia" },
            "a_ficurinnia":                { link: "https://www.aficurinniaristorante.it/", badge: "ristorante", fuoriBorgo: true }, // frazione San Giovanni Li Greci, non a piedi

            // --- Erano sulla mappa da tempo ma non avevano ancora una card ---
            "agriturismo_cicala":          { link: "https://agriturismocicala.it/sito/", badge: "ristorante" },
            "giallombardo":                { link: "https://www.facebook.com/share/1EPugL3qiQ/", badge: "bar" },
            "al_chiosco_da_pietro":        { link: "https://wanderboat.ai/restaurants/italy/caccamo/al-chiosco-da-pietro/JQJS86jGQ2OogttZ7Wmn6Q", badge: "bar" },
            "dai_e_vai_pub":               { link: "https://www.facebook.com/share/1aZSabkQFq/", badge: "pub" },
            "da_peppe":                    { link: "#", badge: "ristorante" }
        };

        function renderFoodCards(data) {
            const container = document.getElementById('food-container');
            const cardsData = data.pages?.food_page?.cards;
            if(!container || !cardsData) return;

            // Testi tradotti per i badge e per "Vedi Dettagli", presi dal
            // file lingua appena caricato (lang/<lingua>.json).
            const badgeLabels = data.pages?.food_page?.badges || {};
            const testoDettagli = data.pages?.food_page?.details_button || 'Vedi Dettagli ➔';
            const testoSoloEstate = badgeLabels.solo_estate || 'Solo Estate';
            const testoFuoriBorgo = badgeLabels.fuori_borgo || 'Raggiungibile solo in auto';

            container.innerHTML = ''; 
            Object.keys(cardsData).forEach(key => {
                const meta = activityMeta[key] || { link: "#", badge: "info" };
                const desc = cardsData[key];
                const cleanTitle = key.replace(/_/g, ' ').toUpperCase();

                // Badge principale tradotto (Bar/Pub/Ristorante/...); poi
                // eventuali badge extra (stagionale, fuori dal borgo...).
                const badgeTesto = badgeLabels[meta.badge] || meta.badge;
                const badgeExtra = [];
                if (meta.estivo) badgeExtra.push(testoSoloEstate);
                if (meta.fuoriBorgo) badgeExtra.push(testoFuoriBorgo);
                const badgeHTML = `<span class="badge">${badgeTesto}</span>` +
                    badgeExtra.map(t => `<span class="badge badge-estivo">${t}</span>`).join('');

                const cardHTML = `
                    <a href="${meta.link}" target="_blank" class="food-card">
                        <div class="food-card-content">
                            <div class="food-card-header">
                                <h3 class="food-card-title">${cleanTitle}</h3>
                                ${badgeHTML}
                            </div>
                            <p class="food-card-desc">${desc}</p>
                            <span class="food-card-btn">${testoDettagli}</span>
                        </div>
                    </a>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function loadLanguage(lang) {
            fetch(`./lang/${lang}.json`) 
                .then(res => res.json())
                .then(data => {
                    renderFoodCards(data);
                    document.querySelectorAll(".lang-switcher button").forEach(btn => {
                        btn.classList.toggle("active", btn.dataset.lang === lang);
                    });
                })
                .catch(err => console.error("Errore lingua:", err));
            localStorage.setItem("lang", lang);

            // Ricarica anche la mappa piccola, così le etichette d'oro
            // cambiano lingua insieme al resto della pagina.
            const miniMapFrame = document.getElementById('mini-map-frame');
            if (miniMapFrame) miniMapFrame.src = miniMapFrame.src;
        }

        function filterCards() {
            let input = document.getElementById('food-search').value.toLowerCase();
            let cards = document.querySelectorAll('.food-card');
            cards.forEach(card => {
                let title = card.querySelector('.food-card-title').innerText.toLowerCase();
                card.style.display = title.includes(input) ? "block" : "none";
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll(".lang-switcher button").forEach(btn => {
                btn.addEventListener("click", () => loadLanguage(btn.dataset.lang));
            });
            loadLanguage(localStorage.getItem("lang") || "it");

            // Bottone che ingrandisce/rimpicciolisce il riquadro della mappa
            const miniMapWrapper = document.getElementById('mini-map-wrapper');
            const miniMapExpandBtn = document.getElementById('mini-map-expand');
            if (miniMapWrapper && miniMapExpandBtn) {
                miniMapExpandBtn.addEventListener('click', () => {
                    const espansa = miniMapWrapper.classList.toggle('espansa');
                    miniMapExpandBtn.textContent = espansa ? '✕' : '⤢';
                    miniMapExpandBtn.setAttribute('aria-label', espansa ? 'Rimpicciolisci la mappa' : 'Ingrandisci la mappa');
                });

                // Se mappa.js (dentro l'iframe) chiede più spazio perché
                // l'utente ha toccato un punto e il fumetto dei dettagli
                // non ci starebbe nel riquadro piccolo, lo ingrandiamo noi.
                window.addEventListener('message', (e) => {
                    if (e.data === 'amuni-espandi-mappa' && !miniMapWrapper.classList.contains('espansa')) {
                        miniMapWrapper.classList.add('espansa');
                        miniMapExpandBtn.textContent = '✕';
                        miniMapExpandBtn.setAttribute('aria-label', 'Rimpicciolisci la mappa');
                    }
                });
            }
        });

        // Service Worker
        if ("serviceWorker" in navigator) navigator.serviceWorker.register("./service-worker.js");
        
    </script>

    <footer class="footer-copyright" style="text-align: center; padding: 30px 20px; background: rgba(15, 25, 34, 0.95); color: #DCCFAF; font-size: 0.85rem; margin-top: 40px; position: relative; z-index: 1;">
        <p>&copy; 2026 Amunì Tourism. Progetto dedicato alla valorizzazione del borgo di Caccamo.</p>
        <p style="font-size: 0.8rem; margin-top: 8px;">
            Le conversazioni con la Castellana possono essere registrate in forma anonima
            per migliorare la qualità del servizio.
            <a href="../mobile/privacy.html" style="color: #D4AF6A;">Maggiori informazioni</a>
        </p>
    </footer>

</body>
</html>
