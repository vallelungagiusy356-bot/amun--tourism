<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amunì Tourism - Monumenti</title>
    <link rel="manifest" href="./manifest.json?v=2">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="monumenti.css">
    <meta name="theme-color" content="#000000">
</head>
<body>

    <button id="audio-trigger" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; border:none; background:transparent; z-index:9999;"></button>
    
    <audio id="bg-music" loop>
        <source src="audio/more-epic-lorem-ipsum-by-ende-dot-app.mp3" type="audio/mpeg">
    </audio>

    <div class="scene-background"></div>

    <header class="dashboard">
    <a href="mobile_index.html" class="btn-home">🏠</a>
    
    <div class="logo-container">
        <div class="logo-title">AMUNÌ TOURISM</div>
    </div>
    
    <div class="lang-switcher">
        <button id="toggle-music" class="btn-audio">🔈</button>
        <button data-lang="it">🇮🇹</button>
        <button data-lang="en">🇬🇧</button>
        <button data-lang="fr">🇫🇷</button>
        <button data-lang="de">🇩🇪</button>
        <button data-lang="es">🇪🇸</button>
    </div>
</header>



    <main class="scroll-content">
        
        <div class="home-welcome-poetry">
            <h1 data-i18n="monuments.title">I Nostri Monumenti</h1>
        </div>

        <div class="event-buttons">
            <a href="castello_di_caccamo.html" class="btn-barocco" data-i18n="monuments.mobile.castello">Castello di Caccamo</a>
            <a href="santamaria.html" class="btn-barocco" data-i18n="monuments.mobile.santamaria">Chiesa S. Maria degli Angeli</a>
            <a href="sangiorgio.html" class="btn-barocco" data-i18n="monuments.mobile.sangiorgio">Chiesa San Giorgio Martire</a>
            <a href="cappuccini.html" class="btn-barocco" data-i18n="monuments.mobile.cappuccini">Convento Frati Cappuccini</a>
            <a href="annunziata.html" class="btn-barocco" data-i18n="monuments.mobile.annunziata">Parrocchia SS. Annunziata</a>
            <a href="sanbenedetto.html" class="btn-barocco" data-i18n="monuments.mobile.sanbenedetto">Chiesa S. Benedetto della Badia</a>
        </div>

        <div class="event-buttons" style="margin-top: 20px;">
            <a href="mappa.html" class="btn-barocco" style="border-color: #79a6d2;">🌐 <span data-i18n="monuments.go_to_map">Vai alla Mappa</span></a>
            <a href="../desktop/desktop_index.html?bypass=true" class="btn-barocco btn-avatar-special">
                <span data-i18n="home.talk_castellana">Parla con la Castellana</span>
            </a>
        </div>

    </main>

    <script>
        const audio = document.getElementById("bg-music");
        const trigger = document.getElementById("audio-trigger");
        const toggleBtn = document.getElementById("toggle-music");
        audio.volume = 0.5;

        function startMusic() {
            audio.play().then(() => { if(trigger) trigger.remove(); }).catch(() => { setTimeout(() => audio.play(), 200); });
        }
        if(trigger) { trigger.addEventListener("click", startMusic); trigger.addEventListener("touchstart", startMusic); }

        toggleBtn.addEventListener("click", () => {
            if (audio.paused) { audio.play(); toggleBtn.textContent = "🔈"; }
            else { audio.pause(); toggleBtn.textContent = "🔇"; }
        });

        let currentLang = localStorage.getItem("lang") || "it";
        function loadLanguage(lang) {
            fetch(`../lang/${lang}.json`)
                .then(res => res.json())
                .then(data => {
                    document.querySelectorAll("[data-i18n]").forEach(el => {
                        const key = el.getAttribute("data-i18n");
                        const text = key.split('.').reduce((o,i) => o ? o[i] : null, data);
                        if (text) el.innerHTML = text;
                    });
                });
            localStorage.setItem("lang", lang);
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll(".lang-switcher button").forEach(btn => {
                btn.addEventListener("click", () => loadLanguage(btn.dataset.lang));
            });
            loadLanguage(currentLang);
            // Effetto entrata
            setTimeout(() => document.querySelector('.scroll-content').classList.add('visible'), 100);
        });
    </script>
</body>
</html>
