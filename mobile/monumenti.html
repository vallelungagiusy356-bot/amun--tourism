<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amunì Tourism - Monumenti</title>
    <link rel="manifest" href="./manifest.json?v=2">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="monumenti.css">
    <meta name="theme-color" content="#000000">
</head>
<body>

    <button id="audio-trigger" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; border:none; background:transparent; z-index:9999;"></button>
    
    <audio id="bg-music" loop>
        <source src="audio/more-epic-lorem-ipsum-by-ende-dot-app.mp3" type="audio/mpeg">
    </audio>

    <div class="scene-background monumento-bg"></div>

    <header class="dashboard">
        <div class="logo-title" data-i18n="menu.title">Amunì Tourism</div>
        <button id="toggle-music" class="btn-audio">🔈</button>
        <div class="lang-switcher">
            <button data-lang="it">🇮🇹</button>
            <button data-lang="en">🇬🇧</button>
            <button data-lang="fr">🇫🇷</button>
            <button data-lang="de">🇩🇪</button>
            <button data-lang="es">🇪🇸</button>
        </div>
    </header>

    <div class="mobile-layout layout-monumenti">
        
        <main class="monumenti-grid">
            
            <section class="quadrant-mobile" onclick="window.location.href='monumento-castello.html'">
                <h2 data-i18n="monuments.castello">Castello di Caccamo</h2>
            </section>

            <section class="quadrant-mobile" onclick="window.location.href='monumento-santamaria.html'">
                <h2 data-i18n="monuments.santamaria">Chiesa S. Maria degli Angeli</h2>
            </section>

            <section class="quadrant-mobile" onclick="window.location.href='monumento-sangiorgio.html'">
                <h2 data-i18n="monuments.sangiorgio">Chiesa San Giorgio Martire</h2>
            </section>

            <section class="quadrant-mobile" onclick="window.location.href='monumento-cappuccini.html'">
                <h2 data-i18n="monuments.cappuccini_mobile">Convento Frati Cappuccini</h2>
            </section>

            <section class="quadrant-mobile" onclick="window.location.href='monumento-annunziata.html'">
                <h2 data-i18n="monuments.annunziata">Parrocchia SS. Annunziata</h2>
            </section>

            <section class="quadrant-mobile" onclick="window.location.href='monumento-sanbenedetto.html'">
                <h2 data-i18n="monuments.sanbenedetto">Chiesa S. Benedetto della Badia</h2>
            </section>

        </main>

        <a href="mappa.html" class="btn-mappa">
            🌐 <span data-i18n="monuments.go_to_map">Vai alla Mappa</span>
        </a>

        <a href="../desktop/index.html" class="btn-castellana">
            <span data-i18n="home.talk_castellana">Parla con la Castellana</span>
        </a>

    </div>

    <script>
        const audio = document.getElementById("bg-music");
        const trigger = document.getElementById("audio-trigger");
        const toggleBtn = document.getElementById("toggle-music");
        audio.volume = 0.5;

        function startMusic() {
            audio.play().then(() => {
                if(trigger) trigger.remove();
            }).catch(() => {
                setTimeout(() => audio.play(), 200);
            });
        }
        if(trigger) {
            trigger.addEventListener("click", startMusic);
            trigger.addEventListener("touchstart", startMusic);
        }

        toggleBtn.addEventListener("click", () => {
            if (audio.paused) {
                audio.play();
                toggleBtn.textContent = "🔈";
            } else {
                audio.pause();
                toggleBtn.textContent = "🔇";
            }
        });

        let currentLang = localStorage.getItem("lang") || "it";
        
        function loadLanguage(lang) {
            fetch(`../lang/${lang}.json`)
                .then(res => res.json())
                .then(data => {
                    document.querySelectorAll("[data-i18n]").forEach(el => {
                        const key = el.getAttribute("data-i18n");
                        const text = key.split('.').reduce((o,i) => o ? o[i] : null, data);
                        if (text) el.innerHTML = text;
                    });

                    // Sincronizzazione classe attiva sui pulsanti lingua
                    document.querySelectorAll(".lang-switcher button").forEach(btn => {
                        if (btn.dataset.lang === lang) btn.classList.add("active");
                        else btn.classList.remove("active");
                    });
                })
                .catch(err => console.error("Errore caricamento lingua:", err));
            localStorage.setItem("lang", lang);
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll(".lang-switcher button").forEach(btn => {
                btn.addEventListener("click", () => loadLanguage(btn.dataset.lang));
            });
            loadLanguage(currentLang);
        });
    </script>
</body>
</html>
