<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monumenti di Caccamo</title>
    <link rel="stylesheet" href="monumenti.css">
</head>

<body>

    <!-- SFONDO -->
    <div class="scene-background"></div>

    <!-- DASHBOARD -->
    <header class="dashboard">
    <div class="logo-title" data-i18n="menu.title"></div>
    <a href="index.html" class="btn-home">🏠</a>

    <div class="lang-switcher">
        <button data-lang="it">🇮🇹</button>
        <button data-lang="en">🇬🇧</button>
        <button data-lang="fr">🇫🇷</button>
        <button data-lang="de">🇩🇪</button>
        <button data-lang="es">🇪🇸</button>
    </div>
    </header>

    <!-- CONTENUTO -->
    <section class="monuments-layout">

    <h2 class="monuments-title" data-i18n="monuments.title"></h2>

<div class="monument-card">
    <h3 data-i18n="monuments.castle_title"></h3>
    <p data-i18n="monuments.castle_desc"></p>
    <a href="castello.html" class="btn-visit" data-i18n="monuments.castle_button"></a>
</div>

<div class="monument-card">
    <h3 data-i18n="monuments.annunziata_title"></h3>
    <p data-i18n="monuments.annunziata_desc"></p>
</div>

<div class="monument-card">
    <h3 data-i18n="monuments.sangiorgio_title"></h3>
    <p data-i18n="monuments.sangiorgio_desc"></p>
</div>

<div class="monument-card">
    <h3 data-i18n="monuments.angeli_title"></h3>
    <p data-i18n="monuments.angeli_desc"></p>
</div>

<div class="monument-card">
    <h3 data-i18n="monuments.cappuccini_title"></h3>
    <p data-i18n="monuments.cappuccini_desc"></p>
</div>

        <!-- BOTTONE CHAT WEB -->
        <a href="../desktop/index.html" class="btn-castellana">
    <span data-i18n="home.talk_castellana"></span>
</a>

    </section>

    <!-- SCRIPT MULTILINGUA -->
    <script>
    let currentLang = localStorage.getItem("lang") || "it";

    function loadLanguage(lang) {
        fetch(`../lang/${lang}.json`)
            .then(res => res.json())
            .then(data => {
                document.querySelectorAll("[data-i18n]").forEach(el => {
                    const key = el.getAttribute("data-i18n");
                    const text = key.split('.').reduce((o,i)=>o[i], data);
                    if (text) el.innerHTML = text;
                });
            });

        localStorage.setItem("lang", lang);
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".lang-switcher button").forEach(btn => {
            btn.addEventListener("click", () => {
                loadLanguage(btn.dataset.lang);
            });
        });

        loadLanguage(currentLang);
    });
    </script>

</body>
</html>
