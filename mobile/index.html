<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amunì Tourism - Mobile</title>

    <link rel="manifest" href="./manifest.json?v=2">

    <link rel="stylesheet" href="style.css">

    <meta name="theme-color" content="#000000">
</head>
<body>

    <button id="audio-trigger" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; border:none; background:transparent; z-index:9999;"></button>
    
    <audio id="bg-music" loop>
        <source src="audio/more-epic-lorem-ipsum-by-ende-dot-app.mp3" type="audio/mpeg">
    </audio>

    <div class="scene-background"></div>

    <header class="dashboard">
        <div class="logo-title" data-i18n="menu.title">Amunì Tourism</div>

        <button id="toggle-music" class="btn-audio">🔈</button>

        <div class="lang-switcher">
            <button data-lang="it">🇮🇹</button>
            <button data-lang="en">🇬🇧</button>
            <button data-lang="fr">🇫🇷</button>
            <button data-lang="de">🇩🇪</button>
            <button data-lang="es">🇪🇸</button>
        </div>
    </header>

    <div class="mobile-layout">

        <div class="video-container">
            <video autoplay muted loop playsinline class="castellana-avatar">
                <source src="img/castellana_alpha.webm" type="video/webm">
            </video>
        </div>

        <div class="buttons-grid">
            <a href="mangiare.html" class="btn-barocco" data-i18n="menu.eat">Mangiare</a>
            <a href="dormire.html" class="btn-barocco" data-i18n="menu.sleep">Dormire</a>
            <a href="trasporti.html" class="btn-barocco" data-i18n="menu.transport">Trasporti</a>
        </div>

        <div class="buttons-row-2">
            <a href="eventi.html" class="btn-barocco" data-i18n="menu.events">Eventi</a>
            <a href="monumenti.html" class="btn-barocco" data-i18n="menu.monuments">Monumenti</a>
        </div>

        <a href="../desktop/index.html" class="btn-castellana">
            <span data-i18n="home.talk_castellana">Parla con la Castellana</span>
        </a>

        <div class="amuni-box">
            <div class="amuni-title" data-i18n="home.amuni_title">Amunì Tourism</div>
            <div class="amuni-text" data-i18n="home.amuni_text">Il borgo ti aspetta.</div>
        </div>

        <section class="install-app">
            <h2 data-i18n="home.install_app">Installa l'App</h2>

            <a href="https://raw.githubusercontent.com/vallelungagiusy356-bot/amun--tourism/main/app-release-signed.apk" class="btn-barocco">
                📲 <span data-i18n="home.download_apk">Scarica APK</span>
            </a>

            <a href="https://vallelungagiusy356-bot.github.io/amun--tourism/mobile/" class="btn-barocco">
                🌐 <span data-i18n="home.open_webapp">Apri Web App</span>
            </a>

            <div class="qr-section">
                <img src="https://vallelungagiusy356-bot.github.io/amun--tourism/qr.png" alt="QR code Amunì Tourism" class="qr">
                <p data-i18n="home.scan_qr">Scansiona il QR</p>
            </div>
        </section>

    </div>

    <script>
        // Audio Logic
        const audio = document.getElementById("bg-music");
        const trigger = document.getElementById("audio-trigger");
        const toggleBtn = document.getElementById("toggle-music");
        
        audio.volume = 0.5;
        let musicStarted = false;

        function startMusic() {
            if (!musicStarted) {
                audio.play().then(() => {
                    musicStarted = true;
                    if(trigger) trigger.remove();
                }).catch(() => {
                    setTimeout(() => audio.play(), 200);
                });
            }
        }

        document.addEventListener("touchstart", startMusic, { once: true });
        document.addEventListener("click", startMusic, { once: true });

        toggleBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (audio.paused) {
                audio.play();
                toggleBtn.textContent = "🔈";
            } else {
                audio.pause();
                toggleBtn.textContent = "🔇";
            }
        });

        // Multilanguage Logic
        let currentLang = localStorage.getItem("lang") || "it";

        function loadLanguage(lang) {
            fetch(`../lang/${lang}.json`)
                .then(res => res.json())
                .then(data => {
                    document.querySelectorAll("[data-i18n]").forEach(el => {
                        const key = el.getAttribute("data-i18n");
                        // Navigazione sicura nell'oggetto JSON
                        const text = key.split('.').reduce((o, i) => (o ? o[i] : null), data);
                        if (text) el.innerHTML = text;
                    });
                })
                .catch(err => console.error("Errore caricamento lingua:", err));

            localStorage.setItem("lang", lang);
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll(".lang-switcher button").forEach(btn => {
                btn.addEventListener("click", () => {
                    loadLanguage(btn.dataset.lang);
                });
            });
            loadLanguage(currentLang);
        });

        // PWA
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./service-worker.js");
        }
    </script>
</body>
</html>
