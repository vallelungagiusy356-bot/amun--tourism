<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amunì Tourism - Mobile</title>

    <!-- PWA: Manifest -->
    <link rel="manifest" href="./manifest.json?v=2">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- PWA: Colore barra superiore -->
    <meta name="theme-color" content="#000000">
</head>
<body>

    <!-- AUDIO EPICO -->
    <audio id="bg-music" loop>
        <source src="audio/more-epic-lorem-ipsum-by-ende-dot-app.mp3" type="audio/mpeg">
    </audio>

    <!-- SFONDO -->
    <div class="scene-background"></div>

    <!-- DASHBOARD MOBILE -->
    <header class="dashboard">
        <div class="logo-title" data-i18n="menu.title"></div>

        <!-- 🔊 BOTTONE AUDIO -->
        <button id="toggle-music" class="btn-audio">🔈</button>

        <!-- 🌍 SELETTORE LINGUA -->
        <div class="lang-switcher">
            <button data-lang="it">🇮🇹</button>
            <button data-lang="en">🇬🇧</button>
            <button data-lang="fr">🇫🇷</button>
            <button data-lang="de">🇩🇪</button>
            <button data-lang="es">🇪🇸</button>
        </div>
    </header>

    <!-- LAYOUT MOBILE -->
    <div class="mobile-layout">

        <!-- VIDEO CASTELLANA -->
        <div class="video-container">
            <video autoplay muted loop playsinline class="castellana-avatar">
                <source src="img/castellana_alpha.webm" type="video/webm">
            </video>
        </div>

        <!-- BOTTONI BAROCCHI -->
        <div class="buttons-grid">
            <div class="btn-barocco" data-i18n="menu.eat"></div>
            <div class="btn-barocco" data-i18n="menu.sleep"></div>
            <div class="btn-barocco" data-i18n="menu.transport"></div>
        </div>

        <div class="buttons-row-2">
            <div class="btn-barocco" data-i18n="menu.events"></div>
            <div class="btn-barocco" data-i18n="menu.monuments"></div>
        </div>

        <!-- BOTTONE CHAT WEB -->
        <a href="https://tuosito.it" class="btn-chat-web">
            💬 <span data-i18n="home.chat_web"></span>
        </a>

        <!-- SEZIONE AMUNI -->
        <div class="amuni-box">
            <div class="amuni-title" data-i18n="home.amuni_title"></div>
            <div class="amuni-text" data-i18n="home.amuni_text"></div>
        </div>

        <!-- ⭐ SEZIONE INSTALLA APP ⭐ -->
        <section class="install-app">
            <h2 data-i18n="home.install_app"></h2>

            <!-- Scarica APK -->
            <a href="https://raw.githubusercontent.com/vallelungagiusy356-bot/amun--tourism/main/app-release-signed.apk" class="btn-barocco">
                📲 <span data-i18n="home.download_apk"></span>
            </a>

            <!-- Apri la Web App -->
            <a href="https://vallelungagiusy356-bot.github.io/amun--tourism/mobile/" class="btn-barocco">
                🌐 <span data-i18n="home.open_webapp"></span>
            </a>

            <!-- QR Code -->
            <div class="qr-section">
                <img src="https://vallelungagiusy356-bot.github.io/amun--tourism/qr.png" alt="QR code Amunì Tourism" class="qr">
                <p data-i18n="home.scan_qr"></p>
            </div>
        </section>
        <!-- ⭐ FINE SEZIONE INSTALLA APP ⭐ -->

    </div>

    <!-- SCRIPT: MUSICA PARTE AL PRIMO TOCCO -->
    <script>
        const audio = document.getElementById("bg-music");
        audio.volume = 0.5;

        let musicStarted = false;

        function startMusic() {
            if (!musicStarted) {
                audio.play().then(() => {
                    musicStarted = true;
                }).catch(() => {
                    setTimeout(() => {
                        audio.play();
                    }, 200);
                });

                document.removeEventListener("touchstart", startMusic);
                document.removeEventListener("click", startMusic);
            }
        }

        document.addEventListener("touchstart", startMusic, { once: true });
        document.addEventListener("click", startMusic, { once: true });
    </script>

    <!-- SCRIPT: CONTROLLO AUDIO ON/OFF -->
    <script>
        const toggleBtn = document.getElementById("toggle-music");

        toggleBtn.addEventListener("click", () => {
            if (audio.paused) {
                audio.play();
                toggleBtn.textContent = "🔈";
            } else {
                audio.pause();
                toggleBtn.textContent = "🔇";
            }
        });
    </script>

    <!-- SCRIPT MULTILINGUA -->
    <script>
    let currentLang = localStorage.getItem("lang") || "it";

    function loadLanguage(lang) {
        fetch(`../lang/${lang}.json`)
            .then(res => res.json())
            .then(data => {
                document.querySelectorAll("[data-i18n]").forEach(el => {
                    const key = el.getAttribute("data-i18n");
                    const text = key.split('.').reduce((o,i)=>o[i], data);
                    if (text) el.innerHTML = text;
                });
            });

        localStorage.setItem("lang", lang);
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".lang-switcher button").forEach(btn => {
            btn.addEventListener("click", () => {
                loadLanguage(btn.dataset.lang);
            });
        });

        loadLanguage(currentLang);
    });
    </script>

    <!-- PWA: Registrazione Service Worker -->
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./service-worker.js")
                .then(() => console.log("Service Worker registrato"))
                .catch(err => console.log("Errore SW:", err));
        }
    </script>

</body>
                </html>
