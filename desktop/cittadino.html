<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024">
    <title data-i18n="citizen.title"></title>
    <link rel="stylesheet" href="css_style2_v2.css">
</head>

<body>

    <!-- SFONDO -->
    <div class="scene-background"></div>

    <!-- DASHBOARD DESKTOP -->
    <header class="dashboard">
        <div class="logo-title" data-i18n="menu.title"></div>

        <nav class="nav-desktop">
            <link rel="stylesheet" href="cittadino.css">
            <a href="about.html" data-i18n="menu.about"></a>
            <a href="contact.html" data-i18n="menu.contact"></a>
        </nav>

        <!-- 🌍 SELETTORE LINGUA -->
        <div class="lang-switcher">
            <button data-lang="it">🇮🇹</button>
            <button data-lang="en">🇬🇧</button>
            <button data-lang="fr">🇫🇷</button>
            <button data-lang="de">🇩🇪</button>
            <button data-lang="es">🇪🇸</button>
        </div>
    </header>

    <!-- CONTENUTO PRINCIPALE -->
    <main class="citizen-grid">

        <!-- 1° QUADRANTE — LEGGENDE E RADICI -->
        <section class="quadrant">
            <h2 data-i18n="citizen.legends_title"></h2>
            <p data-i18n="citizen.legends_desc"></p>

            <div class="legend-list">
                <div class="legend-item" data-i18n="citizen.legend_felicia"></div>
                <div class="legend-item" data-i18n="citizen.legend_pizzarrone"></div>
            </div>

            <div class="audio-section">
                <h3 data-i18n="citizen.audio_title"></h3>
                <audio controls src="audio/preghiera1.mp3"></audio>
                <audio controls src="audio/preghiera2.mp3"></audio>

                <div class="transcription">
                    <h4 data-i18n="citizen.transcription"></h4>
                    <p id="auto-transcript"></p>
                </div>
            </div>
        </section>

        <<!-- 2° QUADRANTE — CASTELLO -->
<section class="quadrant">
    <h2 data-i18n="citizen.castle_title"></h2>
    <p data-i18n="citizen.castle_desc"></p>

    <div class="castle-3d">
        <iframe src="castello3d.html" class="iframe-3d"></iframe>
    </div>

    <div class="battle-preview">
        <img src="img/battle.png" alt="Medieval battle">
    </div>

    <!-- 🔗 LINK ALLA PAGINA CASTELLO -->
    <a href="castello.html" class="quadrant-link" data-i18n="citizen.castle_more"></a>
</section>

        <!-- 3° QUADRANTE — CHIESE E ARTE -->
        <section class="quadrant">
            <h2 data-i18n="citizen.church_title"></h2>
            <p data-i18n="citizen.church_desc"></p>

            <ul class="church-list">
                <li data-i18n="citizen.church_catacombs"></li>
                <li data-i18n="citizen.church_sangiuseppe"></li>
                <li data-i18n="citizen.church_sepolcri"></li>
            </ul>
        </section>

        <!-- 4° QUADRANTE — CIBO + EVENTI -->
        <section class="quadrant">
            <h2 data-i18n="citizen.food_title"></h2>
            <p data-i18n="citizen.food_desc"></p>

            <ul class="food-list">
                <li data-i18n="citizen.food_arancine"></li>
                <li data-i18n="citizen.food_cocktail"></li>
                <li data-i18n="citizen.food_aperitivo"></li>
            </ul>

            <h3 data-i18n="citizen.events_title"></h3>
            <ul class="event-list">
                <li data-i18n="citizen.event_castellana"></li>
                <li data-i18n="citizen.event_signuruzzu"></li>
                <li data-i18n="citizen.event_salsiccia"></li>
                <li data-i18n="citizen.event_beato"></li>
            </ul>
        </section>

    </main>

    <!-- SCRIPT MULTILINGUA -->
    <script>
    let currentLang = localStorage.getItem("lang") || "it";

    function loadLanguage(lang) {
        fetch(`../lang/${lang}.json`)
            .then(res => res.json())
            .then(data => {
                document.querySelectorAll("[data-i18n]").forEach(el => {
                    const key = el.getAttribute("data-i18n");
                    const text = key.split('.').reduce((o,i)=>o[i], data);
                    if (text) el.innerHTML = text;
                });
            });

        localStorage.setItem("lang", lang);
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".lang-switcher button").forEach(btn => {
            btn.addEventListener("click", () => {
                loadLanguage(btn.dataset.lang);
            });
        });

        loadLanguage(currentLang);
    });
    </script>

</body>
</html>
