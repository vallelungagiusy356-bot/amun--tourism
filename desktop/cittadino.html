<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024">
    <title data-i18n="citizen.title"></title>

    <!-- CSS PRINCIPALE -->
    <link rel="stylesheet" href="cittadino.css">
</head>

<body>

    <!-- DASHBOARD DESKTOP (IDENTICA ALLA HOME, MA SENZA “Cittadino del Borgo”) -->
    <header class="dashboard">

        <!-- TITOLO / LOGO -->
        <div class="logo-title" data-i18n="menu.title"></div>

        <!-- MENU DESKTOP -->
        <nav class="nav-desktop">
            <a href="about.html" data-i18n="menu.about"></a>
            <a href="contact.html" data-i18n="menu.contact"></a>
        </nav>

        <!-- SELETTORE LINGUE -->
        <div class="lang-switcher">
            <button data-lang="it">🇮🇹</button>
            <button data-lang="en">🇬🇧</button>
            <button data-lang="fr">🇫🇷</button>
            <button data-lang="de">🇩🇪</button>
            <button data-lang="es">🇪🇸</button>
        </div>

        <!-- SOLO QUI: PULSANTE HOME -->
        <button class="home-btn" onclick="window.location.href='index.html'">Home</button>

    </header>

    <!-- GRIGLIA 2×2 CON SOLO TITOLI -->
    <main class="citizen-grid">

        <!-- 1° QUADRANTE — LEGGENDE -->
        <section class="quadrant" onclick="window.location.href='leggende.html'">
            <h2 data-i18n="citizen.legends_title"></h2>
        </section>

        <!-- 2° QUADRANTE — CASTELLO -->
        <section class="quadrant castle-card" onclick="window.location.href='castello.html'">
            <h2 data-i18n="citizen.castle_title"></h2>
        </section>

        <!-- 3° QUADRANTE — CHIESE -->
        <section class="quadrant" onclick="window.location.href='chiese.html'">
            <h2 data-i18n="citizen.church_title"></h2>
        </section>

        <!-- 4° QUADRANTE — CIBO + EVENTI -->
        <section class="quadrant" onclick="window.location.href='cibo_eventi.html'">
            <h2 data-i18n="citizen.food_title"></h2>
        </section>

    </main>

    <!-- SCRIPT MULTILINGUA -->
    <script>
    let currentLang = localStorage.getItem("lang") || "it";

    function loadLanguage(lang) {
        fetch(`../lang/${lang}.json`)
            .then(res => res.json())
            .then(data => {
                document.querySelectorAll("[data-i18n]").forEach(el => {
                    const key = el.getAttribute("data-i18n");
                    const text = key.split('.').reduce((o,i)=>o[i], data);
                    if (text) el.innerHTML = text;
                });
            });

        localStorage.setItem("lang", lang);
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".lang-switcher button").forEach(btn => {
            btn.addEventListener("click", () => {
                loadLanguage(btn.dataset.lang);
            });
        });

        loadLanguage(currentLang);
    });
    </script>

</body>
</html>
