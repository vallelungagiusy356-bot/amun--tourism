<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento annullato — Amunì</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root {
    --gold: #C9A24B;
    --terracotta: #B5654A;
    --ink: #2A2420;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #1a1510, var(--ink));
    font-family: 'Cormorant Garamond', serif;
    color: #f5efe6;
    padding: 24px;
    box-sizing: border-box;
  }

  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--gold);
    border-radius: 2px;
    padding: 40px 28px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    color: var(--gold);
    font-size: 1.6rem;
    margin-bottom: 8px;
  }

  p { font-size: 1.15rem; line-height: 1.5; }

  a.torna {
    display: inline-block;
    margin-top: 20px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    background: var(--terracotta);
    color: #fff;
    text-decoration: none;
    border-radius: 4px;
    padding: 12px 28px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Nessun problema, viandante</h1>
  <p>Il pagamento è stato annullato: non ti è stato addebitato nulla.</p>
  <p>Quando vorrai, potrai riprovare direttamente dal sito.</p>
  <a class="torna" href="https://vallelungagiusy356-bot.github.io/amun--tourism/desktop_index.html">Torna al sito</a>
</div>

</body>
</html>
