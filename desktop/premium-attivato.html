<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento completato — Amunì</title>

<!-- Stessi font usati nel resto del sito -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root {
    --gold: #C9A24B;
    --sea: #2E5C6E;
    --terracotta: #B5654A;
    --ink: #2A2420;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #1a1510, var(--ink));
    font-family: 'Cormorant Garamond', serif;
    color: #f5efe6;
    padding: 24px;
    box-sizing: border-box;
  }

  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--gold);
    border-radius: 2px;
    padding: 40px 28px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    color: var(--gold);
    font-size: 1.6rem;
    margin-bottom: 8px;
  }

  p {
    font-size: 1.15rem;
    line-height: 1.5;
    margin: 12px 0;
  }

  .code-box {
    font-family: monospace;
    font-size: 1.8rem;
    letter-spacing: 2px;
    background: rgba(255,255,255,0.08);
    border: 1px dashed var(--gold);
    border-radius: 4px;
    padding: 16px;
    margin: 24px 0;
    color: #fff;
    word-break: break-all;
  }

  button {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    background: var(--terracotta);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 12px 28px;
    cursor: pointer;
    margin-top: 8px;
  }

  button:active { opacity: 0.8; }

  .stato { font-size: 1rem; opacity: 0.8; }
  .errore { color: #e07a6b; }
</style>
</head>
<body>

<div class="card">
  <h1>Grazie, viandante!</h1>
  <div id="contenuto">
    <p class="stato">Sto verificando il tuo pagamento…</p>
  </div>
</div>

<script>
// ---------------------------------------------------------
// Indirizzo del tuo backend su PythonAnywhere
// ---------------------------------------------------------
const BACKEND_URL = "https://castellana.pythonanywhere.com";

// Stessa chiave usata dalle pagine del sito per salvare l'accesso Premium
const PREMIUM_STORAGE_KEY = "amuni_premium_access";

// Legge "session_id" e "return_page" dall'indirizzo della pagina
const params = new URLSearchParams(window.location.search);
const sessionId = params.get("session_id");
const returnPage = params.get("return_page") || "desktop_index.html";

const contenuto = document.getElementById("contenuto");

async function recuperaCodice() {
  if (!sessionId) {
    contenuto.innerHTML = `<p class="errore">Manca il riferimento al pagamento. Se hai appena pagato, controlla la tua email o contattaci.</p>`;
    return;
  }

  try {
    const risposta = await fetch(`${BACKEND_URL}/get-code?session_id=${encodeURIComponent(sessionId)}`);
    const dati = await risposta.json();

    if (!risposta.ok || dati.error) {
      contenuto.innerHTML = `<p class="errore">${dati.error || "Non riesco a confermare il pagamento. Riprova tra qualche secondo ricaricando la pagina."}</p>`;
      return;
    }

    const codice = dati.code;

    // Attiviamo subito il codice su QUESTO dispositivo, cosi' l'utente
    // arriva nel sito gia' con l'accesso Premium attivo, senza dover
    // copiare/incollare nulla a mano.
    try {
      const attivazione = await fetch(`${BACKEND_URL}/activate-code`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: codice, lang: "it" })
      });
      const datiAttivazione = await attivazione.json();
      if (datiAttivazione.success) {
        localStorage.setItem(PREMIUM_STORAGE_KEY, JSON.stringify({
          code: codice,
          expires_at: datiAttivazione.expires_at
        }));
      }
    } catch (e) {
      console.error("Errore attivazione automatica:", e);
      // Non blocchiamo la pagina: l'utente ha comunque il codice a video
      // e potra' inserirlo a mano nella chat come prima.
    }

    contenuto.innerHTML = `
      <p>Il tuo pagamento è andato a buon fine. Il tuo accesso Premium è già attivo su questo dispositivo.</p>
      <div class="code-box" id="codice">${codice}</div>
      <p style="font-size:0.95rem; opacity:0.85;">Tieni da parte questo codice: ti servirà solo se vorrai usare la chat anche da un altro telefono o computer.</p>
      <button onclick="copiaCodice()">Copia codice</button>
      <button onclick="vaiOra()" style="margin-left:8px; background: var(--sea);">Vai ora</button>
      <p class="stato" style="margin-top:20px;">Ti porto alla tua pagina tra <span id="countdown">4</span>…</p>
    `;

    let secondi = 4;
    const countdownEl = document.getElementById("countdown");
    const timer = setInterval(() => {
      secondi -= 1;
      if (countdownEl) countdownEl.textContent = secondi;
      if (secondi <= 0) {
        clearInterval(timer);
        vaiOra();
      }
    }, 1000);

  } catch (e) {
    contenuto.innerHTML = `<p class="errore">Errore di collegamento. Ricarica questa pagina tra qualche istante.</p>`;
  }
}

function vaiOra() {
  window.location.href = returnPage;
}

function copiaCodice() {
  const testo = document.getElementById("codice").innerText;
  navigator.clipboard.writeText(testo).then(() => {
    alert("Codice copiato!");
  });
}

recuperaCodice();
</script>

</body>
</html>
