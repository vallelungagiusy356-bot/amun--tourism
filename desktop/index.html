<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024">
    <title>Amunì Tourism</title>
    <link rel="stylesheet" href="css_style2_v2.css">
</head>

<body>

    <!-- SFONDO -->
    <div class="scene-background"></div>

    <!-- DASHBOARD DESKTOP -->
    <header class="dashboard">
        <div class="logo-title" data-i18n="menu.title"></div>

        <nav class="nav-desktop">
            <a href="cittadino.html" data-i18n="menu.citizen"></a>
            <a href="#" data-i18n="menu.about"></a>
            <a href="#" data-i18n="menu.contact"></a>
        </nav>

        <!-- 🌍 SELETTORE LINGUA -->
        <div class="lang-switcher">
            <button data-lang="it">🇮🇹</button>
            <button data-lang="en">🇬🇧</button>
            <button data-lang="fr">🇫🇷</button>
            <button data-lang="de">🇩🇪</button>
            <button data-lang="es">🇪🇸</button>
        </div>
    </header>

    <!-- CONTENITORE 3D (per ora invisibile) -->
    <div id="castellana-3d"></div>

    <!-- VIDEO CASTELLANA (cliccabile per aprire la chat) -->
    <div class="castellana-video-wrapper">
        <video class="castellana-video" autoplay muted loop playsinline>
            <source src="img/castellana_alpha.webm" type="video/webm">
        </video>
        <div class="castellana-tooltip">Click to chat</div>
    </div>

    <!-- ⭐ SEZIONE INSTALLA APP — DESKTOP ⭐ -->
    <section class="install-app-desktop">

        <div class="install-left">
            <h2 data-i18n="home.install_app"></h2>

            <a href="https://raw.githubusercontent.com/vallelungagiusy356-bot/amun--tourism/main/app-release-signed.apk" 
               class="btn-desktop">
                📲 <span data-i18n="home.download_apk"></span>
            </a>

            <a href="https://vallelungagiusy356-bot.github.io/amun--tourism/mobile/" 
               class="btn-desktop">
                🌐 <span data-i18n="home.open_webapp"></span>
            </a>
        </div>

        <div class="install-right">
            <img src="https://vallelungagiusy356-bot.github.io/amun--tourism/qr.png" 
                 alt="QR Amunì Tourism" 
                 class="qr-desktop">
            <p data-i18n="home.scan_qr"></p>
        </div>

    </section>
    <!-- ⭐ FINE SEZIONE INSTALLA APP ⭐ -->

    <!-- BOTTONE CHAT -->
    <button class="chat-trigger-desktop" id="chat-trigger-desktop">
        💬 <span data-i18n="home.chat_desktop"></span>
    </button>

    <!-- CHAT DESKTOP (inizialmente nascosta) -->
    <div class="chat-desktop" id="chat-desktop">
        
        <div class="chat-header">
            <span data-i18n="chat.title"></span>
            <button id="close-chat" class="close-chat-btn">✕</button>
        </div>

        <div class="chat-messages">
            <div class="message" data-i18n="chat.msg1"></div>
            <div class="message" data-i18n="chat.msg2"></div>
        </div>

        <div class="chat-input-row">
            <input type="text" placeholder="" data-i18n-placeholder="chat.placeholder">
            <button class="mic-btn">🎤</button>
        </div>

    </div>

    <!-- SCRIPT APERTURA/CHIUSURA CHAT -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const castellana = document.querySelector(".castellana-video");
            const chat = document.getElementById("chat-desktop");
            const closeBtn = document.getElementById("close-chat");
            const chatTrigger = document.getElementById("chat-trigger-desktop");

            chatTrigger.addEventListener("click", () => {
                chat.classList.add("active");
            });

            castellana.addEventListener("click", () => {
                chat.classList.add("active");
            });

            closeBtn.addEventListener("click", () => {
                chat.classList.remove("active");
            });

        });
    </script>

    <!-- SCRIPT MULTILINGUA -->
    <script>
    let currentLang = localStorage.getItem("lang") || "it";

    function loadLanguage(lang) {
        fetch(`../lang/${lang}.json`)
            .then(res => res.json())
            .then(data => {

                // Testi normali
                document.querySelectorAll("[data-i18n]").forEach(el => {
                    const key = el.getAttribute("data-i18n");
                    const text = key.split('.').reduce((o,i)=>o[i], data);
                    if (text) el.innerHTML = text;
                });

                // Placeholder input chat
                document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
                    const key = el.getAttribute("data-i18n-placeholder");
                    const text = key.split('.').reduce((o,i)=>o[i], data);
                    if (text) el.placeholder = text;
                });

            });

        localStorage.setItem("lang", lang);
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".lang-switcher button").forEach(btn => {
            btn.addEventListener("click", () => {
                loadLanguage(btn.dataset.lang);
            });
        });

        loadLanguage(currentLang);
    });
    </script>

</body>
</html>
