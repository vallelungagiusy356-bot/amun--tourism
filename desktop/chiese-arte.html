<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024">
    <title>Amunì Tourism - Chiese e Arte</title>
    <link rel="stylesheet" href="css_style2_v2.css">
</head>
<body>

    <!-- 🖼️ SFONDO ORIGINALE -->
    <div class="scene-background"></div>

    <!-- 👑 DASHBOARD DESKTOP ORIGINALE INTEGRATA -->
    <header class="dashboard">
        <div class="logo-title" data-i18n="menu.title">Amunì Tourism</div>

        <nav class="nav-desktop">
            <a href="index.html" class="nav-item">Home</a>
            <a href="#" data-i18n="menu.about">Chi Siamo</a>
            <a href="cittadino.html" data-i18n="menu.citizen">Cittadino del Borgo</a>
        </nav>

        <!-- 🌍 SELETTORE LINGUA ORIGINALE -->
        <div class="lang-switcher">
            <button data-lang="it">🇮🇹</button>
            <button data-lang="en">🇬🇧</button>
            <button data-lang="fr">🇫🇷</button>
            <button data-lang="de">🇩🇪</button>
            <button data-lang="es">🇪🇸</button>
        </div>
    </header>

    <!-- 🔮 HUB CENTRALE RADIALE -->
    <div class="hub-container">
        <div class="interactive-center" id="hubCore">
            
            <!-- ⭐ VIDEO CASTELLANA ORIGINALE (CENTRO) -->
            <div class="castellana-video-wrapper" id="chat-open-btn">
                <div class="castellana-tooltip">Click to chat</div>
                <video class="castellana-video" id="castellanaHub" autoplay muted loop playsinline>
                    <source src="img/castellana_alpha.webm" type="video/webm">
                </video>
            </div>

            <!-- 🏛️ I 6 MONUMENTI SATELLITE (TRIPLICATI NELLE DIMENSIONI) -->
            <div class="monument-satellite item-castello" onclick="selectMonument('castello')">
                <video autoplay loop muted playsinline class="satellite-webm">
                    <source src="img/castello_2.webm" type="video/webm">
                </video>
                <span class="satellite-label">Castello</span>
            </div>

            <div class="monument-satellite item-cappuccini" onclick="selectMonument('cappuccini')">
                <video autoplay loop muted playsinline class="satellite-webm">
                    <source src="img/cappuccini_2.webm" type="video/webm">
                </video>
                <span class="satellite-label">I Cappuccini</span>
            </div>

            <div class="monument-satellite item-sangiorgio" onclick="selectMonument('sangiorgio')">
                <video autoplay loop muted playsinline class="satellite-webm">
                    <source src="img/san_giorgio_martire.webm" type="video/webm">
                </video>
                <span class="satellite-label">S. Giorgio Martire</span>
            </div>

            <div class="monument-satellite item-sandomenico" onclick="selectMonument('sandomenico')">
                <video autoplay loop muted playsinline class="satellite-webm">
                    <source src="img/san_domenico.webm" type="video/webm">
                </video>
                <span class="satellite-label">San Domenico</span>
            </div>

            <div class="monument-satellite item-annunziata" onclick="selectMonument('annunziata')">
                <video autoplay loop muted playsinline class="satellite-webm">
                    <source src="img/annunziata_2.webm" type="video/webm">
                </video>
                <span class="satellite-label">L'Annunziata</span>
            </div>

            <div class="monument-satellite item-badia" onclick="selectMonument('badia')">
                <video autoplay loop muted playsinline class="satellite-webm">
                    <source src="img/dettagli_badia.webm" type="video/webm">
                </video>
                <span class="satellite-label">Dettagli Badia</span>
            </div>

        </div>
    </div>

    <!-- 💬 CHAT DESKTOP STRUTTURATA SUL TUO STILE -->
    <div class="chat-desktop" id="chat-desktop">
        <div class="chat-header">
            <span id="chatTitle" data-i18n="chat.title">La Castellana</span>
            <button id="close-chat" class="close-chat-btn">✕</button>
        </div>

        <div class="chat-messages" id="chatBody">
            <!-- Il contenuto viene iniettato dinamicamente dai click -->
        </div>

        <div class="chat-input-row">
            <input type="text" placeholder="" data-i18n-placeholder="chat.placeholder">
            <button class="mic-btn">🎤</button>
        </div>
    </div>

    <!-- 🛠️ LOGICA INTERATTIVA -->
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const hubCore = document.getElementById("hubCore");
        const chat = document.getElementById("chat-desktop");
        const closeBtn = document.getElementById("close-chat");
        const openBtn = document.getElementById("chat-open-btn");
        const chatBody = document.getElementById("chatBody");
        const chatTitle = document.getElementById("chatTitle");

        const welcomeHTML = `
            <div class="message"><strong>La Castellana:</strong> Ciao viandante quale di queste meraviglie vuoi scoprire? accedi alla versione premium per saperne di più.</div>
            <div style="text-align:center; margin-top:15px;">
                <button class="unlock-premium-btn" style="background:linear-gradient(135deg, #ffd78f 0%, #b38f43 100%); border:none; color:#000; font-weight:700; padding:10px 20px; border-radius:8px; cursor:pointer;">Attiva Versione Premium</button>
            </div>
        `;

        openBtn.addEventListener("click", () => {
            hubCore.classList.add("exploded");
            chat.classList.add("active");
            chatTitle.innerText = "La Castellana";
            chatBody.innerHTML = welcomeHTML;
        });

        closeBtn.addEventListener("click", () => {
            chat.classList.remove("active");
            hubCore.classList.remove("exploded");
        });

        window.selectMonument = function(type) {
            let message = "";
            let btnText = "";
            
            switch(type) {
                case 'castello':
                    chatTitle.innerText = "Il Castello";
                    message = "Come vedi viandante il castello è proprio un gioiello da non lasciarsi scappare, ti va di saperne di più? accedi alla versione premium.";
                    btnText = "Sblocca Storia Castello";
                    break;
                case 'cappuccini':
                    chatTitle.innerText = "I Cappuccini";
                    message = "Il Convento dei Cappuccini custodisce una quiete antica e storie affascinanti. Accedi alla versione premium.";
                    btnText = "Sblocca Sezione Cappuccini";
                    break;
                case 'sangiorgio':
                    chatTitle.innerText = "San Giorgio Martire";
                    message = "La monumentale Chiesa di San Giorgio Martire è il cuore barocco della nostra identità. Accedi alla versione premium.";
                    btnText = "Sblocca San Giorgio";
                    break;
                case 'sandomenico':
                    chatTitle.innerText = "San Domenico";
                    message = "La Chiesa di San Domenico racchiude tesori d'arte unici e un fascino senza tempo. Accedi alla versione premium.";
                    btnText = "Sblocca San Domenico";
                    break;
                case 'annunziata':
                    chatTitle.innerText = "L'Annunziata";
                    message = "L'Annunziata accoglie storie di profonda devozione e bellezza. Accedi alla versione premium.";
                    btnText = "Sblocca L'Annunziata";
                    break;
                case 'badia':
                    chatTitle.innerText = "Dettagli Badia";
                    message = "I dettagli della Badia rivelano la maestria di antichi artigiani impressa nella pietra. Accedi alla versione premium.";
                    btnText = "Sblocca Dettagli Badia";
                    break;
            }

            chatBody.innerHTML = `
                <div class="message"><strong>La Castellana:</strong> ${message}</div>
                <div style="text-align:center; margin-top:15px;">
                    <button class="unlock-premium-btn" style="background:linear-gradient(135deg, #ffd78f 0%, #b38f43 100%); border:none; color:#000; font-weight:700; padding:10px 20px; border-radius:8px; cursor:pointer;">${btnText}</button>
                </div>
            `;
        };
    });
    </script>

    <!-- SCRIPT MULTILINGUA PRESERVATO -->
    <script>
    let currentLang = localStorage.getItem("lang") || "it";

    function loadLanguage(lang) {
        fetch(`../lang/${lang}.json`)
            .then(res => res.json())
            .then(data => {
                document.querySelectorAll("[data-i18n]").forEach(el => {
                    const key = el.getAttribute("data-i18n");
                    const text = key.split('.').reduce((o,i)=>o[i], data);
                    if (text) el.innerHTML = text;
                });
                document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
                    const key = el.getAttribute("data-i18n-placeholder");
                    const text = key.split('.').reduce((o,i)=>o[i], data);
                    if (text) el.placeholder = text;
                });
            });
        localStorage.setItem("lang", lang);
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".lang-switcher button").forEach(btn => {
            btn.addEventListener("click", () => {
                loadLanguage(btn.dataset.lang);
            });
        });
        loadLanguage(currentLang);
    });
    </script>
</body>
</html>
