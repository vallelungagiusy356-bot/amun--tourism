<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="castle.title">Le Chiese di Caccamo</title>
    <link rel="stylesheet" href="chiese-arte.css">
</head>
<body>

    <div class="scene-background-container">
        <video autoplay loop muted playsinline class="scene-background-video">
            <source src="img/video_cappuccini.webm" type="video/mp4">
        </video>
        <div class="scene-overlay"></div> 
    </div>

    <header class="dashboard">
        <div class="logo-title" data-i18n="menu.title">Amunì Tourism</div>
        <nav class="nav-desktop">
            <a href="index.html" class="nav-item">Home</a>
            <a href="about.html" class="nav-item" data-i18n="menu.about">About</a>
        </nav>
        <div class="header-right-actions">
            <button id="toggle-music" class="home-btn">🔈</button>
            <button class="home-btn" onclick="window.location.href='index.html'">Indietro</button>
        </div>
    </header>

    <button id="startButton" class="home-btn" style="opacity: 0; pointer-events: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2000; font-size: 1.5rem; padding: 20px 40px;">
        Inizia il Tour
    </button>

    <main class="monuments-grid" id="monumentsGrid">
        <section class="glass-card">
            <video autoplay muted loop playsinline class="card-video cappuccini-video">
                <source src="img/cappuccini_2.webm" type="video/webm">
            </video>
            <div class="card-content"><h3>I Cappuccini</h3></div>
        </section>

        <section class="glass-card">
            <video autoplay muted loop playsinline class="card-video annunziata-video">
                <source src="img/annunziata_2.webm" type="video/webm">
            </video>
            <div class="card-content"><h3>Annunziata</h3></div>
        </section>

        <section class="glass-card">
            <video autoplay muted loop playsinline class="card-video badia-video">
                <source src="img/dettagli_badia.webm" type="video/webm">
            </video>
            <div class="card-content"><h3>S. Benedetto della Badia</h3></div>
        </section>

        <section class="glass-card">
            <video autoplay muted loop playsinline class="card-video angeli-video">
                <source src="img/san_domenico.webm" type="video/webm">
            </video>
            <div class="card-content"><h3>Santa Maria degli Angeli</h3></div>
        </section>

        <section class="glass-card">
            <video autoplay muted loop playsinline class="card-video duomo-video">
                <source src="img/san_giorgio_martire.webm" type="video/webm">
            </video>
            <div class="card-content"><h3>Chiesa San Giorgio Martire</h3></div>
        </section>
    </main>

    <div class="castellana-video-wrapper">
        <video class="castellana-video" autoplay muted loop playsinline>
            <source src="img/castellana_alpha.webm" type="video/webm">
        </video>
        <div class="castellana-tooltip" id="chat-open-btn">Click to chat</div>
    </div>

    <div class="chat-desktop" id="chatDesktop">
        <div class="chat-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <div>
                <div class="avatar-status-dot" style="display: inline-block; width: 10px; height: 10px; background: #4caf50; border-radius: 50%; margin-right: 5px;"></div>
                <strong id="chatTitle" data-i18n="chat.title" style="color: #ffd78f;">La Castellana</strong>
            </div>
            <button class="close-chat-btn" id="closeChatBtn">✕</button>
        </div>
        
        <div class="chat-messages" id="chatMessagesBox">
            <div class="message system-msg">
                <strong>La Castellana:</strong> Benvenuto nel cuore della sacralità di Caccamo, forestiero. Vuoi che ti sveli i segreti di queste mura vive? Chiedimi pure.
            </div>
        </div>
        
        <div class="chat-input-row">
            <input type="text" placeholder="Scrivi alla Castellana..." id="chatInput" data-i18n-placeholder="chat.placeholder">
            <div class="input-actions">
                <button class="mic-btn" title="Attiva Microfono">🎤</button>
            </div>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="audio/more-epic-lorem-ipsum-by-ende-dot.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById("bg-music");
        const startBtn = document.getElementById('startButton');
        const grid = document.getElementById('monumentsGrid');
        const cards = document.querySelectorAll('.glass-card');
        const toggleBtn = document.getElementById("toggle-music");
        
        // Elementi Chat
        const chatBtn = document.getElementById('chat-open-btn');
        const chatBox = document.getElementById('chatDesktop');
        const closeChat = document.getElementById('closeChatBtn');
        const chatMessagesBox = document.getElementById('chatMessagesBox');

        // Mappatura delle storie raccontate dalla Castellana al click sulle card
        const storieMonumenti = {
            "I Cappuccini": "Benvenuto ai Cappuccini! Questo luogo racchiude storie secolari e un'atmosfera di profonda spiritualità. Guardando il modello, puoi notare la struttura originaria...",
            "Annunziata": "Ecco l'Annunziata, un gioiello architettonico che custodisce tracce indelebili del nostro passato. La sua facciata e i dettagli interni sono stati ricostruiti per mostrarti...",
            "S. Benedetto della Badia": "Ti trovi davanti a S. Benedetto della Badia. Questo complesso monastico ha attraversato i secoli. Osserva la finezza dei dettagli del render, che richiamano...",
            "Santa Maria degli Angeli": "Questa è la Chiesa di Santa Maria degli Angeli. Un luogo di culto straordinario, la cui pianta e le cui decorazioni raccontano l'arte e la devozione di un'intera epoca...",
            "Chiesa San Giorgio Martire": "Il Duomo di San Giorgio Martire! Il cuore pulsante della nostra comunità, maestoso e dominante. Nota come la luce d'oro del render esalta le linee della cupola e del campanile..."
        };

        // 1. Audio parte al primo click ovunque sulla pagina
        window.addEventListener('click', () => {
            if (audio.paused) audio.play();
        }, { once: true });

        // 2. Il bottone Inizia Tour appare dopo 5 secondi
        setTimeout(() => {
            startBtn.style.opacity = '1';
            startBtn.style.pointerEvents = 'auto';
        }, 5000); 

        // 3. Al click sul bottone, mostra la griglia e aggiorna l'invito della Castellana
        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startBtn.style.display = 'none';
            grid.classList.add('visible');
            
            // Cambia l'invito della Castellana non appena appare la griglia
            if (chatBtn) {
                chatBtn.textContent = "Clicca sulle mie card per esplorarle con me! ✨";
            }
            
            cards.forEach((card, i) => {
                setTimeout(() => card.classList.add('fade-in'), 200 * i);
            });
        });

        // 4. Toggle Audio (Icona)
        toggleBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (audio.paused) { 
                audio.play(); 
                toggleBtn.textContent = "🔈"; 
            } else { 
                audio.pause(); 
                toggleBtn.textContent = "🔇"; 
            }
        });

        // 5. Apertura e Chiusura Chat manuale
        chatBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            chatBox.classList.add('active');
        });

        closeChat.addEventListener('click', (e) => {
            e.stopPropagation();
            chatBox.classList.remove('active');
        });

        // 6. Logica del click sulle Card collegate alla Chat
        cards.forEach(card => {
            card.addEventListener('click', (e) => {
                e.stopPropagation();
                
                // Prende il titolo esatto contenuto nella card h3
                const titolo = card.querySelector('h3').textContent.trim();
                const storia = storieMonumenti[titolo];

                if (storia) {
                    // Apre la chat simulando il click dell'utente
                    chatBox.classList.add('active');

                    // Svuota i vecchi messaggi della Castellana per mostrare la descrizione fresca
                    chatMessagesBox.innerHTML = '';

                    // Crea e appende il nuovo messaggio
                    const nuovoMessaggio = document.createElement('div');
                    nuovoMessaggio.className = 'message';
                    nuovoMessaggio.innerHTML = `<strong>La Castellana:</strong> ${storia}`;
                    
                    chatMessagesBox.appendChild(nuovoMessaggio);
                    
                    // Forza lo scroll automatico verso il basso
                    chatMessagesBox.scrollTop = chatMessagesBox.scrollHeight;
                }
            });
        });
    </script>
</body>
</html>
