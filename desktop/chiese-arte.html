<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Amunì Tourism - Chiese e Arte</title>
    <link rel="stylesheet" href="chiese-arte.css">
</head>
<body>

    <div class="scene-background-container">
        <video autoplay loop muted playsinline class="scene-background-video">
            <source src="img/video_cappuccini.webm" type="video/webm">
        </video>
    </div>

    <header class="dashboard">
        <div class="logo-title">Amunì Tourism</div>
        <nav class="nav-desktop">
            <a href="index.html" class="nav-item">Home</a>
        </nav>
    </header>

    <main class="castle-layout">
        
        <section class="castle-info-panel">
            <h2>Arte e Chiese</h2>
            <div class="castle-text-content">
                <section class="glass-card">
                    <video autoplay muted loop playsinline class="card-video"><source src="img/cappuccini_2.webm" type="video/webm"></video>
                    <div class="card-content">
                        <h3>I Cappuccini</h3>
                        <p>Quiete e vista mozzafiato.</p>
                    </div>
                </section>
                <section class="glass-card">
                    <video autoplay muted loop playsinline class="card-video"><source src="img/san_giorgio_martire.webm" type="video/webm"></video>
                    <div class="card-content">
                        <h3>S. Giorgio</h3>
                        <p>Cuore del barocco locale.</p>
                    </div>
                </section>
            </div>
        </section>

        <section class="castle-interactive-zone">
            <div class="castellana-video-container">
                <div class="castellana-video-wrapper" id="chat-open-btn">
                    <div class="castellana-tooltip">Click to Chat</div>
                    <video id="castellanaVideo" class="castellana-video" autoplay loop muted playsinline>
                        <source src="img/benvenuto_castellana.webm" type="video/webm">
                    </video>
                </div>
            </div>
            <div class="chat-desktop" id="chatDesktop">...</div>
        </section>
    </main>
</body>
</html>
