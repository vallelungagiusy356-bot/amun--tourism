<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amunì Premium - Chiese e Arte</title>
    <link rel="stylesheet" href="chiese-arte.css">
</head>
<body>

    <div class="hub-bg-container">
        <img src="img/tuo_nuovo_sfondo.jpeg" alt="Sfondo Borgo" class="hub-bg-image">
        <div class="hub-overlay"></div>
    </div>

    <header class="premium-header">
        <div class="brand-title">Amunì Tourism</div>
        
        <nav class="nav-links-pc">
            <a href="index.html" class="nav-item">Home</a>
            <a href="chi-siamo.html" class="nav-item">Chi Siamo</a>
            <a href="cittadino-borgo.html" class="nav-item">Cittadino del Borgo</a>
        </nav>

        <div class="header-right-zone">
            <div class="lang-switcher-pc">
                <button class="lang-btn active">IT</button>
                <button class="lang-btn">EN</button>
            </div>
            <button class="exit-btn" onclick="window.location.href='index.html'">Indietro</button>
        </div>
    </header>

    <div class="hub-container">
        <div class="interactive-center" id="hubCore">
            
            <div class="avatar-center-wrapper">
                <div class="hub-tooltip">Scopri le Meraviglie</div>
                <video id="castellanaHub" autoplay loop muted playsinline webkit-playsinline class="castellana-hub-video">
                    <source src="img/benvenuto_castellana.webm" type="video/webm">
                </video>
            </div>

            <div class="monument-satellite item-castello" onclick="selectMonument('castello')">
                <video autoplay loop muted playsinline webkit-playsinline class="satellite-webm">
                    <source src="img/castello_2.webm" type="video/webm">
                </video>
                <span class="satellite-label">Castello</span>
            </div>

            <div class="monument-satellite item-cappuccini" onclick="selectMonument('cappuccini')">
                <video autoplay loop muted playsinline webkit-playsinline class="satellite-webm">
                    <source src="img/cappuccini_2.webm" type="video/webm">
                </video>
                <span class="satellite-label">I Cappuccini</span>
            </div>

            <div class="monument-satellite item-sangiorgio" onclick="selectMonument('sangiorgio')">
                <video autoplay loop muted playsinline webkit-playsinline class="satellite-webm">
                    <source src="img/san_giorgio_martire.webm" type="video/webm">
                </video>
                <span class="satellite-label">S. Giorgio Martire</span>
            </div>

            <div class="monument-satellite item-sandomenico" onclick="selectMonument('sandomenico')">
                <video autoplay loop muted playsinline webkit-playsinline class="satellite-webm">
                    <source src="img/san_domenico.webm" type="video/webm">
                </video>
                <span class="satellite-label">San Domenico</span>
            </div>

            <div class="monument-satellite item-annunziata" onclick="selectMonument('annunziata')">
                <video autoplay loop muted playsinline webkit-playsinline class="satellite-webm">
                    <source src="img/annunziata_2.webm" type="video/webm">
                </video>
                <span class="satellite-label">L'Annunziata</span>
            </div>

            <div class="monument-satellite item-badia" onclick="selectMonument('badia')">
                <video autoplay loop muted playsinline webkit-playsinline class="satellite-webm">
                    <source src="img/dettagli_badia.webm" type="video/webm">
                </video>
                <span class="satellite-label">Dettagli Badia</span>
            </div>

        </div>
    </div>

    <div class="hub-chat-box" id="hubChat">
        <div class="chat-header">
            <span id="chatTitle">La Castellana</span>
            <button class="close-chat-btn" id="closeHubChat">×</button>
        </div>
        
        <div class="chat-body" id="chatBody"></div>
        <div class="chat-footer" id="chatFooter"></div>
    </div>

    <script>
        const hubCore = document.getElementById("hubCore");
        const staticBackground = document.querySelector(".hub-bg-image");
        const castellanaHub = document.getElementById("castellanaHub");
        const hubChat = document.getElementById("hubChat");
        const closeHubChat = document.getElementById("closeHubChat");
        const chatBody = document.getElementById("chatBody");
        const chatTitle = document.getElementById("chatTitle");

        const welcomeHubHTML = `
            <div class="chat-bubble guide">
                <p><strong>La Castellana:</strong> Ciao viandante quale di queste meraviglie vuoi scoprire? accedi alla versione premium per saperne di più.</p>
            </div>
            <div class="premium-lock-action">
                <button class="unlock-premium-btn">Attiva Versione Premium</button>
            </div>
        `;

        // Al click sulla castellana: "esplosione" e apertura chat
        castellanaHub.addEventListener("click", () => {
            hubCore.classList.add("exploded");
            hubChat.classList.add("open");
            chatTitle.innerText = "La Castellana";
            chatBody.innerHTML = welcomeHubHTML;
        });

        function selectMonument(type) {
            let message = "";
            let buttonText = "";
            
            switch(type) {
                case 'castello':
                    chatTitle.innerText = "Il Castello";
                    message = "Come vedi viandante il castello è proprio un gioiello da non lasciarsi skappare,ti va di saperne di più?accedi alla versione premium";
                    buttonText = "Sblocca Storia Castello";
                    break;
                case 'cappuccini':
                    chatTitle.innerText = "I Cappuccini";
                    message = "Il Convento dei Cappuccini custodisce una quiete antica e storie affascinanti. Ti va di saperne di più? Accedi alla versione premium.";
                    buttonText = "Sblocca Sezione Cappuccini";
                    break;
                case 'sangiorgio':
                    chatTitle.innerText = "San Giorgio Martire";
                    message = "La monumentale Chiesa di San Giorgio Martire è il cuore barocco della nostra identità. Ti va di scoprirne i segreti? Accedi alla versione premium.";
                    buttonText = "Sblocca San Giorgio";
                    break;
                case 'sandomenico':
                    chatTitle.innerText = "San Domenico";
                    message = "La Chiesa di San Domenico racchiude tesori d'arte unici e un fascino senza tempo. Vuoi approfondire? Accedi alla versione premium.";
                    buttonText = "Sblocca San Domenico";
                    break;
                case 'annunziata':
                    chatTitle.innerText = "L'Annunziata";
                    message = "L'Annunziata, con la sua magnifica struttura, accoglie storie di profonda devozione e bellezza. Ti va di saperne di più? Accedi alla versione premium.";
                    buttonText = "Sblocca L'Annunziata";
                    break;
                case 'badia':
                    chatTitle.innerText = "Dettagli Badia";
                    message = "I dettagli della Badia rivelano la maestria di antichi artigiani impressa nella pietra. Vuoi svelare la loro storia? Accedi alla versione premium.";
                    buttonText = "Sblocca Dettagli Badia";
                    break;
            }

            chatBody.innerHTML = `
                <div class="chat-bubble guide">
                    <p><strong>La Castellana:</strong> ${message}</p>
                </div>
                <div class="premium-lock-action">
                    <button class="unlock-premium-btn">${buttonText}</button>
                </div>
            `;
        }

        closeHubChat.addEventListener("click", () => {
            hubChat.classList.remove("open");
            hubCore.classList.remove("exploded");
        });
    </script>
</body>
</html>
