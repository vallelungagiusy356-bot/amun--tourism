<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Amunì Tourism - Chiese e Arte</title>
    <link rel="stylesheet" href="chiese-arte.css">
</head>
<body>

    <div class="scene-background-container">
        <video autoplay loop muted playsinline class="scene-background-video">
            <source src="img/video_cappuccini.webm" type="video/webm">
        </video>
    </div>

    <header class="dashboard">
        <div class="logo-title" data-i18n="menu.title">Amunì Tourism</div>
        
        <nav class="nav-desktop">
            <a href="index.html" class="nav-item">Home</a>
            <a href="about.html" class="nav-item" data-i18n="menu.about">About</a>
            <a href="contact.html" class="nav-item" data-i18n="menu.contact">Contact</a>
        </nav>
        
        <div class="header-right-actions">
            <div class="lang-switcher">
                <button data-lang="it" class="active">🇮🇹</button>
                <button data-lang="en">🇬🇧</button>
                <button data-lang="fr">🇫🇷</button>
                <button data-lang="de">🇩🇪</button>
                <button data-lang="es">🇪🇸</button>
            </div>
            <button class="home-btn" onclick="window.location.href='index.html'">Indietro</button>
        </div>
    </header>

    <main class="monuments-grid">
        <section class="glass-card">
            <video autoplay muted loop playsinline class="card-video"><source src="img/cappuccini_2.webm" type="video/webm"></video>
            <div class="card-content"><h3>I Cappuccini</h3><p>Quiete e vista mozzafiato.</p></div>
        </section>
        <section class="glass-card">
            <video autoplay muted loop playsinline class="card-video"><source src="img/san_giorgio_martire.webm" type="video/webm"></video>
            <div class="card-content"><h3>S. Giorgio</h3><p>Cuore del barocco locale.</p></div>
        </section>
        <section class="glass-card">
            <video autoplay muted loop playsinline class="card-video"><source src="img/badia.webm" type="video/webm"></video>
            <div class="card-content"><h3>Badia</h3><p>Storia e spiritualità.</p></div>
        </section>
        <section class="glass-card">
            <video autoplay muted loop playsinline class="card-video"><source src="img/annunziata.webm" type="video/webm"></video>
            <div class="card-content"><h3>Annunziata</h3><p>Dettagli artistici.</p></div>
        </section>
        <section class="glass-card">
            <video autoplay muted loop playsinline class="card-video"><source src="img/santa_maria_angeli.webm" type="video/webm"></video>
            <div class="card-content"><h3>S. Maria Angeli</h3><p>Luogo senza tempo.</p></div>
        </section>
    </main>

    <section class="castellana-video-wrapper">
        <div class="castellana-tooltip" id="chat-open-btn">Click to chat</div>
        <video class="castellana-video" autoplay muted loop playsinline>
            <source src="img/castellana_alpha.webm" type="video/webm">
        </video>
        <div class="chat-desktop" id="chatDesktop">...</div>
    </section>

</body>
</html>
