<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="monuments.title_page">Le Chiese di Caccamo</title>
    <link rel="stylesheet" href="chiese-arte.css">
</head>
<body>

    <div class="scene-background-container">
        <video autoplay loop muted playsinline class="scene-background-video">
            <source src="img/video_cappuccini.webm" type="video/mp4">
        </video>
        <div class="scene-overlay"></div> 
    </div>

    <header class="dashboard">
        <div class="logo-title" data-i18n="menu.title">Amunì Tourism</div>
        <nav class="nav-desktop">
            <a href="index.html" class="nav-item">Home</a>
            <a href="about.html" class="nav-item" data-i18n="menu.about">About</a>
        </nav>
        <div class="header-right-actions">
            <button id="toggle-music" class="home-btn">🔈</button>
            <button class="home-btn" onclick="window.location.href='index.html'">Indietro</button>
        </div>
    </header>

    <button id="startButton" class="home-btn" data-i18n="monuments.start_tour" style="opacity: 0; pointer-events: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2000; font-size: 1.5rem; padding: 20px 40px;">
        Inizia il Tour
    </button>

    <main class="monuments-grid" id="monumentsGrid">
        <section class="glass-card" data-monument="cappuccini">
            <video autoplay muted loop playsinline class="card-video cappuccini-video">
                <source src="img/cappuccini_2.webm" type="video/webm">
            </video>
            <div class="card-content"><h3 data-i18n="monuments.cappuccini_name">I Cappuccini</h3></div>
        </section>

        <section class="glass-card" data-monument="annunziata">
            <video autoplay muted loop playsinline class="card-video annunziata-video">
                <source src="img/annunziata_2.webm" type="video/webm">
            </video>
            <div class="card-content"><h3 data-i18n="monuments.annunziata_name">Annunziata</h3></div>
        </section>

        <section class="glass-card" data-monument="badia">
            <video autoplay muted loop playsinline class="card-video badia-video">
                <source src="img/dettagli_badia.webm" type="video/webm">
            </video>
            <div class="card-content"><h3 data-i18n="monuments.badia_name">S. Benedetto della Badia</h3></div>
        </section>

        <section class="glass-card" data-monument="angeli">
            <video autoplay muted loop playsinline class="card-video angeli-video">
                <source src="img/san_domenico.webm" type="video/webm">
            </video>
            <div class="card-content"><h3 data-i18n="monuments.angeli_name">Santa Maria degli Angeli</h3></div>
        </section>

        <section class="glass-card" data-monument="duomo">
            <video autoplay muted loop playsinline class="card-video duomo-video">
                <source src="img/san_giorgio_martire.webm" type="video/webm">
            </video>
            <div class="card-content"><h3 data-i18n="monuments.duomo_name">Chiesa San Giorgio Martire</h3></div>
        </section>
    </main>

    <div class="castellana-video-wrapper">
        <video class="castellana-video" autoplay muted loop playsinline>
            <source src="img/castellana_alpha.webm" type="video/webm">
        </video>
        <div class="castellana-tooltip" id="chat-open-btn" data-i18n="monuments.chat_tooltip">Click to chat</div>
    </div>

    <div class="chat-desktop" id="chatDesktop">
        <div class="chat-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <div>
                <div class="avatar-status-dot" style="display: inline-block; width: 10px; height: 10px; background: #4caf50; border-radius: 50%; margin-right: 5px;"></div>
                <strong id="chatTitle" data-i18n="chat.title" style="color: #ffd78f;">La Castellana</strong>
            </div>
            <button class="close-chat-btn" id="closeChatBtn">✕</button>
        </div>
        
        <div class="chat-messages" id="chatMessagesBox">
            <!-- Testo inizialmente svuotato per favorire la corretta iniezione multilingua -->
            <div class="message system-msg" data-i18n="monuments.welcomemsg_churches"></div>
        </div>
        
        <div class="chat-input-row">
            <input type="text" placeholder="Scrivi alla Castellana..." id="chatInput" data-i18n-placeholder="chat.placeholder">
            <div class="input-actions">
                <button class="mic-btn" title="Attiva Microfono">🎤</button>
            </div>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="audio/more-epic-lorem-ipsum-by-ende-dot.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById("bg-music");
        const startBtn = document.getElementById('startButton');
        const grid = document.getElementById('monumentsGrid');
        const cards = document.querySelectorAll('.glass-card');
        const toggleBtn = document.getElementById("toggle-music");
        
        const chatBtn = document.getElementById('chat-open-btn');
        const chatBox = document.getElementById('chatDesktop');
        const closeChat = document.getElementById('closeChatBtn');
        const chatMessagesBox = document.getElementById('chatMessagesBox');

        let currentLang = localStorage.getItem("lang") || "it";
        let langData = {};

        function loadLanguage(lang) {
            return fetch(`../lang/${lang}.json`)
                .then(res => res.json())
                .then(data => {
                    langData = data;
                    document.querySelectorAll("[data-i18n]").forEach(el => {
                        const key = el.getAttribute("data-i18n");
                        const text = key.split('.').reduce((o,i) => o ? o[i] : null, data);
                        if (text) el.innerHTML = text;
                    });
                    document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
                        const key = el.getAttribute("data-i18n-placeholder");
                        const text = key.split('.').reduce((o,i) => o ? o[i] : null, data);
                        if (text) el.placeholder = text;
                    });
                    
                    if (grid.classList.contains('visible') && data.monuments?.chat_hint) {
                        chatBtn.textContent = data.monuments.chat_hint;
                    }
                });
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadLanguage(currentLang);
        });

        window.addEventListener('click', () => {
            if (audio.paused) audio.play();
        }, { once: true });

        setTimeout(() => {
            startBtn.style.opacity = '1';
            startBtn.style.pointerEvents = 'auto';
        }, 5000); 

        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startBtn.style.display = 'none';
            grid.classList.add('visible');
            
            if (chatBtn && langData.monuments?.chat_hint) {
                chatBtn.textContent = langData.monuments.chat_hint;
            }
            
            cards.forEach((card, i) => {
                setTimeout(() => card.classList.add('fade-in'), 200 * i);
            });
        });

        toggleBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (audio.paused) { 
                audio.play(); 
                toggleBtn.textContent = "🔈"; 
            } else { 
                audio.pause(); 
                toggleBtn.textContent = "🔇"; 
            }
        });

        chatBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            chatBox.classList.add('active');
        });

        closeChat.addEventListener('click', (e) => {
            e.stopPropagation();
            chatBox.classList.remove('active');
        });

        // Corretto selettore per puntare alla struttura piatta del JSON
        cards.forEach(card => {
            card.addEventListener('click', (e) => {
                e.stopPropagation();
                const idMonumento = card.getAttribute('data-monument');
                const storia = langData.monuments?.[idMonumento];

                if (storia) {
                    chatBox.classList.add('active');
                    chatMessagesBox.innerHTML = '';

                    const nuovoMessaggio = document.createElement('div');
                    nuovoMessaggio.className = 'message';
                    nuovoMessaggio.innerHTML = `<strong>${langData.chat?.title || 'La Castellana'}:</strong> ${storia}`;
                    
                    chatMessagesBox.appendChild(nuovoMessaggio);
                    chatMessagesBox.scrollTop = chatMessagesBox.scrollHeight;
                }
            });
        });
    </script>
</body>
</html>
