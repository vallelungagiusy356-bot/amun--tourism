<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Le Chiese di Caccamo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- SFONDO VIDEO -->
  <video class="bg-video" src="immagini/video_cappuccini.webm"
         autoplay muted loop playsinline></video>

  <div class="overlay"></div>

  <!-- HEADER -->
  <header class="top-bar">
    <div class="logo">Amuní Tourism</div>
    <nav class="nav">
      <a href="#">Home</a>
      <a href="#">About</a>
      <button class="btn-back">
        <span>Indietro</span>
        🔊
      </button>
    </nav>
  </header>

  <!-- HERO CENTRALE -->
  <main class="hero">
    <div class="hero-text">
      <h1>Le Chiese di Caccamo</h1>
      <p>Scopri le meravigliose chiese di Caccamo</p>
      <button class="btn-primary">Inizia il Tour</button>
    </div>

    <!-- CARD MONUMENTI -->
    <section class="cards">
      <article class="card">
        <video src="immagini/cappuccini_2.webm" autoplay muted loop playsinline></video>
        <h3>I Cappuccini</h3>
      </article>

      <article class="card">
        <video src="immagini/annunziata_2.webm" autoplay muted loop playsinline></video>
        <h3>Annunziata</h3>
      </article>

      <article class="card">
        <video src="immagini/dettagli_badia.webm" autoplay muted loop playsinline></video>
        <h3>S. Benedetto della Badia</h3>
      </article>

      <article class="card">
        <video src="immagini/san_domenico.webm" autoplay muted loop playsinline></video>
        <h3>San Domenico</h3>
      </article>

      <article class="card">
        <video src="immagini/san_giorgio_martire.webm" autoplay muted loop playsinline></video>
        <h3>San Giorgio Martire</h3>
      </article>
    </section>
  </main>

  <!-- CHAT CASTELLANA -->
  <section class="castellana-widget">
    <div class="castellana-header">
      <video class="avatar" src="immagini/benvenuto_castellana.webm"
             autoplay muted loop playsinline></video>
      <span>La Castellana</span>
    </div>
    <div class="castellana-body">
      <p>Benvenuti! Posso aiutarvi a scoprire le bellezze delle chiese di Caccamo?</p>
    </div>
    <div class="castellana-input">
      <input type="text" placeholder="Scrivi alla Castellana">
      <button>Invia</button>
    </div>
  </section>

  <button class="castellana-fab">Click to chat</button>

  <script src="script.js"></script>
</body>
</html>
