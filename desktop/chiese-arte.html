<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Chiese di Caccamo</title>
    <link rel="stylesheet" href="chiese-arte.css">
</head>
<body>

    <div id="start-overlay" class="start-overlay">
        <div class="start-content">
            <h1>Benvenuti a Caccamo</h1>
            <button id="startButton" class="home-btn">Inizia il Tour</button>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="audio/more-epic-lorem-ipsum-by-ende-dot.mp3" type="audio/mpeg">
    </audio>

    <div class="scene-background-container">
        <video autoplay loop muted playsinline class="scene-background-video">
            <source src="img/video_cappuccini.webm" type="video/mp4">
        </video>
    </div>

    <header class="dashboard">
        <div class="logo-title">Amunì Tourism</div>
        <nav class="nav-desktop">
            <a href="index.html" class="nav-item">Home</a>
        </nav>
        <div class="header-right-actions">
            <button id="toggle-music" class="home-btn">🔈</button>
            <button class="home-btn" onclick="window.location.href='index.html'">Indietro</button>
        </div>
    </header>

    <main class="monuments-grid" id="monumentsGrid">
        <section class="glass-card"><video autoplay muted loop playsinline class="card-video"><source src="img/cappuccini_2.webm" type="video/webm"></video><div class="card-content"><h3>I Cappuccini</h3></div></section>
        <section class="glass-card"><video autoplay muted loop playsinline class="card-video"><source src="img/annunziata.webm" type="video/webm"></video><div class="card-content"><h3>Annunziata</h3></div></section>
        <section class="glass-card"><video autoplay muted loop playsinline class="card-video"><source src="img/san_giorgio_martire.webm" type="video/webm"></video><div class="card-content"><h3>S. Giorgio</h3></div></section>
        <section class="glass-card"><video autoplay muted loop playsinline class="card-video"><source src="img/san_domenico.webm" type="video/webm"></video><div class="card-content"><h3>San Domenico</h3></div></section>
        <section class="glass-card"><video autoplay muted loop playsinline class="card-video"><source src="img/duomo.webm" type="video/webm"></video><div class="card-content"><h3>Duomo</h3></div></section>
    </main>

    <script>
        const audio = document.getElementById("bg-music");
        const startBtn = document.getElementById('startButton');
        const overlay = document.getElementById('start-overlay');
        const grid = document.getElementById('monumentsGrid');
        const cards = document.querySelectorAll('.glass-card');
        const toggleBtn = document.getElementById("toggle-music");

        // Avvio Tour
        startBtn.addEventListener('click', () => {
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 1000);
            audio.play();
            grid.classList.add('visible');
            cards.forEach((card, i) => {
                setTimeout(() => card.classList.add('fade-in'), 500 + (i * 200));
            });
        });

        // Toggle Audio
        toggleBtn.addEventListener("click", () => {
            if (audio.paused) { audio.play(); toggleBtn.textContent = "🔈"; }
            else { audio.pause(); toggleBtn.textContent = "🔇"; }
        });
    </script>
</body>
</html>
