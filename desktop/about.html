<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Amunì Tourism</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="desktop/pages.css">
</head>
<body>

    <!-- Navigazione (identica alle altre pagine per coerenza) -->
    <header class="dashboard">
        <a href="index.html">Torna alla Home</a>
    </header>

    <main class="content-wrapper">
    <h1 data-i18n="pages.about.title"></h1>
    <p data-i18n="pages.about.mission"></p>
    <p data-i18n="pages.about.service_details"></p>
    <p class="highlight-gold" data-i18n="pages.about.insider_value"></p>
</main>


    <script>
        // Caricamento lingua (lo stesso script usato nel castello)
        const lang = localStorage.getItem("lang") || "it";
        fetch(`./lang/${lang}.json`)
            .then(res => res.json())
            .then(data => {
                document.querySelectorAll("[data-i18n]").forEach(el => {
                    const key = el.getAttribute("data-i18n");
                    const text = key.split('.').reduce((o,i) => o ? o[i] : null, data);
                    if (text) el.innerHTML = text;
                });
            });
    </script>
</body>
</html>
