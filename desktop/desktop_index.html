<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amunì Tourism</title>
    <link rel="stylesheet" href="css_style2_v2.css">
</head>

<body>

    <div class="scene-background"></div>

    <header class="dashboard">
        <div class="logo-title" data-i18n="menu.title"></div>

        <nav class="nav-desktop">
            <a href="cittadino.html" data-i18n="menu.citizen"></a>
            <a href="#" data-i18n="menu.about"></a>
            <a href="#" data-i18n="menu.contact"></a>
        </nav>

        <div class="lang-switcher">
            <button data-lang="it">🇮🇹</button>
            <button data-lang="en">🇬🇧</button>
            <button data-lang="fr">🇫🇷</button>
            <button data-lang="de">🇩🇪</button>
            <button data-lang="es">🇪🇸</button>
        </div>
    </header>

    <div id="castellana-3d"></div>

    <div class="castellana-video-wrapper">
        <video class="castellana-video" autoplay muted loop playsinline>
            <source src="img/castellana_alpha.webm" type="video/webm">
        </video>
        <div class="castellana-tooltip" id="chat-open-btn">Click to chat</div>
    </div>

    <section class="home-welcome-poetry">
        <h1 data-i18n="home.amuni_title"></h1>
        <p data-i18n="home.amuni_text"></p>
        <p style="margin-top: 15px; font-weight: bold;">Lasciati guidare oltre le soglie del tempo...</p>
    </section>

    <section class="castellana-intro-card">
        <div class="intro-card-content">
            <h3 data-i18n="home.castellana_intro_title">Vivi la Caccamo più autentica</h3>
            <p data-i18n="home.castellana_intro_text">
                Parla con la <strong>Castellana</strong>: la tua guida turistica multilingue per scoprire storie, chicche inedite e percorsi del gusto.
            </p>
            <div class="languages-badge">
                <span>IT</span> • <span>EN</span> • <span>FR</span> • <span>DE</span> • <span>ES</span>
            </div>
        </div>
    </section>

    <section class="install-section">
        <div class="install-left">
            <h2 data-i18n="home.install_app"></h2>
            <a href="https://raw.githubusercontent.com/vallelungagiusy356-bot/amun--tourism/main/app-release-signed.apk" class="btn-desktop">
                📲 <span data-i18n="home.download_apk"></span>
            </a>
            <a href="https://vallelungagiusy356-bot.github.io/amun--tourism/mobile/" class="btn-desktop">
                🌐 <span data-i18n="home.open_webapp"></span>
            </a>
        </div>
        <div class="install-right">
            <img src="https://vallelungagiusy356-bot.github.io/amun--tourism/qr.png" alt="QR Amunì Tourism" class="qr-desktop">
            <p data-i18n="home.scan_qr"></p>
        </div>
    </section>

    <div class="chat-interface" id="chat-box">
        <div class="chat-header">
            <span data-i18n="chat.title"></span>
            <button id="close-chat" class="close-chat-btn" style="background: transparent; border: none; color: #ffd78f; cursor: pointer; font-size: 1.1rem;">✕</button>
        </div>
        <div class="chat-messages">
            <div class="message" data-i18n="chat.msg1"></div>
            <div class="message" data-i18n="chat.msg2"></div>
        </div>
        <div class="chat-input-row">
            <input type="text" placeholder="" data-i18n-placeholder="chat.placeholder">
            <button class="mic-btn">🎤</button>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const chat = document.getElementById("chat-box"); // Aggiornato ID
        const closeBtn = document.getElementById("close-chat");
        const openBtn = document.getElementById("chat-open-btn");

        openBtn.addEventListener("click", () => {
            chat.classList.add("active");
        });

        closeBtn.addEventListener("click", () => {
            chat.classList.remove("active");
        });
    });
    </script>

    <script>
    /* ... Il tuo script per la lingua resta invariato ... */
    let currentLang = localStorage.getItem("lang") || "it";
    function loadLanguage(lang) {
        fetch(`../lang/${lang}.json`)
            .then(res => res.json())
            .then(data => {
                document.querySelectorAll("[data-i18n]").forEach(el => {
                    const key = el.getAttribute("data-i18n");
                    const text = key.split('.').reduce((o,i)=>o[i], data);
                    if (text) el.innerHTML = text;
                });
                document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
                    const key = el.getAttribute("data-i18n-placeholder");
                    const text = key.split('.').reduce((o,i)=>o[i], data);
                    if (text) el.placeholder = text;
                });
            });
        localStorage.setItem("lang", lang);
    }
    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".lang-switcher button").forEach(btn => {
            btn.addEventListener("click", () => loadLanguage(btn.dataset.lang));
        });
        loadLanguage(currentLang);
    });
    </script>
</body>
</html>
