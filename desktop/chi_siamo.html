<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Siamo | Amunì Tourism</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pages.css">
</head>
<body>

    <div class="page-background"></div>

    <header class="dashboard">
        <div class="logo-title" data-i18n="menu.title">Amunì Tourism</div>

        <div class="nav-right-group">
            <nav class="nav-desktop">
                <a href="desktop_index.html" data-i18n="menu.home">Home</a>
                <a href="cittadino.html" data-i18n="menu.citizen">Cittadino</a>
            </nav>

            <div class="lang-switcher">
                <button data-lang="it">IT</button>
                <button data-lang="en">EN</button>
                <button data-lang="fr">FR</button>
                <button data-lang="es">ES</button>
                <button data-lang="de">DE</button>
            </div>
        </div>
    </header>

    <main class="content-wrapper">
        <h1 data-i18n="pages.chi_siamo.title"></h1>
        <hr class="gold-divider">
        <p data-i18n="pages.chi_siamo.founder_bio"></p>
        <p data-i18n="pages.chi_siamo.philosophy"></p>
        <p data-i18n="pages.chi_siamo.voices"></p>
    </main>

    <script>
        const lang = localStorage.getItem("lang") || "it";
        fetch(`./lang/${lang}.json`)
            .then(res => res.json())
            .then(data => {
                document.querySelectorAll("[data-i18n]").forEach(el => {
                    const key = el.getAttribute("data-i18n");
                    const text = key.split('.').reduce((o,i) => o ? o[i] : null, data);
                    if (text) el.innerHTML = text;
                });
            });
    </script>
</body>
</html>
