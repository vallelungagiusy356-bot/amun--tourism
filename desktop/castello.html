<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024">
    <title data-i18n="castle.title"></title>

    <!-- CSS PRINCIPALE -->
    <link rel="stylesheet" href="castello.css">
</head>

<body>

    <!-- DASHBOARD DESKTOP (IDENTICA ALLA HOME, MA SENZA “Cittadino del Borgo”) -->
    <header class="dashboard">

        <!-- TITOLO / LOGO -->
        <div class="logo-title" data-i18n="menu.title"></div>

        <!-- MENU DESKTOP -->
        <nav class="nav-desktop">
            <a href="about.html" data-i18n="menu.about"></a>
            <a href="contact.html" data-i18n="menu.contact"></a>
        </nav>

        <!-- SELETTORE LINGUE -->
        <div class="lang-switcher">
            <button data-lang="it">🇮🇹</button>
            <button data-lang="en">🇬🇧</button>
            <button data-lang="fr">🇫🇷</button>
            <button data-lang="de">🇩🇪</button>
            <button data-lang="es">🇪🇸</button>
        </div>

        <!-- SOLO QUI: PULSANTE HOME -->
        <button class="home-btn" onclick="window.location.href='index.html'">Home</button>

    </header>

    <!-- SEZIONE CASTELLO CINEMATOGRAFICA -->
    <section class="castle-layout">

        <!-- CASTELLO GRANDE IN ALTO -->
        <div class="castle-top">
            <img src="img/castello-cleaning-trasparente.png"
                 alt="Castello di Caccamo"
                 class="castle-main">
        </div>

        <!-- PANNELLO VETRO + TESTO + ABITO -->
        <div class="castle-panel">

            <div class="castle-text">
                <h2 data-i18n="castle.title"></h2>
                <ul>
                    <li data-i18n="castle.position"></li>
                    <li data-i18n="castle.defense"></li>
                    <li data-i18n="castle.conspiracy"></li>
                    <li data-i18n="castle.prisons"></li>
                    <li data-i18n="castle.legend_brothers"></li>
                </ul>
            </div>

            <div class="castle-dress">
                <img src="img/abito_clean.png"
                     alt="Abito d’epoca della Castellana">
            </div>

        </div>

        <!-- PULSANTE CASTELLANA -->
        <div class="castellana-button-container">
            <button id="castellanaButton">Parla con la Castellana</button>
        </div>

        <!-- CHAT PANEL -->
        <div class="chat-panel">
            <!-- qui va la tua chat -->
        </div>

        <!-- VIDEO DI BENVENUTO -->
        <video id="castellanaVideo" class="castellana-video" style="display:none;">
            <source src="img/benvenuto_castellana.webm" type="video/webm">
        </video>

    </section>

    <!-- SCRIPT MULTILINGUA -->
    <script>
    let currentLang = localStorage.getItem("lang") || "it";

    function loadLanguage(lang) {
         fetch(`../lang/${lang}.json`)
            .then(res => res.json())
            .then(data => {
                document.querySelectorAll("[data-i18n]").forEach(el => {
                    const key = el.getAttribute("data-i18n");
                    const text = key.split('.').reduce((o,i)=>o[i], data);
                    if (text) el.innerHTML = text;
                });
            });

        localStorage.setItem("lang", lang);
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".lang-switcher button").forEach(btn => {
            btn.addEventListener("click", () => {
                loadLanguage(btn.dataset.lang);
            });
        });

        loadLanguage(currentLang);
    });
    </script>

    <!-- SCRIPT CASTELLANA -->
    <script>
    document.getElementById("castellanaButton").addEventListener("click", () => {
        const video = document.getElementById("castellanaVideo");
        video.style.display = "block";
        video.play();

        video.onended = () => {
            video.style.display = "none";
            document.querySelector(".chat-panel")?.classList.add("visible");
        };
    });
    </script>

</body>
</html>
