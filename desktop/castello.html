<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024">
    <title data-i18n="castle.title"></title>

    <!-- CSS PRINCIPALE -->
    <link rel="stylesheet" href="cittadino.css">
</head>

<body>

    <!-- SEZIONE CASTELLO DI CACCAMO -->
    <section id="castello-caccamo" class="castle-section">

        <div class="castle-hero">

            <!-- IMMAGINE CASTELLO + FUTURO 3D -->
            <div class="castle-visual">
                <img src="img/castello-clean.png"
                     alt="Castello di Caccamo" class="castle-base">

                <!-- CANVAS PER MODELLO 3D -->
                <canvas id="castle-3d"></canvas>
            </div>

            <!-- TESTO STORICO -->
            <div class="castle-text-panel">
                <h2 data-i18n="castle.title"></h2>
                <p data-i18n="castle.history"></p>
                <p data-i18n="castle.position"></p>
                <p data-i18n="castle.defense"></p>
                <p data-i18n="castle.conspiracy"></p>
                <p data-i18n="castle.prisons"></p>
                <p data-i18n="castle.legend_brothers"></p>
                <p data-i18n="castle.tunnel"></p>
            </div>

        </div>

        <!-- BLOCCO VESTITO D’EPOCA -->
        <div class="castle-dress-block">

            <div class="dress-image">
                <img src="img/abito_clean.png"
                     alt="Abito d’epoca della Castellana">
            </div>

            <div class="dress-text-panel">
                <h3 data-i18n="castle.dress_title"></h3>
                <p data-i18n="castle.dress_text"></p>
            </div>

        </div>

    </section>

    <!-- SCRIPT MULTILINGUA -->
    <script>
    let currentLang = localStorage.getItem("lang") || "it";

    function loadLanguage(lang) {
        fetch(`../lang/${lang}.json`)
            .then(res => res.json())
            .then(data => {
                document.querySelectorAll("[data-i18n]").forEach(el => {
                    const key = el.getAttribute("data-i18n");
                    const text = key.split('.').reduce((o,i)=>o[i], data);
                    if (text) el.innerHTML = text;
                });
            });

        localStorage.setItem("lang", lang);
    }

    document.addEventListener("DOMContentLoaded", () => {
        loadLanguage(currentLang);
    });
    </script>

</body>
</html>
