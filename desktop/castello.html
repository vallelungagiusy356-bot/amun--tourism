<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pages.castle_page.title">Il Castello di Caccamo</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="castello.css">

    <meta name="description" content="Il Castello di Caccamo: storia, leggende e misteri raccontati dalla Castellana. Vivi un'esperienza immersiva tra poesia, video e chat interattiva.">
</head>

<body>

    <!-- 🎬 SFONDO VIDEO + OVERLAY -->
    <div class="scene-background-container">
        <video autoplay loop muted playsinline>
            <source src="img/video_castello.webm" type="video/webm">
            <source src="img/video_castello.mp4" type="video/mp4">
        </video>
        <div class="scene-overlay"></div>
    </div>

    <!-- 👑 DASHBOARD -->
    <header class="dashboard">
        <div class="logo-title" data-i18n="menu.title">Amunì Tourism</div>

        <nav class="nav-desktop">
            <a href="desktop_index.html" class="nav-item">Home</a>
            <a href="about.html" class="nav-item" data-i18n="menu.about">About</a>
            <a href="contact.html" class="nav-item" data-i18n="menu.contact">Contact</a>
        </nav>

        <div class="header-right-actions">
            <div class="lang-switcher">
                <button data-lang="it" class="active" title="Italiano">IT</button>
                <button data-lang="en" title="English">EN</button>
                <button data-lang="fr" title="Français">FR</button>
                <button data-lang="de" title="Deutsch">DE</button>
                <button data-lang="es" title="Español">ES</button>
            </div>

        </div>
    </header>

    <!-- 🏰 LAYOUT CENTRATO -->
    <main class="hero">
    <div class="hero-text">
        <span class="category-tag" data-i18n="pages.castle_page.category">Monumenti Storici</span>
        <h1 data-i18n="pages.castle_page.title">Il Castello di Caccamo</h1>
    </div>
    
    <section class="poesia-container">
        
        <!-- PARTE 1: La Poesia -->
        <div class="poesia-corpo">
            <p data-i18n="pages.castle_page.rhyme_1"></p>
            <p data-i18n="pages.castle_page.rhyme_2"></p>
            <p class="highlight-para" data-i18n="pages.castle_page.rhyme_3"></p>
        </div>

        <!-- IMMAGINE CENTRALE -->
        <figure class="castle-dress-inline">
            <img src="img/abito_clean.png" alt="Abito storico della Castellana" class="dress-img-inline" loading="lazy">
            <figcaption class="dress-caption-inline" data-i18n="pages.castle_page.dress_caption">
                L'abito della Castellana
            </figcaption>
        </figure>

        <!-- PARTE 2: La Descrizione (Prosa) -->
        <div class="poesia-corpo descrizione-storica">
            <p data-i18n="pages.castle_page.para_2"></p>
            <p class="highlight-para" data-i18n="pages.castle_page.para_3"></p>
        </div>

        <p class="poesia-outro">Lasciati guidare oltre le soglie del tempo...</p>
    </section>
</main>


    <!-- 👑 WIDGET CASTELLANA -->
    <div class="castellana-widget-area">
        <div class="castellana-video-wrapper" id="castellanaTrigger">
            <video class="castellana-video" autoplay loop muted playsinline>
                <source src="img/castellana_alpha.webm" type="video/webm">
            </video>
        </div>
        <div class="castellana-tooltip">Click to chat</div>
    </div>

    <!-- 💬 CHAT -->
    <div class="chat-desktop" id="chatDesktop">
        <header class="chat-header">
            <div class="avatar-status-dot"></div>
            <span id="chatTitle" data-i18n="chat.title">La Castellana</span>
            <button class="close-chat-btn" id="closeChatBtn">✕</button>
        </header>

        <div class="chat-messages" id="chatMessagesBox">
            <div class="message system-msg" data-i18n="pages.castle_page.welcomemsg_felicia">
                Benvenuto al Castello di Caccamo! Sono la tua guida custode. Chiedimi pure della Sala delle Congiure o dei fantasmi che abitano queste mura...
            </div>
        </div>

        <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="Scrivi alla Castellana..." data-i18n-placeholder="chat.placeholder">
            <button class="mic-btn">🎤</button>
        </div>
    </div>

    <script>
        // --- LOGICA CHAT ---
        const chat = document.getElementById("chatDesktop");
        const trigger = document.getElementById("castellanaTrigger");
        const closeBtn = document.getElementById("closeChatBtn");

        trigger.addEventListener("click", () => { chat.style.display = 'flex'; });
        closeBtn.addEventListener("click", () => { chat.style.display = 'none'; });

        // --- LOGICA LINGUA ---
        let currentLang = localStorage.getItem("lang") || "it";

        function loadLanguage(lang) {
            fetch(`./lang/${lang}.json`)
                .then(res => res.json())
                .then(data => {
                    document.querySelectorAll("[data-i18n]").forEach(el => {
                        const key = el.getAttribute("data-i18n");
                        const text = key.split('.').reduce((o,i) => o ? o[i] : null, data);
                        if (text) el.innerHTML = text;
                    });
                    document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
                        const key = el.getAttribute("data-i18n-placeholder");
                        const text = key.split('.').reduce((o,i) => o ? o[i] : null, data);
                        if (text) el.placeholder = text;
                    });
                    document.querySelectorAll(".lang-switcher button").forEach(btn => {
                        if (btn.dataset.lang === lang) btn.classList.add("active");
                        else btn.classList.remove("active");
                    });
                })
                .catch(err => console.error("Errore lingua:", err));
            localStorage.setItem("lang", lang);
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll(".lang-switcher button").forEach(btn => {
                btn.addEventListener("click", () => loadLanguage(btn.dataset.lang));
            });
            loadLanguage(currentLang);
        });
    </script>
</body>
</html>
