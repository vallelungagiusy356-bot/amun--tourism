<section id="castello-caccamo" class="castle-section">

  <div class="castle-hero">
    <div class="castle-visual">
      <img src="desktop/img/castello-clean.png"
           alt="Castello di Caccamo" class="castle-base">
      <!-- Futuro canvas 3D -->
      <canvas id="castle-3d"></canvas>
    </div>

    <div class="castle-text-panel">
      <h2 data-i18n="castle.title"></h2>
      <p data-i18n="castle.history"></p>
      <p data-i18n="castle.position"></p>
      <p data-i18n="castle.defense"></p>
      <p data-i18n="castle.conspiracy"></p>
      <p data-i18n="castle.prisons"></p>
      <p data-i18n="castle.legend_brothers"></p>
      <p data-i18n="castle.tunnel"></p>
    </div>
  </div>

  <div class="castle-dress-block">
    <div class="dress-image">
      <img src="desktop/img/abito_clean.png"
           alt="Abito d’epoca della Castellana">
    </div>
    <div class="dress-text-panel">
      <h3 data-i18n="castle.dress_title"></h3>
      <p data-i18n="castle.dress_text"></p>
    </div>
  </div>

</section>
