<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024">
    <title data-i18n="castle.title"></title>

    <!-- CSS PRINCIPALE -->
    <link rel="stylesheet" href="cittadino.css">
</head>

<body>

    <!-- SEZIONE CASTELLO CINEMATOGRAFICA -->
    <section class="castle-layout">

        <!-- CASTELLO GRANDE IN ALTO -->
        <div class="castle-top">
            <img src="img/castello-clean.png"
                 alt="Castello di Caccamo"
                 class="castle-main">
        </div>

        <!-- PANNELLO VETRO + GLOW -->
        <div class="castle-panel">
            <h2 data-i18n="castle.title"></h2>
            <ul>
                <li data-i18n="castle.position"></li>
                <li data-i18n="castle.defense"></li>
                <li data-i18n="castle.conspiracy"></li>
                <li data-i18n="castle.prisons"></li>
                <li data-i18n="castle.legend_brothers"></li>
            </ul>
        </div>

        <!-- ABITO IN BASSO A DESTRA -->
        <div class="castle-dress">
            <img src="img/abito_clean.png"
                 alt="Abito d’epoca della Castellana">
        </div>

    </section>

    <!-- SCRIPT MULTILINGUA -->
    <script>
    let currentLang = localStorage.getItem("lang") || "it";

    function loadLanguage(lang) {
        fetch(`../lang/${lang}.json`)
            .then(res => res.json())
            .then(data => {
                document.querySelectorAll("[data-i18n]").forEach(el => {
                    const key = el.getAttribute("data-i18n");
                    const text = key.split('.').reduce((o,i)=>o[i], data);
                    if (text) el.innerHTML = text;
                });
            });

        localStorage.setItem("lang", lang);
    }

    document.addEventListener("DOMContentLoaded", () => {
        loadLanguage(currentLang);
    });
    </script>

</body>
</html>
